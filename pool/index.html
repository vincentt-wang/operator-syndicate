<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);
--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin:6px 0 14px}
.when{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.when b{font-weight:700}
.when span{color:#AFC0D3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 0;min-width:140px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:700 .92rem var(--fb);border-radius:999px;padding:11px 14px;border:1.5px solid var(--or);cursor:pointer;background:none;color:inherit}
.btn.p{background:var(--or);color:#fff}
.btn.g{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.o{color:var(--or2);background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--tx2);font-size:.95rem}
.bar{display:flex;border-radius:10px;overflow:hidden;font-weight:700;font-size:.88rem;text-align:center}
.bar div{padding:10px 6px}
.bar .a{flex:10;background:var(--or);color:#fff}.bar .b{flex:8;background:var(--orp);color:var(--or2)}.bar .c{flex:2;background:#EEF1F4;color:var(--tx3)}
ol.st{list-style:none;counter-reset:s;margin-top:4px}
ol.st li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--line);color:var(--tx2);font-size:.95rem}
ol.st li:first-child{border-top:0}
ol.st li::before{content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
ol.st b{color:var(--tx);display:block}
.note{font-size:.85rem;color:var(--tx3);margin-top:8px}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}

.wrap{max-width:760px}
#lang{display:none}
.hero .sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:4px}
.hero .sum div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 6px;text-align:center}
.hero .sum b{display:block;font-size:1.35rem;font-family:var(--fd)}
.hero .sum span{font-size:.75rem;color:#AFC0D3}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 2px}
.chip{font:700 .82rem var(--fb);border:1.5px solid var(--line);background:#fff;color:var(--tx2);border-radius:999px;padding:6px 12px;cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.deal{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.deal summary{list-style:none;cursor:pointer;padding:14px 16px}
.deal summary::-webkit-details-marker{display:none}
.deal .hd{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.deal .lg{flex:none;width:48px;height:48px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx3)}
.deal .lg img{width:100%;height:100%;display:block}
.deal .hm{flex:1;min-width:0}
.deal .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal b{font-size:1.02rem}
.tg{flex:none;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.t0{background:var(--or);color:#fff}.t1{background:var(--orp);color:var(--or2)}.t2{background:#EEF1F4;color:var(--tx2)}.t3{background:#F3F4F6;color:#94A3B8}.t4{background:#E6F4EA;color:#1E7A3C}
.deal .sec{font-size:.8rem;color:var(--tx3);margin-top:2px}
.deal p{font-size:.92rem;color:var(--tx2)}
.marks{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mk{font-size:.74rem;border-radius:6px;padding:2px 7px;border:1px solid var(--line);color:var(--tx3)}
.mk.ok{border-color:#9FD3AF;color:#1E7A3C;background:#F1FAF3}.mk.mid{border-color:#F5C9A3;color:var(--or2);background:var(--orp)}.mk.no{color:#94A3B8;background:#F6F7F9}
.deal .more{font-size:.8rem;font-weight:700;color:var(--or2);margin-top:8px}
.deal[open] .more{display:none}
.bd{padding:0 16px 16px}
.bd h3{font-size:.8rem;color:var(--tx3);letter-spacing:.06em;margin:14px 0 6px}
.bd h3:first-child{margin-top:0}
.fit{display:grid;grid-template-columns:64px 18px 1fr;gap:6px 6px;font-size:.88rem;align-items:baseline}
.fit .d{font-weight:700}.fit .ok{color:#1E7A3C}.fit .mid{color:var(--or2)}.fit .no{color:#94A3B8}.fit .na{color:#94A3B8}
.bd ul{padding-left:18px;font-size:.9rem;color:var(--tx)}
.bd ul.fl{color:#9A3412}
.src{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:.86rem;background:#FAFBFC}
.src .pl{font-size:.72rem;font-weight:700;color:var(--tx3)}
.src dl{display:grid;grid-template-columns:52px 1fr;gap:3px 8px;margin:6px 0}
.src dt{color:var(--tx3)}
.src .ix{white-space:pre-wrap;color:var(--tx2);margin-top:4px}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lk a{font-size:.8rem;font-weight:700;color:var(--or2);text-decoration:none;border:1.5px solid var(--or);border-radius:999px;padding:4px 12px}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
.card ul{padding-left:18px;color:var(--tx2);font-size:.93rem}
.card li+li{margin-top:4px}
@media(max-width:520px){.hero .sum{grid-template-columns:repeat(3,1fr)}}
</style>
</head>

<script>
(function(){
  var b=document.getElementById('lang'),T={"zh":"一春內部","en":"EvoScale internal"};
  function set(l){
    document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l==='en'?'en':'zh-Hant';
    document.querySelectorAll('[data-zh]').forEach(function(e){e.innerHTML=e.getAttribute('data-'+l)});
    b.textContent=l==='en'?'中文':'English';document.title=T[l];
    try{localStorage.setItem('dr_lang',l)}catch(e){}
    if(window.drRender)window.drRender(l);
  }
  window.drLang=function(){return document.documentElement.getAttribute('data-lang')};
  var q=new URLSearchParams(location.search).get('lang'),s=null;try{s=localStorage.getItem('dr_lang')}catch(e){}
  var l=(q==='en'||q==='zh')?q:(s||'zh'); if(l!=='zh')set(l);
  b.addEventListener('click',function(){set(window.drLang()==='en'?'zh':'en')});
})();
</script>
<script>
(function(){
  var code=location.hash.replace(/^#/,''),el=document.getElementById('sealed'),X=null,cur='全部';
  if(!code||!window.crypto||!crypto.subtle)return;
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function e(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var raw=b64(el.textContent.trim());
  crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28))}).then(function(b){X=JSON.parse(new TextDecoder().decode(b));render()}).catch(function(){});
  var DIM=[['model','模式'],['stage','階段'],['round','本輪'],['help','幫得上']],SYM={ok:'✓',mid:'△',no:'✕',na:'？'};
  function card(t){
    var ti=X.tiers.indexOf(t.tier);
    var mk=DIM.map(function(d){var f=t.fit[d[0]];return '<span class="mk '+f[0]+'">'+d[1]+' '+SYM[f[0]]+'</span>'}).join('');
    var fit=DIM.map(function(d){var f=t.fit[d[0]];return '<span class="d">'+d[1]+'</span><span class="'+f[0]+'">'+SYM[f[0]]+'</span><span>'+e(f[1]||(f[0]==='na'?'查無':''))+'</span>'}).join('');
    var src=t.src.map(function(s){
      var r=[['成立',s.founded],['地點',s.hq],['市場',s.market],['產業',s.industry],['團隊',s.team]].filter(function(x){return x[1]});
      return '<div class="src"><div class="pl">'+X.pn+' '+e(s.pool)+'｜'+e(s.name)+'</div><dl>'+r.map(function(x){return '<dt>'+x[0]+'</dt><dd>'+e(x[1])+'</dd>'}).join('')+'</dl>'+(s.intro?'<div class="ix">'+e(s.intro)+'</div>':'')+'</div>'}).join('');
    var lk=(t.site?'<a href="'+e(t.site)+'" target="_blank" rel="noopener">官網 ↗</a>':'')+t.decks.map(function(u,i){return '<a href="'+e(u)+'" target="_blank" rel="noopener">簡報'+(t.decks.length>1?i+1:'')+' ↗</a>'}).join('');
    return '<details class="deal" data-t="'+e(t.tier)+'"><summary><div class="hd"><span class="lg">'+(t.logo?'<img src="'+t.logo+'" alt="">':e(t.name.charAt(0)))+'</span><div class="hm"><div class="top"><b>'+e(t.name)+'</b><span class="tg t'+ti+'">'+e(t.tier)+'</span></div><div class="sec">'+e(t.sec)+(t.pools.indexOf('投資組合')>=0?' · '+X.pn+' 投資組合':'')+'</div></div></div><p>'+e(t.line)+'</p><div class="marks">'+mk+'</div><div class="more">看完整資料與判斷 ↓</div></summary><div class="bd">'
      +'<h3>一春怎麼看</h3><div class="fit">'+fit+'</div>'
      +(t.ask.length?'<h3>見面先問</h3><ul>'+t.ask.map(function(a){return '<li>'+e(a)+'</li>'}).join('')+'</ul>':'')
      +(t.flags.length?'<h3>注意</h3><ul class="fl">'+t.flags.map(function(a){return '<li>'+e(a)+'</li>'}).join('')+'</ul>':'')
      +'<h3>'+X.pn+' 表上的原文</h3>'+src+(lk?'<div class="lk">'+lk+'</div>':'')+'</div></details>';
  }
  function render(){
    if(!X)return;
    if(!document.getElementById('sum')){document.getElementById('shell').innerHTML=X.shell;document.getElementById('shell2').innerHTML=X.shell2;document.title=X.pn+' 案源池｜一春內部'}
    document.getElementById('sum').innerHTML=X.tiers.map(function(x){return '<div><b>'+X.count[x]+'</b><span>'+x+'</span></div>'}).join('');
    document.getElementById('chips').innerHTML=['全部'].concat(X.tiers).map(function(x){return '<button type="button" class="chip'+(x===cur?' on':'')+'" data-c="'+x+'">'+x+(x==='全部'?'':' '+X.count[x])+'</button>'}).join('');
    document.getElementById('body').innerHTML=X.teams.filter(function(t){return cur==='全部'||t.tier===cur}).map(card).join('');
  }
  document.addEventListener('click',function(ev){var b=ev.target.closest('[data-c]');if(!b)return;cur=b.getAttribute('data-c');render()});
  window.drRender=render;
})();
</script>
