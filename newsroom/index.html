<style>
:root{--orange:#FF6600;--orange-2:#FF8C42;--orange-d:#E05500;--navy:#1B1714;--navy-2:#262019;
 --ink:#E8EDF2;--mut:#A99F90;--border:rgba(255,255,255,.1);
 --fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--navy);color:var(--ink);font-family:var(--fb);line-height:1.7;-webkit-font-smoothing:antialiased}
.top{background:var(--navy-2);border-bottom:1px solid var(--border);padding:1.1rem 6vw;position:sticky;top:0;z-index:10}
.top-in{max-width:920px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--fd);font-weight:800;color:#fff;font-size:1rem}
.lm{display:flex;flex-direction:column;gap:3px}
.lm b{height:2px;background:var(--orange);border-radius:2px;display:block}
.lm b:nth-child(1){width:11px}.lm b:nth-child(2){width:17px}.lm b:nth-child(3){width:11px}
.top-r{display:flex;align-items:center;gap:1.1rem}
.back{font-size:.86rem;color:var(--mut);text-decoration:none}
.back:hover{color:var(--orange)}
.lang{background:none;border:1px solid var(--orange);color:var(--orange);border-radius:18px;padding:4px 13px;font-size:.8rem;font-weight:700;cursor:pointer;font-family:inherit}
main{max-width:920px;margin:0 auto;padding:3.5rem 6vw 4rem}
.ey{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin-bottom:1.2rem}
h1{font-family:var(--fd);font-size:clamp(2.1rem,5.4vw,3.2rem);font-weight:900;line-height:1.12;letter-spacing:-.01em}
.lead{color:var(--mut);font-size:1.02rem;margin-top:1.1rem;max-width:62ch}

.tabs{display:flex;gap:.5rem;flex-wrap:wrap;margin:2.6rem 0 1.6rem;border-bottom:1px solid var(--border);padding-bottom:1rem}
.tab{background:none;border:1px solid var(--border);color:var(--mut);border-radius:20px;
 padding:.42rem 1rem;font-size:.86rem;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
.tab:hover{color:var(--ink);border-color:var(--mut)}
.tab.on{background:var(--orange);border-color:var(--orange);color:#fff}

.item{display:block;text-decoration:none;color:inherit;padding:1.5rem 0;border-bottom:1px solid var(--border)}
.item:hover .ti{color:var(--orange)}
.meta{display:flex;gap:.7rem;align-items:center;flex-wrap:wrap;font-size:.8rem;color:var(--mut)}
.kind{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:.72rem;
 border:1px solid var(--border);border-radius:4px;padding:1px 7px}
.kind.press{color:#7FB3E0;border-color:rgba(127,179,224,.35)}
.kind.pod{color:#C79BE8;border-color:rgba(199,155,232,.35)}
.kind.talk{color:#7FD6A8;border-color:rgba(127,214,168,.35)}
.kind.news{color:var(--orange-2);border-color:rgba(255,140,66,.35)}
.ti{font-size:1.14rem;font-weight:700;line-height:1.42;margin-top:.55rem;transition:.2s}
.dk{font-size:.92rem;color:var(--mut);margin-top:.45rem;line-height:1.55}
.src{font-size:.84rem;color:var(--orange);margin-top:.5rem}

.empty{border:1px dashed var(--border);border-radius:12px;padding:2.6rem 2rem;text-align:center;margin-top:1rem}
.empty .h{font-family:var(--fd);font-size:1.25rem;font-weight:800;color:var(--ink)}
.empty p{color:var(--mut);font-size:.94rem;margin-top:.7rem;line-height:1.6}
.empty a{color:var(--orange)}

.social{margin-top:3.4rem;border-top:1px solid var(--border);padding-top:2.4rem}
.social h2{font-family:var(--fd);font-size:1.4rem;font-weight:800}
.social p{color:var(--mut);font-size:.94rem;margin-top:.5rem}
.sl{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.3rem}
.sl a{display:inline-flex;align-items:center;gap:.55rem;text-decoration:none;color:var(--ink);
 border:1px solid var(--border);border-radius:24px;padding:.6rem 1.15rem;font-size:.92rem;font-weight:600;transition:.2s}
.sl a:hover{border-color:var(--orange);color:var(--orange)}
.sl svg{width:17px;height:17px;fill:currentColor}

.pitch{margin-top:3rem;background:var(--navy-2);border-left:3px solid var(--orange);
 border-radius:0 12px 12px 0;padding:1.6rem 1.8rem}
.pitch .h{font-weight:700;font-size:1rem}
.pitch p{color:var(--mut);font-size:.92rem;margin-top:.5rem;line-height:1.6}
.pitch a{color:var(--orange)}
footer{text-align:center;padding:2rem;color:var(--mut);font-size:.82rem;border-top:1px solid var(--border)}
</style></head><body>

        LinkedIn</a>

        <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>

<script src="items.js"></script>
<script>
var curF='all', L=localStorage.getItem('es-lang')||'zh';

function render(){
  var box=document.getElementById('list');
  var arr=(window.NEWS||[]).filter(function(x){return curF==='all'||x.kind===curF});
  arr.sort(function(a,b){return (b.date||'').localeCompare(a.date||'')});
  if(!arr.length){
    box.innerHTML='<div class="empty"><div class="h">'+
      (L==='zh'?'這一類還沒有內容':'Nothing here yet')+'</div><p>'+
      (L==='zh'?'我們只放查得到出處的報導與訪談。有新的露出會第一時間更新在這裡。<br>想邀訪請看下方聯絡方式。'
               :'We only list coverage we can source. New items appear here as they publish.')+
      '</p></div>';
    return;
  }
  var K={press:{zh:'媒體報導',en:'Press'},pod:{zh:'Podcast',en:'Podcast'},
         talk:{zh:'演講活動',en:'Talk'},news:{zh:'公司動態',en:'Update'}};
  box.innerHTML=arr.map(function(x){
    var t=(L==='zh'?x.zh:x.en)||x.zh||x.en||'';
    var d=(L==='zh'?x.dzh:x.den)||x.dzh||x.den||'';
    var out=x.url&&x.url!=='#';
    return '<a class="item"'+(out?' href="'+x.url+'" target="_blank" rel="noopener"':'')+'>'+
      '<div class="meta"><span class="kind '+x.kind+'">'+K[x.kind][L==='zh'?'zh':'en']+'</span>'+
      '<span>'+(x.date||'')+'</span>'+(x.outlet?'<span>·</span><span>'+x.outlet+'</span>':'')+'</div>'+
      '<div class="ti">'+t+'</div>'+(d?'<div class="dk">'+d+'</div>':'')+
      (out?'<div class="src">'+(L==='zh'?'看原文 →':'Read →')+'</div>':'')+'</a>';
  }).join('');
}
document.querySelectorAll('.tab').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    b.classList.add('on'); curF=b.dataset.f; render();
  };
});
function applyL(l){
  document.documentElement.lang = l==='zh'?'zh-Hant':'en';
  document.querySelectorAll('[data-en]').forEach(function(e){
    var v = l==='zh'? e.getAttribute('data-zh') : e.getAttribute('data-en');
    if(v!==null) e.innerHTML=v;
  });
  document.getElementById('lt').textContent = l==='zh'?'EN':'CH';
}
function toggleL(){ L = L==='zh'?'en':'zh'; localStorage.setItem('es-lang',L); applyL(L); render(); }
applyL(L); render();
</script>
</body></html>
