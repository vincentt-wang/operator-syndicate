name = "evoscale-apply"
main = "index.js"
compatibility_date = "2026-01-01"

# Direct the file bytes nowhere through the Worker — files go straight to R2 via
# presigned PUT. The Worker only writes answers.json (server-side) to this bucket.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "evoscale-submissions"

[vars]
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
R2_BUCKET = "evoscale-submissions"
NOTIFY_TO = "boice@evoscalecapital.com,vincent@evoscalecapital.com"

# Serve the API same-origin so the front-end can call /api/* with no CORS.
# Requires evoscalecapital.com to be an active zone on this Cloudflare account.
routes = [
  { pattern = "evoscalecapital.com/api/*", zone_name = "evoscalecapital.com" }
]

# Secrets are NOT stored here. Set them with:
#   wrangler secret put R2_ACCESS_KEY_ID
#   wrangler secret put R2_SECRET_ACCESS_KEY
#   wrangler secret put RESEND_API_KEY     # optional (skips email if unset)
