<style>
:root{
  --orange:#FF6600;--orange-2:#E55A00;--orange-3:#FF8C42;--orange-pale:#FFF7ED;
  --navy:#0A1628;--navy-2:#0F1E35;
  --text:#0B1623;--text-2:#2D3748;--text-3:#5A6A7A;--text-4:#94A3B8;
  --bg:#F7F9FB;--white:#FFFFFF;--border:rgba(11,22,35,.08);
  --fd:'Playfair Display','Noto Serif TC',serif;
  --fb:'DM Sans','Noto Sans TC',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fb);background:#000;color:var(--text);-webkit-font-smoothing:antialiased}
/* lang handled by JS innerHTML swap — no CSS display toggle */

/* ── DECK ── */
#deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .55s var(--ease),transform .55s var(--ease),visibility .55s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}
.slide.prev{transform:translateX(-40px)}
.slide.dark{background:var(--navy);color:#fff}
.slide.light{background:var(--bg)}
.slide.white{background:var(--white)}
.slide.amber{background:linear-gradient(160deg,#1C1005 0%,#130B03 60%,#0A0601 100%);color:#fff}

/* ── COMMON ── */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fb);font-size:1rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:2.5vh}
.slide.dark .eyebrow,.slide.amber .eyebrow{color:var(--orange-3)}
.eyebrow::before{content:'';width:32px;height:2px;background:currentColor;border-radius:2px}
.s-title{font-family:var(--fd);font-weight:800;font-size:clamp(2.5rem,5.5vw,5rem);line-height:1.04;letter-spacing:-.02em;margin-bottom:3vh}
.s-title em{font-style:normal;color:var(--orange)}
.slide.dark .s-title em,.slide.amber .s-title em{color:var(--orange-3)}
.s-sub{font-size:clamp(1.2rem,2.2vw,1.75rem);line-height:1.6;color:var(--text-3);max-width:60ch}
.slide.dark .s-sub,.slide.amber .s-sub{color:rgba(255,255,255,.6)}
.page-badge{position:absolute;top:5vh;left:8vw;font-family:var(--fb);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);opacity:.6}
.slide.dark .page-badge,.slide.amber .page-badge{color:var(--orange-3)}

/* ── HERO SLIDE ── */
.hero-slide{align-items:center;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-3);border:1px solid rgba(255,140,66,.35);border-radius:24px;padding:8px 22px;background:rgba(255,102,0,.08);margin-bottom:4vh}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--orange-3);box-shadow:0 0 10px var(--orange-3);animation:dpulse 2s ease-in-out infinite}
@keyframes dpulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-h1{font-family:var(--fd);font-weight:900;font-size:clamp(3.5rem,9vw,8rem);line-height:1.0;letter-spacing:-.03em;margin-bottom:4vh}
.hero-h1 .o{color:var(--orange)}
.hero-tag{font-size:clamp(1.1rem,2vw,1.5rem);color:rgba(255,255,255,.6);max-width:60ch;margin-bottom:5vh;line-height:1.6}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
.hero-slide>*{position:relative;z-index:1}

/* ── STATS ROW ── */
.stats-row{display:flex;gap:0;flex-wrap:wrap;margin-top:5vh;justify-content:center}
.stat{padding:0 3vw;text-align:center;border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,3.5vw,3rem);line-height:1;color:#fff}
.stat-l{font-size:.95rem;color:rgba(255,255,255,.4);margin-top:.6rem;letter-spacing:.04em}

/* ── 3-COL CARDS ── */
.cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;margin-top:5vh}
.p-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:3vh 2vw}
.slide.light .p-card,.slide.white .p-card{background:var(--white);border-color:var(--border);box-shadow:0 4px 24px rgba(0,0,0,.05)}
.p-card-num{font-family:var(--fd);font-size:2.5rem;font-weight:900;color:rgba(255,102,0,.25);line-height:1;margin-bottom:1.5vh}
.p-card h3{font-family:var(--fd);font-weight:800;font-size:clamp(1.3rem,2vw,1.7rem);margin-bottom:1.5vh;letter-spacing:-.01em}
.slide.dark .p-card h3{color:#fff}
.p-card p{font-size:clamp(1rem,1.3vw,1.2rem);line-height:1.6;color:var(--text-3)}
.slide.dark .p-card p{color:rgba(255,255,255,.55)}

/* ── COMPARISON TABLE ── */
.cmp-table{width:100%;border-collapse:collapse;margin-top:4vh;font-size:clamp(1rem,1.5vw,1.4rem)}
.cmp-table th,.cmp-table td{padding:2vh 1.5vw;text-align:left}
.cmp-table thead th{font-family:var(--fd);font-weight:700;color:var(--text-4);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--border)}
.cmp-table thead th.us{color:var(--orange);background:var(--orange-pale)}
.cmp-table tbody td{border-bottom:1px solid var(--border);color:var(--text-3)}
.cmp-table tbody td:first-child{font-family:var(--fd);font-weight:700;color:var(--text-2)}
.cmp-table .us-col{background:rgba(255,102,0,.05);color:var(--orange-2);font-weight:600;border-left:2px solid rgba(255,102,0,.2)}

/* ── TIER CARDS ── */
.tiers-2{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:5vh}
.tier-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:4vh 3vw}
.tier-label{font-size:.95rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-3);background:rgba(255,102,0,.12);border:1px solid rgba(255,102,0,.25);border-radius:8px;padding:5px 14px;display:inline-block;margin-bottom:2.5vh}
.tier-range{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,3.5vw,3.2rem);color:var(--orange-3);line-height:1;margin-bottom:1vh}
.tier-sub{font-size:1.2rem;color:rgba(255,255,255,.5)}

/* ── NETWORK SLIDE ── */
.net-slide{padding:0;overflow:hidden}
#net-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.net-overlay{position:absolute;top:8vh;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none;width:90%}
.net-tooltip{position:absolute;background:rgba(10,22,40,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,102,0,.35);border-radius:12px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.net-tooltip.vis{opacity:1}
.nt-co{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:.4rem}
.nt-t{font-size:1rem;color:rgba(255,255,255,.7)}

/* ── TRACK RECORD ── */
.tr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2vh 3vw;margin-top:5vh;max-width:60vw}
.tr-item{display:flex;align-items:center;gap:1rem;font-size:clamp(1.2rem,2vw,1.6rem);color:#fff}
.tr-item svg{width:28px;height:28px;color:var(--orange-3);flex-shrink:0}

/* ── QUOTE SLIDE ── */
.quote-big{font-family:var(--fd);font-style:italic;font-size:clamp(1.8rem,3.5vw,3rem);line-height:1.45;color:#fff;max-width:62ch;margin-bottom:5vh}
.quote-author{display:flex;align-items:center;gap:1.25rem}
.quote-author img{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--orange)}
.qa-name{font-family:var(--fd);font-weight:800;font-size:1.4rem;color:#fff}
.qa-role{font-size:1.05rem;color:var(--orange-3);margin-top:.3rem}

/* ── CTA SLIDE ── */
.cta-slide{align-items:center;text-align:center}
.cta-h{font-family:var(--fd);font-weight:900;font-size:clamp(3rem,7vw,6rem);line-height:1.05;color:#fff;margin-bottom:3vh}
.cta-h .o{color:var(--orange)}
.cta-sub{font-size:clamp(1.2rem,2vw,1.6rem);color:rgba(255,255,255,.55);margin-bottom:5vh}
.cta-link{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fd);font-weight:800;font-size:1.3rem;color:#fff;background:var(--orange);border-radius:56px;padding:20px 48px;text-decoration:none;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 32px rgba(255,102,0,.35)}
.cta-link:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 48px rgba(255,102,0,.5)}

/* ── PROGRESS + NAV ── */
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-3));z-index:100;transition:width .4s var(--ease)}
#pager{position:fixed;bottom:4vh;right:4vw;z-index:100;font-family:var(--fd);font-weight:700;font-size:1.1rem;color:var(--text-4);display:flex;align-items:center;gap:.5rem}
.slide.dark~#pager,body.dark-pager #pager{color:rgba(255,255,255,.5)}
#dots{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(120,120,120,.35);cursor:pointer;transition:all .25s}
.dot.active{background:var(--orange);width:28px;border-radius:5px}
#nav-arrows{position:fixed;bottom:4vh;left:4vw;z-index:100;display:flex;gap:.5rem}
.nav-arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(120,120,120,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);transition:all .2s}
.nav-arrow:hover{border-color:var(--orange);background:#fff}
.nav-arrow svg{width:18px;height:18px;color:var(--text-3)}
.nav-arrow:hover svg{color:var(--orange)}
#toggles{position:fixed;top:4vh;right:4vw;z-index:100;display:flex;gap:10px}
#lang-toggle{font-family:var(--fb);font-size:1rem;font-weight:700;letter-spacing:.06em;color:#fff;border:1.5px solid var(--orange);border-radius:22px;padding:8px 20px;cursor:pointer;background:var(--orange);box-shadow:0 4px 16px rgba(255,102,0,.35);transition:all .2s;white-space:nowrap}
#lang-toggle:hover{background:var(--orange-2);transform:scale(1.05)}
#aud-toggle{font-family:var(--fb);font-size:1rem;font-weight:700;letter-spacing:.06em;color:var(--orange-2);border:1.5px solid var(--orange);border-radius:22px;padding:8px 20px;cursor:pointer;background:rgba(255,255,255,.92);white-space:nowrap;transition:all .2s}
#aud-toggle:hover{background:#fff;transform:scale(1.05)}
.cards-2{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:5vh}
#hint{position:fixed;bottom:11vh;left:50%;transform:translateX(-50%);z-index:99;font-size:.85rem;color:var(--text-4);opacity:.7;animation:fade-hint 4s ease forwards 3s}
@keyframes fade-hint{to{opacity:0;visibility:hidden}}

@media(max-width:768px){
  .cards-3{grid-template-columns:1fr;gap:1.5vh}
  .tiers-2,.tr-grid{grid-template-columns:1fr}
  .cmp-table{font-size:.85rem}
  .slide{padding:8vh 6vw}
  .stat{padding:0 4vw}
}

.reasons-slide{padding:4vh 7vw!important}
.cards-6{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8vw;width:100%}
.r-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:3.6vh 2.3vw;display:flex;flex-direction:column;justify-content:flex-start;min-height:44vh;animation:rglow 7s ease-in-out infinite}
.r-ico{width:36px;height:36px;color:var(--orange);margin-bottom:1.6vh}
.r-ico svg{width:100%;height:100%}
.r-card h4{font-family:var(--fd);font-weight:700;font-size:clamp(1.4rem,1.85vw,1.75rem);color:#fff;margin-bottom:1.8vh;line-height:1.22;min-height:2.44em;text-wrap:balance}
.r-card p{font-size:clamp(1.18rem,1.5vw,1.55rem);color:rgba(255,255,255,.7);line-height:1.85}
@keyframes rglow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,0);border-color:rgba(255,255,255,.1)}50%{box-shadow:0 0 30px rgba(255,102,0,.2);border-color:rgba(255,102,0,.5)}}
.cards-6 .r-card:nth-child(1){animation-delay:0s}
.cards-6 .r-card:nth-child(2){animation-delay:1.17s}
.cards-6 .r-card:nth-child(3){animation-delay:2.33s}
.cards-6 .r-card:nth-child(4){animation-delay:3.5s}
.cards-6 .r-card:nth-child(5){animation-delay:4.67s}
.cards-6 .r-card:nth-child(6){animation-delay:5.83s}
.r-card .hl{color:var(--orange);font-weight:700}
.slide.white .r-card,.slide.light .r-card{background:var(--white);border-color:var(--border);box-shadow:0 6px 28px rgba(11,22,35,.07);animation:none}
.slide.white .r-card h4,.slide.light .r-card h4{color:var(--text)}
.slide.white .r-card p,.slide.light .r-card p{color:var(--text-3)}
.slide.white .r-card .hl,.slide.light .r-card .hl{color:var(--orange-2)}
.slide.white .quote-big{color:var(--text-2)}
.slide.white .qa-name{color:var(--text)}
.slide.white .qa-role{color:var(--orange-2)}

/* ── MOBILE (overrides all above) ── */
@media(max-width:768px){
  .slide{padding:80px 7vw 90px;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #toggles{top:3vh;right:5vw;gap:8px}
  #aud-toggle,#lang-toggle{padding:6px 14px;font-size:1rem}
  .hero-slide{justify-content:flex-start;text-align:center}
  .hero-badge{font-size:.68rem;padding:6px 14px;margin-bottom:3vh}
  .s-title{font-size:clamp(2rem,8vw,2.8rem)!important;margin-bottom:1.8vh}
  .s-sub{font-size:clamp(1.04rem,4.2vw,1.22rem)!important;max-width:100%}
  .hero-h1{font-size:clamp(2.8rem,13vw,4.2rem)}
  .hero-tag{font-size:clamp(1.05rem,4.5vw,1.3rem)}
  .hero-badge{font-size:.78rem;padding:7px 16px}
  .eyebrow{font-size:.82rem;margin-bottom:1.4vh}
  .page-badge{font-size:.72rem;top:3vh;left:7vw}
  .cards-2,.cards-3,.cards-6,.tiers-2,.tr-grid{grid-template-columns:1fr!important;gap:1.8vh!important}
  .tr-grid{max-width:100%}
  .reasons-slide{padding:80px 7vw 90px!important}
  .r-card{min-height:auto!important;padding:2.8vh 6vw!important}
  .r-card h4{min-height:auto!important;font-size:clamp(1.3rem,5.8vw,1.55rem)!important;margin-bottom:1.2vh}
  .r-card p{font-size:clamp(1.08rem,4.3vw,1.26rem)!important;line-height:1.62!important}
  .stats-row{flex-direction:column;gap:0;margin-top:3vh}
  .stat{border-right:none;border-bottom:1px solid rgba(255,255,255,.12);padding:1.6vh 0!important;width:100%}
  .stat:last-child{border-bottom:none}
  .tier-card{padding:3vh 6vw}
  .tier-range{font-size:clamp(1.8rem,8vw,2.4rem)}
  .quote-big{font-size:clamp(1.3rem,5.8vw,1.7rem)!important;line-height:1.5!important}
  .quote-author img{width:52px;height:52px}
  .cmp-table th,.cmp-table td{padding:1.2vh 2.5vw}
  .cta-link{font-size:1.05rem;padding:15px 30px}
  .net-overlay{top:5vh;width:94%}
}

/* ── INST DECK ADDITIONS（機構夥伴版專用；op 版無這些 class，零影響） ── */
@keyframes instRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.slide.active .inst-stagger>*{animation:instRise .6s var(--ease) both}
.slide.active .inst-stagger>*:nth-child(1){animation-delay:.12s}
.slide.active .inst-stagger>*:nth-child(2){animation-delay:.24s}
.slide.active .inst-stagger>*:nth-child(3){animation-delay:.36s}
.slide.active .inst-stagger>*:nth-child(4){animation-delay:.48s}
.slide.active .inst-stagger>*:nth-child(5){animation-delay:.6s}
.slide.active .inst-stagger>*:nth-child(6){animation-delay:.72s}

.inst-row-label{font-size:1rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text-4);margin:2.4vh 0 1.2vh}
.inst-shapes{padding:4vh 7vw!important}
.inst-shapes .cards-3{margin-top:0;gap:1.6vw}
.inst-shapes .p-card{padding:2.4vh 1.6vw}
.inst-sub-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6vw}
.sub-card{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:2vh 1.4vw;box-shadow:0 2px 12px rgba(11,22,35,.05)}
.sub-card h4{font-family:var(--fd);font-weight:700;font-size:clamp(1rem,1.35vw,1.25rem);margin-bottom:.8vh;white-space:nowrap;color:var(--text)}
.sub-card p{font-size:clamp(1rem,1.15vw,1.12rem);line-height:1.55;color:var(--text-3)}

.inst-spot{position:relative;isolation:isolate}
.inst-spot::before{content:'';position:absolute;inset:0;border-radius:inherit;padding:1.5px;background:radial-gradient(300px circle at var(--x,50%) var(--y,50%),rgba(255,102,0,.8) 0%,rgba(255,102,0,.22) 34%,transparent 64%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.inst-spot:hover::before{opacity:1}

.proof-wrap{display:grid;grid-template-columns:1fr 1.25fr;gap:4vw;align-items:center;margin-top:3vh}
.inv-num{font-family:var(--fd);font-weight:900;font-size:clamp(4rem,8vw,6.5rem);line-height:1;color:var(--orange-3);font-variant-numeric:tabular-nums}
.inv-line{font-size:clamp(1.05rem,1.5vw,1.3rem);color:rgba(255,255,255,.65);margin-top:1.2vh;max-width:34ch;line-height:1.6}
.proof-wrap .tr-grid{margin-top:0;max-width:none;grid-template-columns:1fr;gap:1.6vh}

.inst-marq-label{font-size:1rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.4);margin-top:4vh}
.inst-marq{overflow:hidden;margin-top:1.4vh;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.inst-marq-track{display:flex;align-items:center;width:max-content;animation:instMarq 36s linear infinite}
.inst-marq-track img{width:auto;margin-right:4vw;filter:brightness(0) invert(1);opacity:.6;flex-shrink:0}
@keyframes instMarq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

@media (prefers-reduced-motion:reduce){
  .slide.active .inst-stagger>*{animation:none}

var SHOW_OPERATOR_NAMES = false;

/* ── shared fragments (single-sourced across both audience decks) ── */
function heroStatsRow(){
  var s = C.stats;
  return `<div class="stats-row">
      <div class="stat"><div class="stat-n">${s.operators}</div><div class="stat-l" data-en="Senior Operators" data-zh="資深高管">Senior Operators</div></div>

      <div class="stat"><div class="stat-n">${s.cycleCut}</div><div class="stat-l" data-en="Cycle Cut" data-zh="縮短週期">Cycle Cut</div></div>

}
function netSlideHTML(o){
  return `<section class="slide net-slide dark">
    <div class="net-overlay">
      <div class="eyebrow" style="justify-content:center" data-en="${o.eyeEn}" data-zh="${o.eyeZh}">${o.eyeEn}</div>
      <h2 style="font-family:var(--fd);font-weight:800;font-size:clamp(2.2rem,4.5vw,3.8rem);color:#fff;letter-spacing:-.02em" data-en="${o.h2En}" data-zh="${o.h2Zh}">${o.h2En}</h2>
      <p style="font-size:1.2rem;color:rgba(255,255,255,.5);margin-top:1.5vh" data-en="${o.subEn}" data-zh="${o.subZh}">${o.subEn}</p>

    <canvas id="net-canvas"></canvas>
    <div id="net-tip" class="net-tooltip"><div id="nt-co" class="nt-co"></div><div id="nt-t" class="nt-t"></div></div>
  </section>`;
}

/* ════════ BUILD SLIDES · OPERATOR / LP 版 ════════ */
function slidesOpHTML(){
  var s = C.stats, b = C.brand;
  return [

  // 01 — HERO / POSITIONING
  `<section class="slide hero-slide dark">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-badge"><span data-en="Taiwan's First Operator-Led Syndicate · ${b.launch_en}" data-zh="全台首創 Operator-Led 投資飛輪 · ${b.launch_zh}">Taiwan's First Operator-Led Syndicate · ${b.launch_en}</span></div>
    <h1 class="hero-h1"><span data-en="${b.tagline_en_1}" data-zh="${b.tagline_zh_1}">${b.tagline_en_1}</span><br><span class="o" data-en="${b.tagline_en_2}" data-zh="${b.tagline_zh_2}">${b.tagline_en_2}</span></h1>
    <p class="hero-tag" data-en="${b.positioning_en}" data-zh="${b.positioning_zh}">${b.positioning_en}</p>
    ${heroStatsRow()}
  </section>`,

  // 02 — THE OPPORTUNITY (problem + why now + solution)
  `<section class="slide light">
    <div class="page-badge">01 · The Opportunity</div>
    <div class="eyebrow" data-en="The Opportunity" data-zh="市場機會">The Opportunity</div>
    <h2 class="s-title" data-en="Capital is everywhere.<br><em>Operators are rare.</em>" data-zh="資金到處都是。<br><em>懂業務的投資人沒幾個。</em>">Capital is everywhere.<br><em>Operators are rare.</em></h2>

    <p class="s-sub" style="margin-top:2.4vh;font-weight:700;color:#FF6600" data-en="Our answer: ${s.operators} senior operators co-invest, and sell alongside you." data-zh="我們的解法：${s.operators} 位資深高管共同投資，並親自陪你銷售。">Our answer: ${s.operators} senior operators co-invest, and sell alongside you.</p>
  </section>`,

  // 03 — THE OPERATOR NETWORK (live canvas)
  netSlideHTML({
    eyeEn:"The Operator Network", eyeZh:"高管網絡",
    h2En:`${s.operators} Operators. One Syndicate.`, h2Zh:`${s.operators} 位高管。一個飛輪。`,
    subEn:"VP, Director and GM-level · Fortune 500 tech giants and Taiwan's top 100 enterprises",
    subZh:"VP、Director 與 GM 級 · 世界 500 強科技巨頭與台灣百大企業"
  }),

  // 04 — THE MODEL (pillars + comparison)
  `<section class="slide light">
    <div class="page-badge">02 · The Model</div>
    <div class="eyebrow" data-en="The Model" data-zh="運作模式">The Model</div>
    <h2 class="s-title" style="margin-bottom:2vh" data-en="More than capital." data-zh="不只是資金。">More than capital.</h2>
    <div class="cards-3">
      ${C.pillars.map(function(p,i){return `<div class="p-card"><div class="p-card-num">0${i+1}</div><h3 data-en="${p.title_en}" data-zh="${p.title_zh}">${p.title_en}</h3><p data-en="${p.desc_en}" data-zh="${p.desc_zh}">${p.desc_en}</p></div>`}).join('')}

    <p class="s-sub" style="margin-top:3.5vh;text-align:center;max-width:900px;margin-left:auto;margin-right:auto" data-en="Unlike VCs who only write checks or accelerators who run demo days, our operators co-invest and sell alongside you." data-zh="不像只開支票的 VC，也不像辦 Demo Day 的加速器，我們的高管親自共同投資、陪你銷售。">Unlike VCs who only write checks or accelerators who run demo days, our operators co-invest and sell alongside you.</p>
  </section>`,

  // 05 — INVESTMENT (tiers + operator value)
  `<section class="slide dark">

    <div class="tiers-2">
      ${C.tiers.map(function(t){return `<div class="tier-card"><div class="tier-label" data-en="${t.label_en}" data-zh="${t.label_zh}">${t.label_en}</div><div class="tier-range" data-en="${t.range_en}" data-zh="${t.range_zh}">${t.range_en}</div><div class="tier-sub" data-en="${t.sub_en}" data-zh="${t.sub_zh}">${t.sub_en}</div></div>`}).join('')}

    <p class="s-sub" style="margin-top:1.5vh;font-weight:700;color:#FF6600" data-en="Monetize your influence: back the startups that grow our capital, and compound wealth together." data-zh="把你的影響力變現，扶植能壯大我們資本的新創團隊，一起累積財富。">Monetize your influence: back the startups that grow our capital, and compound wealth together.</p>
  </section>`,

  // 06a — WHY JOIN · the capital case (white)
  `<section class="slide white reasons-slide">
    <div class="page-badge">04 · The Invitation</div>
    <div class="eyebrow" data-en="Why Join the Founding Council" data-zh="為什麼加入創始委員會">Why Join the Founding Council</div>
    <h2 class="s-title" style="font-size:clamp(2.2rem,4vw,3.4rem);margin-bottom:.7vh" data-en="Capital that opens doors." data-zh="會開門的資本。">Capital that opens doors.</h2>
    <p class="s-sub" style="margin-bottom:2.4vh;font-size:clamp(1.05rem,1.4vw,1.25rem)" data-en="Risk-screened, access-driven, built for the valuation leap." data-zh="風控篩選、門路驅動，為估值躍升而生。">Risk-screened, access-driven, built for the valuation leap.</p>

span> sweet spot. Catalyze 10x in 18 months for outsized LP returns.</p></div></div>
  </section>`,

  // 06b — WHY JOIN · what you become (dark)
  `<section class="slide dark reasons-slide">
    <div class="page-badge">04 · The Invitation</div>
    <div class="eyebrow" data-en="Why Join the Founding Council" data-zh="為什麼加入創始委員會">Why Join the Founding Council</div>
    <h2 class="s-title" style="font-size:clamp(2.2rem,4vw,3.4rem);margin-bottom:.7vh" data-en="Influence that compounds." data-zh="會複利的影響力。">Influence that compounds.</h2>
    <p class="s-sub" style="margin-bottom:2.4vh;color:rgba(255,255,255,.55);font-size:clamp(1.05rem,1.4vw,1.25rem)" data-en="Become the expert, the authority, the force the market follows." data-zh="成為市場跟隨的專家、權威與戰力。">Become the expert, the authority, the force the market follows.</p>
    <div class="cards-6"><div class="r-card"><div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/></svg></div><h4 data-en="Become an Investment & Tech Expert" data-zh="變成投資及科技專家">Become an Investment & Tech Expert</h4><p data-en="Monthly lunch, three 15-min startup pitches. The Gem toolkit <span class='hl'>trains you to read teams, industries and opportunity</span>." data-zh="每月午餐聽三場 15 分鐘新創簡報，Gem 工具<span class='hl'>幫你學會看團隊、產業與機會</span>。">Monthly lunch, three 15-min startup pitches. The Gem toolkit <span class='hl'>trains you to read teams, industries and opportunity</span>.</p></div><div class="r-card"><div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6"/></svg></div><h4 data-en="Thought Leadership: Industry Authority" data-zh="思想領袖：變成產業專家">Thought Leadership: Industry Authority</h4><p data-en="Turn influence into an <span class='hl'>asset</span>: we help you publish monthly AI and industry-trend pieces, so the group stays ahead of where the industry is heading." data-zh="把影響力<span class='hl'>資產化</span>：我們協助你每月發表 AI 與未來趨勢文章，和大家一起緊跟產業走向。">Turn influence into an <span class='hl'>asset</span>: we help you publish monthly AI and industry-trend pieces, so the group stays ahead of where the industry is heading.</p></div><div class="r-card"><div class="r-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div><h4 data-en="Human Leverage: GTM Task Force" data-zh="人力槓桿：GTM 特遣隊">Human Leverage: GTM Task Force</h4><p data-en="Taiwan's strongest <span class='hl'>senior-sales community</span>, a moat VCs can't replicate. targeting <span class='hl'>50+</span> members in 2026, <span class='hl'>150+</span> in 2027." data-zh="全台最強<span class='hl'>高階業務社群</span>，傳統 VC 無法複製的執行護城河。2026 年目標 <span class='hl'>50+ 會員</span>、2027 年目標 <span class='hl'>150+</span>。">Taiwan's strongest <span class='hl'>senior-sales community</span>, a moat VCs can't replicate. targeting <span class='hl'>50+</span> members in 2026, <span class='hl'>150+</span> in 2027.</p></div></div>
  </section>`,

  // 07 — VISION & CTA (founder quote + cta)
  `<section class="slide white">
    <div class="page-badge">05 · The Vision</div>
    <p class="quote-big" style="font-size:clamp(1.3rem,2.4vw,2rem);line-height:1.42" data-en="&ldquo;I spent 20 years on the front lines of enterprise sales. That experience helped guide three startups to successful exits. There are others with the same business instinct, and the market needs a platform to help more startups. That's EvoScale Capital.&rdquo;" data-zh="「我在企業業務最前線待了 20 年。這些經驗讓我成功幫助三間新創出場。我一直想，市場上有更多人擁有同樣的商業思維，而市場需要一個平台來幫助更多新創。這就是 EvoScale Capital。」">&ldquo;I spent 20 years on the front lines of enterprise sales. That experience helped guide three startups to successful exits. There are others with the same business instinct, and the market needs a platform to help more startups. That's EvoScale Capital.&rdquo;</p>
    <div class="quote-author">
      <img src="Team/Boice.jpg" alt="${C.founderQuote.name}" style="object-fit:cover;object-position:52% 16%">
      <div><div class="qa-name">${C.founderQuote.name}</div><div class="qa-role" data-en="${C.founderQuote.role_en}" data-zh="${C.founderQuote.role_zh}">${C.founderQuote.role_en}</div></div>
    </div>
    <a class="cta-link" href="https://evoscalecapital.com" target="_blank" style="margin-top:4vh"><span data-en="Don't just invest. Scale. Visit EvoScale Capital →" data-zh="不只是投資，一起做大。造訪官網 →">Don't just invest. Scale. Visit EvoScale Capital →</span></a>
  </section>`,

  ];
}

/* ════════ BUILD SLIDES · 機構夥伴版 (institution-agnostic) ════════ */
function slidesInstHTML(){
  var s = C.stats, b = C.brand;
  return [

  // I-01 — HERO
  `<section class="slide hero-slide dark">
    <canvas id="hero-canvas"></canvas>

    ${heroStatsRow()}
  </section>`,

  // I-02 — THE GAP (market-level statement, no second person)
  `<section class="slide light">
    <div class="page-badge">01 · Enterprise Access</div>
    <div class="eyebrow" data-en="Enterprise Access" data-zh="企業准入">Enterprise Access</div>

    <p class="s-sub" style="margin-top:2.4vh;font-weight:700;color:#FF6600" data-en="That last step is what our ${s.operators} operators do for a living." data-zh="這最後一步，正是我們 ${s.operators} 位高管每天在做的事。">That last step is what our ${s.operators} operators do for a living.</p>
  </section>`,

  // I-03 — THE NETWORK (live canvas)
  netSlideHTML({
    eyeEn:"The Operator Network", eyeZh:"高管網絡",
    h2En:`${s.operators} Operators. The Way In.`, h2Zh:`${s.operators} 位高管，就是門路。`,
    subEn:"VP, Director and GM-level · Fortune 500 tech giants and Taiwan's top 100 enterprises",
    subZh:"VP、Director 與 GM 級 · 世界 500 強科技巨頭與台灣百大企業"
  }),

  // I-04 — CAPITAL THAT OPENS DOORS
  `<section class="slide white reasons-slide">

/* ════════ RENDER ════════ */
function buildDots(){
  dotsWrap.innerHTML = '';
  slides.forEach(function(_,i){
    var d = document.createElement('div'); d.className='dot'; d.onclick=function(){go(i)};
    dotsWrap.appendChild(d);
  });
  dots = Array.from(dotsWrap.children);
}
function destroyCanvases(){
  teardowns.forEach(function(f){ f(); });
  teardowns = [];
}
function setAudBtn(){
  var btn = document.getElementById('aud-toggle');
  if(audience === 'inst'){ btn.setAttribute('data-en','For Operators'); btn.setAttribute('data-zh','Operator 版'); }
  else { btn.setAttribute('data-en','For Institutions'); btn.setAttribute('data-zh','機構夥伴版'); }
}
function renderDeck(){
  destroyCanvases();
  deck.innerHTML = (audience === 'inst' ? slidesInstHTML() : slidesOpHTML()).join('');
  slides = Array.from(deck.querySelectorAll('.slide'));
  total = slides.length;
  cur = 0;
  document.getElementById('pg-total').textContent = total;
  buildDots();
  var t = initHeroCanvas(); if(t) teardowns.push(t);
  t = initNetCanvas();      if(t) teardowns.push(t);
  t = initInstAnim();       if(t) teardowns.push(t);
  setAudBtn();
}
function toggleAudience(){
  audience = (audience === 'op') ? 'inst' : 'op';
  try{ localStorage.setItem('evoPitchAud', audience); }catch(e){}
  renderDeck();
  go(0);
}

function go(n){
  n = Math.max(0, Math.min(total-1, n));
  slides[cur].classList.remove('active');
  slides[cur].classList.toggle('prev', n>cur);
  cur = n;
  slides[cur].classList.add('active');
  slides[cur].classList.remove('prev');
  dots.forEach(function(d,i){d.classList.toggle('active',i===cur)});
  document.getElementById('progress').style.width = ((cur+1)/total*100)+'%';
  document.getElementById('pg-cur').textContent = cur+1;
  // pager color based on slide bg
  var darkSlide = slides[cur].classList.contains('dark')||slides[cur].classList.contains('amber');
  document.body.classList.toggle('dark-pager', darkSlide);
  applyLang(lang);
  try{localStorage.setItem('evoPitchSlide',cur);history.replaceState(null,'','#'+(audience==='inst'?'i':'s')+cur);}catch(e){}
}

/* ════════ KEYBOARD + TOUCH ════════ */
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Home'){go((function(){try{return parseInt(localStorage.getItem('evoPitchSlide'))||0;}catch(e){return 0;}})());}
  else if(e.key==='End'){go(total-1);}
});
var tStartX=0;
document.addEventListener('touchstart',function(e){tStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tStartX;
  if(Math.abs(dx)>50){go(dx<0?cur+1:cur-1);}
},{passive:true});
// Wheel navigation (debounced)
var wheelLock=false;
document.addEventListener('wheel',function(e){
  if(wheelLock)return;
  if(Math.abs(e.deltaY)<20)return;
  wheelLock=true;
  go(e.deltaY>0?cur+1:cur-1);
  setTimeout(function(){wheelLock=false;},700);
},{passive:true});

/* ════════ LANG ════════ */
function applyLang(l){
  lang=l;
  document.documentElement.setAttribute('data-lang',l);
  document.querySelectorAll('[data-en],[data-zh]').forEach(function(el){
    var v=l==='zh'?el.getAttribute('data-zh'):el.getAttribute('data-en');
    if(v!==null&&v!=='')el.innerHTML=v;
  });
  document.getElementById('lang-toggle').textContent = l==='en'?'CH':'EN';
}
function toggleLang(){applyLang(lang==='en'?'zh':'en');}

/* ════════ HERO CANVAS (network mesh) ════════ */
function initHeroCanvas(){
  var canvas=document.getElementById('hero-canvas');if(!canvas)return null;
  var host=canvas.closest('.slide');var dead=false;
  var ctx=canvas.getContext('2d'),W=0,H=0,t=0,N=24,nodes=[];
  function build(){nodes=[];for(var i=0;i<N;i++){var x=Math.random()*W,y=Math.random()*H;nodes.push({x:x,y:y,ox:x,oy:y,ph:Math.random()*6.28,sp:.2+Math.random()*.3});}}
  function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.offsetWidth;H=canvas.offsetHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);build();}
  function loop(){if(dead)return;requestAnimationFrame(loop);if(!host.classList.contains('active')){return;}ctx.clearRect(0,0,W,H);t+=.006;
    nodes.forEach(function(nd){nd.x=nd.ox+Math.sin(t*nd.sp+nd.ph)*40;nd.y=nd.oy+Math.cos(t*nd.sp*.7+nd.ph)*26;});
    for(var i=0;i<nodes.length;i++){var sp=.5+.5*Math.sin(t*2+i);
      for(var j=i+1;j<nodes.length;j++){var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<200){ctx.strokeStyle='rgba(255,102,0,'+((1-d/200)*.12).toFixed(3)+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();}}}
    nodes.forEach(function(nd,i){var g=ctx.createRadialGradient(nd.x,nd.y,0,nd.x,nd.y,8);var sp=.5+.5*Math.sin(t*2.5+i*.7);g.addColorStop(0,'rgba(255,150,50,'+(.5*sp+.2)+')');g.addColorStop(1,'rgba(255,100,0,0)');ctx.beginPath();ctx.arc(nd.x,nd.y,8,0,6.28);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(nd.x,nd.y,2,0,6.28);ctx.fillStyle='rgba(255,210,140,.8)';ctx.fill();});
  }
  resize();window.addEventListener('resize',resize);loop();
  return function(){dead=true;window.removeEventListener('resize',resize);};
}

/* ════════ NETWORK SLIDE CANVAS (orbital, from main site) ════════ */
function initNetCanvas(){
  var canvas=document.getElementById('net-canvas');if(!canvas)return null;
  var host=canvas.closest('.slide');var dead=false;
  var ctx=canvas.getContext('2d'),W=0,H=0,mx=-9999,my=-9999,hovI=-1,frame=0;
  var OPS=C.operators.filter(function(o){return o.companyKey!=='team';});
  OPS.forEach(function(op){if(!op.imgEl){op.imgEl=new Image();op.imgEl.crossOrigin='anonymous';op.imgEl.src='https://i.pravatar.cc/100?img='+op.img;op.loaded=false;op.imgEl.onload=function(){op.loaded=true;};}});
  var RINGS=[{R:0,sp:.0006,tilt:.28,dir:1},{R:0,sp:.001,tilt:-.22,dir:-1},{R:0,sp:.0014,tilt:.32,dir:1},{R:0,sp:.0018,tilt:-.18,dir:-1}];
  var nodes=[],CX=0,CY=0,BR=0,prevHov=-1;
  function pickNear(idx){var b=-1,bd=Infinity;nodes.forEach(function(n,i){if(i===idx)return;var dx=nodes[idx].x-n.x,dy=nodes[idx].y-n.y,d=dx*dx+dy*dy;if(d<bd){bd=d;b=i;}});return b;}
  function init(){CX=W/2;CY=H/2+30;BR=Math.min(W,H)*.36;RINGS[0].R=BR*1.05;RINGS[1].R=BR*.8;RINGS[2].R=BR*.56;RINGS[3].R=BR*.3;
    nodes=OPS.map(function(op,idx){var ring=Math.min(Math.floor(idx/5),3),pos=idx-ring*5;return{op:op,ring:(3-ring),angle:pos*1.256+ring*.7,x:0,y:0,r:26,alpha:0,sx:null,sy:null};});}
  function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.offsetWidth;H=canvas.offsetHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);init();}
  canvas.addEventListener('mousemove',function(e){var r=canvas.getBoundingClientRect();mx=(e.clientX-r.left)*(W/r.width);my=(e.clientY-r.top)*(H/r.height);});
  canvas.addEventListener('mouseleave',function(){mx=-9999;my=-9999;hovI=-1;});
  var tip=document.getElementById('net-tip'),tCo=document.getElementById('nt-co'),tT=document.getElementById('nt-t');
  function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
  function loop(){if(dead)return;requestAnimationFrame(loop);
    if(!host.classList.contains('active')){return;}
    ctx.clearRect(0,0,W,H);frame++;
    hovI=-1;var mD=9999;nodes.forEach(function(n,i){var dx=n.x-mx,dy=n.y-my,d=Math.sqrt(dx*dx+dy*dy);if(d<n.r*2.5&&d<mD){mD=d;hovI=i;}});
    nodes.forEach(function(n,i){n.alpha=Math.min(1,n.alpha+.012);var ring=RINGS[n.ring];
      if(i===hovI&&mx>-9000){if(n.sx===null){n.sx=n.x;n.sy=n.y;}n.sx+=(mx-n.sx)*.1;n.sy+=(my-n.sy)*.1;n.x=n.sx;n.y=n.sy;n.angle+=ring.sp*ring.dir*.3;}
      else{n.sx=null;n.angle+=ring.sp*ring.dir;n.x=CX+ring.R*Math.cos(n.angle);n.y=CY+ring.R*Math.sin(n.angle)*Math.cos(ring.tilt);}});
    // connections
    var near={};for(var i=0;i<nodes.length;i++){var ds=[];for(var j=0;j<nodes.length;j++){if(i===j)continue;var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y;ds.push({j:j,d:dx*dx+dy*dy});}ds.sort(function(a,b){return a.d-b.d;});near[i]=ds.slice(0,2).map(function(x){return x.j;});}
    var drawn={};for(var i=0;i<nodes.length;i++){near[i].forEach(function(j){var k=Math.min(i,j)+'-'+Math.max(i,j);if(drawn[k])return;drawn[k]=1;var nh=i===hovI||j===hovI;var pl=.5+.5*Math.sin(frame*.018+i*.8+j*.5);var al=nh?.6:pl*.12+.04;if(nh){var c=rgb(nodes[hovI].op.color);ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')';}else ctx.strokeStyle='rgba(255,255,255,'+al.toFixed(3)+')';ctx.lineWidth=nh?1.8:.7;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();});}
    // nodes
    nodes.forEach(function(n,i){var isH=i===hovI,r=isH?n.r*1.7:n.r;ctx.save();ctx.globalAlpha=n.alpha;
      if(isH){ctx.shadowColor=n.op.color;ctx.shadowBlur=24;
        if(n.op.loaded){ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.clip();ctx.drawImage(n.op.imgEl,n.x-r,n.y-r,r*2,r*2);ctx.restore();ctx.save();ctx.globalAlpha=n.alpha;}
        else{ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.fillStyle=n.op.color;ctx.fill();}
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.strokeStyle=n.op.color;ctx.lineWidth=3;ctx.stroke();
      }else{ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.fillStyle=n.op.color;ctx.fill();ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.round(r*.5)+'px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((SHOW_OPERATOR_NAMES?n.op.name:n.op.company).split(' ')[0].slice(0,2).toUpperCase(),n.x,n.y);}
      ctx.restore();
      ctx.save();ctx.globalAlpha=n.alpha*(isH?.95:.6);ctx.fillStyle=isH?'#fff':n.op.color;ctx.font=(isH||n.op.confirmed?'bold ':'')+'13px DM Sans';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText((isH&&SHOW_OPERATOR_NAMES)?n.op.name:n.op.company,n.x,n.y+r+8);ctx.restore();});
    // tooltip
    if(hovI>=0){var n=nodes[hovI],cr=canvas.getBoundingClientRect();tip.style.left=(n.x*(cr.width/W)+50)+'px';tip.style.top=(n.y*(cr.height/H)-20)+'px';if(tCo){tCo.textContent=n.op.company;tCo.style.background=n.op.color+'22';tCo.style.color=n.op.color;}if(tT)tT.innerHTML=(SHOW_OPERATOR_NAMES?'<strong style="color:#fff;display:block">'+n.op.name+'</strong>':'')+n.op.title;tip.classList.add('vis');}else tip.classList.remove('vis');
  }
  resize();window.addEventListener('resize',resize);loop();
  return function(){dead=true;window.removeEventListener('resize',resize);};
}

/* ════════ INST DECK ANIMATIONS（機構版限定；op 版找不到目標元素，立即回傳 null） ════════ */
function initInstAnim(){
  var numEl = document.getElementById('inv-num');
  var hasSpot = !!deck.querySelector('.inst-spot');
  if(!numEl && !hasSpot) return null;
  var dead = false, rafId = 0, played = false, mo = null;

  if(numEl){
    var slideEl = numEl.closest('.slide');
    var final = parseInt(numEl.dataset.final, 10), suffix = numEl.dataset.suffix || '';
    var play = function(){
      if(played || dead) return; played = true;
      var t0 = null;
      var step = function(now){
        if(dead) return;
        if(t0 === null) t0 = now;
        var t = Math.min(1, (now - t0) / 900), e = 1 - Math.pow(1 - t, 3);
        numEl.textContent = Math.round(final * e) + suffix;
        if(t < 1) rafId = requestAnimationFrame(step);
      };
      rafId = requestAnimationFrame(step);
    };
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ played = true; }
    else{
      mo = new MutationObserver(function(){ if(slideEl.classList.contains('active')) play(); });
      mo.observe(slideEl, {attributes:true, attributeFilter:['class']});
      if(slideEl.classList.contains('active')) play();
    }
  }

  var onMove = null;
  if(hasSpot){
    onMove = function(e){
      var card = e.target.closest ? e.target.closest('.inst-spot') : null;
      if(!card) return;
      var r = card.getBoundingClientRect();
      card.style.setProperty('--x', (e.clientX - r.left) + 'px');
      card.style.setProperty('--y', (e.clientY - r.top) + 'px');
    };
    deck.addEventListener('pointermove', onMove);
  }

  return function(){
    dead = true;
    if(mo) mo.disconnect();
    if(rafId) cancelAnimationFrame(rafId);
    if(onMove) deck.removeEventListener('pointermove', onMove);
  };
}

/* ════════ INIT ════════ */
deck = document.getElementById('deck');

  try{

             n: parseInt(localStorage.getItem('evoPitchSlide'))||0 };
  }catch(e){ return {aud:'op', n:0}; }
})();
audience = _init.aud;
renderDeck();
go(_init.n);
