<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvoScale Capital — Pitch Deck</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23FF6600'/%3E%3Ctext x='50' y='71' font-family='Georgia,serif' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=DM+Sans:wght@400;500;600;700&family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#FF6600;--orange-2:#E55A00;--orange-3:#FF8C42;--orange-pale:#FFF7ED;
  --navy:#0A1628;--navy-2:#0F1E35;
  --text:#0B1623;--text-2:#2D3748;--text-3:#5A6A7A;--text-4:#94A3B8;
  --bg:#F7F9FB;--white:#FFFFFF;--border:rgba(11,22,35,.08);
  --fd:'Playfair Display','Noto Serif TC',serif;
  --fb:'DM Sans','Noto Sans TC',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:var(--fb);background:#000;color:var(--text);-webkit-font-smoothing:antialiased}
/* lang handled by JS innerHTML swap — no CSS display toggle */

/* ── DECK ── */
#deck{position:relative;width:100vw;height:100vh;overflow:hidden}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:6vh 8vw;opacity:0;visibility:hidden;transform:translateX(40px);transition:opacity .55s var(--ease),transform .55s var(--ease),visibility .55s;overflow:hidden}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}
.slide.prev{transform:translateX(-40px)}
.slide.dark{background:var(--navy);color:#fff}
.slide.light{background:var(--bg)}
.slide.white{background:var(--white)}
.slide.amber{background:linear-gradient(160deg,#1C1005 0%,#130B03 60%,#0A0601 100%);color:#fff}

/* ── COMMON ── */
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fb);font-size:1rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin-bottom:2.5vh}
.slide.dark .eyebrow,.slide.amber .eyebrow{color:var(--orange-3)}
.eyebrow::before{content:'';width:32px;height:2px;background:currentColor;border-radius:2px}
.s-title{font-family:var(--fd);font-weight:800;font-size:clamp(2.5rem,5.5vw,5rem);line-height:1.04;letter-spacing:-.02em;margin-bottom:3vh}
.s-title em{font-style:normal;color:var(--orange)}
.slide.dark .s-title em,.slide.amber .s-title em{color:var(--orange-3)}
.s-sub{font-size:clamp(1.2rem,2.2vw,1.75rem);line-height:1.6;color:var(--text-3);max-width:60ch}
.slide.dark .s-sub,.slide.amber .s-sub{color:rgba(255,255,255,.6)}
.page-badge{position:absolute;top:5vh;left:8vw;font-family:var(--fb);font-size:.85rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);opacity:.6}
.slide.dark .page-badge,.slide.amber .page-badge{color:var(--orange-3)}

/* ── HERO SLIDE ── */
.hero-slide{align-items:center;text-align:center}
.hero-badge{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--orange-3);border:1px solid rgba(255,140,66,.35);border-radius:24px;padding:8px 22px;background:rgba(255,102,0,.08);margin-bottom:4vh}
.hero-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--orange-3);box-shadow:0 0 10px var(--orange-3);animation:dpulse 2s ease-in-out infinite}
@keyframes dpulse{0%,100%{opacity:1}50%{opacity:.4}}
.hero-h1{font-family:var(--fd);font-weight:900;font-size:clamp(3.5rem,9vw,8rem);line-height:1.0;letter-spacing:-.03em;margin-bottom:4vh}
.hero-h1 .o{color:var(--orange)}
.hero-tag{font-size:clamp(1.1rem,2vw,1.5rem);color:rgba(255,255,255,.6);max-width:60ch;margin-bottom:5vh;line-height:1.6}
#hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;opacity:.55}
.hero-slide>*{position:relative;z-index:1}

/* ── STATS ROW ── */
.stats-row{display:flex;gap:0;flex-wrap:wrap;margin-top:5vh;justify-content:center}
.stat{padding:0 3vw;text-align:center;border-right:1px solid rgba(255,255,255,.12)}
.stat:last-child{border-right:none}
.stat-n{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,3.5vw,3rem);line-height:1;color:#fff}
.stat-l{font-size:.95rem;color:rgba(255,255,255,.4);margin-top:.6rem;letter-spacing:.04em}

/* ── 3-COL CARDS ── */
.cards-3{display:grid;grid-template-columns:repeat(3,1fr);gap:2vw;margin-top:5vh}
.p-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:3vh 2vw}
.slide.light .p-card,.slide.white .p-card{background:var(--white);border-color:var(--border);box-shadow:0 4px 24px rgba(0,0,0,.05)}
.p-card-num{font-family:var(--fd);font-size:2.5rem;font-weight:900;color:rgba(255,102,0,.25);line-height:1;margin-bottom:1.5vh}
.p-card h3{font-family:var(--fd);font-weight:800;font-size:clamp(1.3rem,2vw,1.7rem);margin-bottom:1.5vh;letter-spacing:-.01em}
.slide.dark .p-card h3{color:#fff}
.p-card p{font-size:clamp(1rem,1.3vw,1.2rem);line-height:1.6;color:var(--text-3)}
.slide.dark .p-card p{color:rgba(255,255,255,.55)}

/* ── COMPARISON TABLE ── */
.cmp-table{width:100%;border-collapse:collapse;margin-top:4vh;font-size:clamp(1rem,1.5vw,1.4rem)}
.cmp-table th,.cmp-table td{padding:2vh 1.5vw;text-align:left}
.cmp-table thead th{font-family:var(--fd);font-weight:700;color:var(--text-4);font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;border-bottom:2px solid var(--border)}
.cmp-table thead th.us{color:var(--orange);background:var(--orange-pale)}
.cmp-table tbody td{border-bottom:1px solid var(--border);color:var(--text-3)}
.cmp-table tbody td:first-child{font-family:var(--fd);font-weight:700;color:var(--text-2)}
.cmp-table .us-col{background:rgba(255,102,0,.05);color:var(--orange-2);font-weight:600;border-left:2px solid rgba(255,102,0,.2)}

/* ── TIER CARDS ── */
.tiers-2{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:5vh}
.tier-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:4vh 3vw}
.tier-label{font-size:.95rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--orange-3);background:rgba(255,102,0,.12);border:1px solid rgba(255,102,0,.25);border-radius:8px;padding:5px 14px;display:inline-block;margin-bottom:2.5vh}
.tier-range{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,3.5vw,3.2rem);color:var(--orange-3);line-height:1;margin-bottom:1vh}
.tier-sub{font-size:1.2rem;color:rgba(255,255,255,.5)}

/* ── NETWORK SLIDE ── */
.net-slide{padding:0;overflow:hidden}
#net-canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
.net-overlay{position:absolute;top:8vh;left:50%;transform:translateX(-50%);text-align:center;z-index:2;pointer-events:none;width:90%}
.net-tooltip{position:absolute;background:rgba(10,22,40,.95);backdrop-filter:blur(10px);border:1px solid rgba(255,102,0,.35);border-radius:12px;padding:12px 16px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:10}
.net-tooltip.vis{opacity:1}
.nt-co{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:10px;display:inline-block;margin-bottom:.4rem}
.nt-t{font-size:1rem;color:rgba(255,255,255,.7)}

/* ── TRACK RECORD ── */
.tr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2vh 3vw;margin-top:5vh;max-width:60vw}
.tr-item{display:flex;align-items:center;gap:1rem;font-size:clamp(1.2rem,2vw,1.6rem);color:#fff}
.tr-item svg{width:28px;height:28px;color:var(--orange-3);flex-shrink:0}

/* ── QUOTE SLIDE ── */
.quote-big{font-family:var(--fd);font-style:italic;font-size:clamp(1.8rem,3.5vw,3rem);line-height:1.45;color:#fff;max-width:62ch;margin-bottom:5vh}
.quote-author{display:flex;align-items:center;gap:1.25rem}
.quote-author img{width:64px;height:64px;border-radius:50%;border:2.5px solid var(--orange)}
.qa-name{font-family:var(--fd);font-weight:800;font-size:1.4rem;color:#fff}
.qa-role{font-size:1.05rem;color:var(--orange-3);margin-top:.3rem}

/* ── CTA SLIDE ── */
.cta-slide{align-items:center;text-align:center}
.cta-h{font-family:var(--fd);font-weight:900;font-size:clamp(3rem,7vw,6rem);line-height:1.05;color:#fff;margin-bottom:3vh}
.cta-h .o{color:var(--orange)}
.cta-sub{font-size:clamp(1.2rem,2vw,1.6rem);color:rgba(255,255,255,.55);margin-bottom:5vh}
.cta-link{display:inline-flex;align-items:center;gap:.6rem;font-family:var(--fd);font-weight:800;font-size:1.3rem;color:#fff;background:var(--orange);border-radius:56px;padding:20px 48px;text-decoration:none;transition:transform .25s,box-shadow .25s;box-shadow:0 8px 32px rgba(255,102,0,.35)}
.cta-link:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 48px rgba(255,102,0,.5)}

/* ── PROGRESS + NAV ── */
#progress{position:fixed;top:0;left:0;height:4px;background:linear-gradient(90deg,var(--orange),var(--orange-3));z-index:100;transition:width .4s var(--ease)}
#pager{position:fixed;bottom:4vh;right:4vw;z-index:100;font-family:var(--fd);font-weight:700;font-size:1.1rem;color:var(--text-4);display:flex;align-items:center;gap:.5rem}
.slide.dark~#pager,body.dark-pager #pager{color:rgba(255,255,255,.5)}
#dots{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);z-index:100;display:flex;gap:10px}
.dot{width:9px;height:9px;border-radius:50%;background:rgba(120,120,120,.35);cursor:pointer;transition:all .25s}
.dot.active{background:var(--orange);width:28px;border-radius:5px}
#nav-arrows{position:fixed;bottom:4vh;left:4vw;z-index:100;display:flex;gap:.5rem}
.nav-arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid rgba(120,120,120,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;background:rgba(255,255,255,.6);backdrop-filter:blur(8px);transition:all .2s}
.nav-arrow:hover{border-color:var(--orange);background:#fff}
.nav-arrow svg{width:18px;height:18px;color:var(--text-3)}
.nav-arrow:hover svg{color:var(--orange)}
#lang-toggle{position:fixed;top:4vh;right:4vw;z-index:100;font-family:var(--fb);font-size:.95rem;font-weight:700;letter-spacing:.06em;color:#fff;border:1.5px solid var(--orange);border-radius:22px;padding:8px 20px;cursor:pointer;background:var(--orange);box-shadow:0 4px 16px rgba(255,102,0,.35);transition:all .2s}
#lang-toggle:hover{background:var(--orange-2);transform:scale(1.05)}
#hint{position:fixed;bottom:11vh;left:50%;transform:translateX(-50%);z-index:99;font-size:.85rem;color:var(--text-4);opacity:.7;animation:fade-hint 4s ease forwards 3s}
@keyframes fade-hint{to{opacity:0;visibility:hidden}}

@media(max-width:768px){
  .cards-3{grid-template-columns:1fr;gap:1.5vh}
  .tiers-2,.tr-grid{grid-template-columns:1fr}
  .cmp-table{font-size:.85rem}
  .slide{padding:8vh 6vw}
  .stat{padding:0 4vw}
}

.reasons-slide{padding:4vh 7vw!important}
.cards-6{display:grid;grid-template-columns:repeat(3,1fr);gap:1.8vw;width:100%}
.r-card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:3.6vh 2.3vw;display:flex;flex-direction:column;justify-content:flex-start;min-height:44vh;animation:rglow 7s ease-in-out infinite}
.r-ico{width:36px;height:36px;color:var(--orange);margin-bottom:1.6vh}
.r-ico svg{width:100%;height:100%}
.r-card h4{font-family:var(--fd);font-weight:700;font-size:clamp(1.4rem,1.85vw,1.75rem);color:#fff;margin-bottom:1.8vh;line-height:1.22;min-height:2.44em;text-wrap:balance}
.r-card p{font-size:clamp(1.18rem,1.5vw,1.55rem);color:rgba(255,255,255,.7);line-height:1.85}
@keyframes rglow{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,0);border-color:rgba(255,255,255,.1)}50%{box-shadow:0 0 30px rgba(255,102,0,.2);border-color:rgba(255,102,0,.5)}}
.cards-6 .r-card:nth-child(1){animation-delay:0s}
.cards-6 .r-card:nth-child(2){animation-delay:1.17s}
.cards-6 .r-card:nth-child(3){animation-delay:2.33s}
.cards-6 .r-card:nth-child(4){animation-delay:3.5s}
.cards-6 .r-card:nth-child(5){animation-delay:4.67s}
.cards-6 .r-card:nth-child(6){animation-delay:5.83s}
.r-card .hl{color:var(--orange);font-weight:700}
.slide.white .r-card,.slide.light .r-card{background:var(--white);border-color:var(--border);box-shadow:0 6px 28px rgba(11,22,35,.07);animation:none}
.slide.white .r-card h4,.slide.light .r-card h4{color:var(--text)}
.slide.white .r-card p,.slide.light .r-card p{color:var(--text-3)}
.slide.white .r-card .hl,.slide.light .r-card .hl{color:var(--orange-2)}
.slide.white .quote-big{color:var(--text-2)}
.slide.white .qa-name{color:var(--text)}
.slide.white .qa-role{color:var(--orange-2)}

/* ── MOBILE (overrides all above) ── */
@media(max-width:768px){
  .slide{padding:80px 7vw 90px;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
  #lang-toggle{top:3vh;right:5vw;padding:6px 15px;font-size:.85rem}
  .hero-slide{justify-content:flex-start;text-align:center}
  .hero-badge{font-size:.68rem;padding:6px 14px;margin-bottom:3vh}
  .s-title{font-size:clamp(2rem,8vw,2.8rem)!important;margin-bottom:1.8vh}
  .s-sub{font-size:clamp(1.04rem,4.2vw,1.22rem)!important;max-width:100%}
  .hero-h1{font-size:clamp(2.8rem,13vw,4.2rem)}
  .hero-tag{font-size:clamp(1.05rem,4.5vw,1.3rem)}
  .hero-badge{font-size:.78rem;padding:7px 16px}
  .eyebrow{font-size:.82rem;margin-bottom:1.4vh}
  .page-badge{font-size:.72rem;top:3vh;left:7vw}
  .cards-3,.cards-6,.tiers-2,.tr-grid{grid-template-columns:1fr!important;gap:1.8vh!important}
  .tr-grid{max-width:100%}
  .reasons-slide{padding:80px 7vw 90px!important}
  .r-card{min-height:auto!important;padding:2.8vh 6vw!important}
  .r-card h4{min-height:auto!important;font-size:clamp(1.3rem,5.8vw,1.55rem)!important;margin-bottom:1.2vh}
  .r-card p{font-size:clamp(1.08rem,4.3vw,1.26rem)!important;line-height:1.62!important}
  .stats-row{flex-direction:column;gap:0;margin-top:3vh}
  .stat{border-right:none;border-bottom:1px solid rgba(255,255,255,.12);padding:1.6vh 0!important;width:100%}
  .stat:last-child{border-bottom:none}
  .tier-card{padding:3vh 6vw}
  .tier-range{font-size:clamp(1.8rem,8vw,2.4rem)}
  .quote-big{font-size:clamp(1.3rem,5.8vw,1.7rem)!important;line-height:1.5!important}
  .quote-author img{width:52px;height:52px}
  .cmp-table th,.cmp-table td{padding:1.2vh 2.5vw}
  .cta-link{font-size:1.05rem;padding:15px 30px}
  .net-overlay{top:5vh;width:94%}
}
</style>
</head>
<body>

<div id="progress"></div>
<div id="deck"></div>

<button id="lang-toggle" onclick="toggleLang()">CH</button>
<div id="nav-arrows">
  <div class="nav-arrow" onclick="go(cur-1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></div>
  <div class="nav-arrow" onclick="go(cur+1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></div>
</div>
<div id="dots"></div>
<div id="pager"><span id="pg-cur">1</span> / <span id="pg-total">12</span></div>
<div id="hint" data-en="Use ← → or Space to navigate · F11 for fullscreen" data-zh="用 ← → 或空白鍵切換 · F11 全螢幕">Use ← → or Space to navigate · F11 for fullscreen</div>

<script src="shared-content.js?v=6"></script>
<script>
var C = window.OS_CONTENT;
var lang = 'en';

/* ════════ BUILD SLIDES from shared content ════════ */
function slidesHTML(){
  var s = C.stats, b = C.brand;
  return [

  // 01 — HERO / POSITIONING
  `<section class="slide hero-slide dark">
    <canvas id="hero-canvas"></canvas>
    <div class="hero-badge"><span data-en="Taiwan's First Operator-Led Syndicate · ${b.launch_en}" data-zh="全台首創 Operator-Led 投資飛輪 · ${b.launch_zh}">Taiwan's First Operator-Led Syndicate · ${b.launch_en}</span></div>
    <h1 class="hero-h1"><span data-en="${b.tagline_en_1}" data-zh="${b.tagline_zh_1}">${b.tagline_en_1}</span><br><span class="o" data-en="${b.tagline_en_2}" data-zh="${b.tagline_zh_2}">${b.tagline_en_2}</span></h1>
    <p class="hero-tag" data-en="${b.positioning_en}" data-zh="${b.positioning_zh}">${b.positioning_en}</p>
    <div class="stats-row">
      <div class="stat"><div class="stat-n">${s.operators}</div><div class="stat-l" data-en="Senior Operators" data-zh="資深高管">Senior Operators</div></div>
      <div class="stat"><div class="stat-n">1000+</div><div class="stat-l" data-en="Yrs Operating Exp" data-zh="累積營運年資">Yrs Operating Exp</div></div>
      <div class="stat"><div class="stat-n">$10B+</div><div class="stat-l" data-en="Procurement Influence" data-zh="採購影響力">Procurement Influence</div></div>
      <div class="stat"><div class="stat-n">${s.cycleCut}</div><div class="stat-l" data-en="Cycle Cut" data-zh="縮短週期">Cycle Cut</div></div>
    </div>
  </section>`,

  // 02 — THE OPPORTUNITY (problem + why now + solution)
  `<section class="slide light">
    <div class="page-badge">01 · The Opportunity</div>
    <div class="eyebrow" data-en="The Opportunity" data-zh="市場機會">The Opportunity</div>
    <h2 class="s-title" data-en="Capital is everywhere.<br><em>Operators are rare.</em>" data-zh="資金到處都是。<br><em>懂業務的投資人沒幾個。</em>">Capital is everywhere.<br><em>Operators are rare.</em></h2>
    <p class="s-sub" data-en="80% of B2B startups stall at enterprise entry. The bottleneck was never capital; it is access. AI is reshaping how enterprises buy, and operator-led funds like ${C.benchmarks[0]} and ${C.benchmarks[1]} prove the model beats financial VCs. Taiwan has the sales talent; no one had organized it, until now." data-zh="80% 的 B2B 新創卡在企業准入。瓶頸從來不是資金，而是門路。AI 正在重塑企業採購，${C.benchmarks[0]} 與 ${C.benchmarks[1]} 等 operator-led 基金已證明模式優於財務型 VC。台灣有業務人才，只是沒人組織起來，直到現在。">80% of B2B startups stall at enterprise entry. The bottleneck was never capital; it is access. AI is reshaping how enterprises buy, and operator-led funds like ${C.benchmarks[0]} and ${C.benchmarks[1]} prove the model beats financial VCs. Taiwan has the sales talent; no one had organized it, until now.</p>
    <p class="s-sub" style="margin-top:2.4vh;font-weight:700;color:#FF6600" data-en="Our answer: ${s.operators} senior operators co-invest, and sell alongside you." data-zh="我們的解法：${s.operators} 位資深高管共同投資，並親自陪你銷售。">Our answer: ${s.operators} senior operators co-invest, and sell alongside you.</p>
  </section>`,

  // 03 — THE OPERATOR NETWORK (live canvas)
  `<section class="slide net-slide dark">
    <div class="net-overlay">

/* ════════ RENDER ════════ */
var deck = document.getElementById('deck');
deck.innerHTML = slidesHTML().join('');
var slides = Array.from(document.querySelectorAll('.slide'));
var total = slides.length;
var cur = 0;
document.getElementById('pg-total').textContent = total;

// Build dots
var dotsWrap = document.getElementById('dots');
slides.forEach(function(_,i){
  var d = document.createElement('div'); d.className='dot'; d.onclick=function(){go(i)};
  dotsWrap.appendChild(d);
});
var dots = Array.from(document.querySelectorAll('.dot'));

function go(n){
  n = Math.max(0, Math.min(total-1, n));
  slides[cur].classList.remove('active');
  slides[cur].classList.toggle('prev', n>cur);
  cur = n;
  slides[cur].classList.add('active');
  slides[cur].classList.remove('prev');
  dots.forEach(function(d,i){d.classList.toggle('active',i===cur)});
  document.getElementById('progress').style.width = ((cur+1)/total*100)+'%';
  document.getElementById('pg-cur').textContent = cur+1;
  // pager color based on slide bg
  var darkSlide = slides[cur].classList.contains('dark')||slides[cur].classList.contains('amber');
  document.body.classList.toggle('dark-pager', darkSlide);
  applyLang(lang);
  try{localStorage.setItem('evoPitchSlide',cur);history.replaceState(null,'','#s'+cur);}catch(e){}
}

/* ════════ KEYBOARD + TOUCH ════════ */
document.addEventListener('keydown',function(e){
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault();go(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1);}
  else if(e.key==='Home'){go((function(){try{return parseInt(localStorage.getItem('evoPitchSlide'))||0;}catch(e){return 0;}})());}
  else if(e.key==='End'){go(total-1);}
});
var tStartX=0;
document.addEventListener('touchstart',function(e){tStartX=e.touches[0].clientX;},{passive:true});
document.addEventListener('touchend',function(e){
  var dx=e.changedTouches[0].clientX-tStartX;
  if(Math.abs(dx)>50){go(dx<0?cur+1:cur-1);}
},{passive:true});
// Wheel navigation (debounced)
var wheelLock=false;
document.addEventListener('wheel',function(e){
  if(wheelLock)return;
  if(Math.abs(e.deltaY)<20)return;
  wheelLock=true;
  go(e.deltaY>0?cur+1:cur-1);
  setTimeout(function(){wheelLock=false;},700);
},{passive:true});

/* ════════ LANG ════════ */
function applyLang(l){
  lang=l;
  document.documentElement.setAttribute('data-lang',l);
  document.querySelectorAll('[data-en],[data-zh]').forEach(function(el){
    var v=l==='zh'?el.getAttribute('data-zh'):el.getAttribute('data-en');
    if(v!==null&&v!=='')el.innerHTML=v;
  });
  document.getElementById('lang-toggle').textContent = l==='en'?'CH':'EN';
}
function toggleLang(){applyLang(lang==='en'?'zh':'en');}

/* ════════ INIT ════════ */
go((function(){try{var m=(location.hash.match(/^#s(\d+)$/)||[])[1];if(m!=null)return parseInt(m);var s=parseInt(localStorage.getItem('evoPitchSlide'));return isNaN(s)?0:s;}catch(e){return 0;}})());

/* ════════ HERO CANVAS (network mesh) ════════ */
(function(){

  function resize(){var dpr=Math.min(window.devicePixelRatio||1,2);W=canvas.offsetWidth;H=canvas.offsetHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);build();}
  function loop(){requestAnimationFrame(loop);if(!slides[0].classList.contains('active')){return;}ctx.clearRect(0,0,W,H);t+=.006;
    nodes.forEach(function(nd){nd.x=nd.ox+Math.sin(t*nd.sp+nd.ph)*40;nd.y=nd.oy+Math.cos(t*nd.sp*.7+nd.ph)*26;});
    for(var i=0;i<nodes.length;i++){var sp=.5+.5*Math.sin(t*2+i);
      for(var j=i+1;j<nodes.length;j++){var dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.sqrt(dx*dx+dy*dy);
        if(d<200){ctx.strokeStyle='rgba(255,102,0,'+((1-d/200)*.12).toFixed(3)+')';ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();}}}
    nodes.forEach(function(nd,i){var g=ctx.createRadialGradient(nd.x,nd.y,0,nd.x,nd.y,8);var sp=.5+.5*Math.sin(t*2.5+i*.7);g.addColorStop(0,'rgba(255,150,50,'+(.5*sp+.2)+')');g.addColorStop(1,'rgba(255,100,0,0)');ctx.beginPath();ctx.arc(nd.x,nd.y,8,0,6.28);ctx.fillStyle=g;ctx.fill();ctx.beginPath();ctx.arc(nd.x,nd.y,2,0,6.28);ctx.fillStyle='rgba(255,210,140,.8)';ctx.fill();});
  }
  resize();window.addEventListener('resize',resize);loop();
})();

(function(){

  function init(){CX=W/2;CY=H/2+30;BR=Math.min(W,H)*.36;RINGS[0].R=BR*1.05;RINGS[1].R=BR*.8;RINGS[2].R=BR*.56;RINGS[3].R=BR*.3;
    nodes=OPS.map(function(op,idx){var ring=Math.min(Math.floor(idx/5),3),pos=idx-ring*5;return{op:op,ring:(3-ring),angle:pos*1.256+ring*.7,x:0,y:0,r:26,alpha:0,sx:null,sy:null};});}

  var tip=document.getElementById('net-tip'),tCo=document.getElementById('nt-co'),tT=document.getElementById('nt-t');
  function rgb(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}

    if(!slides[2].classList.contains('active')){return;}

    // connections

    var drawn={};for(var i=0;i<nodes.length;i++){near[i].forEach(function(j){var k=Math.min(i,j)+'-'+Math.max(i,j);if(drawn[k])return;drawn[k]=1;var nh=i===hovI||j===hovI;var pl=.5+.5*Math.sin(frame*.018+i*.8+j*.5);var al=nh?.6:pl*.12+.04;if(nh){var c=rgb(nodes[hovI].op.color);ctx.strokeStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')';}else ctx.strokeStyle='rgba(255,255,255,'+al.toFixed(3)+')';ctx.lineWidth=nh?1.8:.7;ctx.beginPath();ctx.moveTo(nodes[i].x,nodes[i].y);ctx.lineTo(nodes[j].x,nodes[j].y);ctx.stroke();});}

        else{ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.fillStyle=n.op.color;ctx.fill();}
        ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.strokeStyle=n.op.color;ctx.lineWidth=3;ctx.stroke();
      }else{ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.fillStyle=n.op.color;ctx.fill();ctx.beginPath();ctx.arc(n.x,n.y,r,0,6.28);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=1;ctx.stroke();ctx.fillStyle='#fff';ctx.font='bold '+Math.round(r*.5)+'px DM Sans';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.op.name.split(' ')[0].slice(0,2).toUpperCase(),n.x,n.y);}
      ctx.restore();
      ctx.save();ctx.globalAlpha=n.alpha*(isH?.95:.6);ctx.fillStyle=isH?'#fff':n.op.color;ctx.font=(isH||n.op.confirmed?'bold ':'')+'13px DM Sans';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(isH?n.op.name:n.op.company,n.x,n.y+r+8);ctx.restore();});
    // tooltip
    if(hovI>=0){var n=nodes[hovI],cr=canvas.getBoundingClientRect();tip.style.left=(n.x*(cr.width/W)+50)+'px';tip.style.top=(n.y*(cr.height/H)-20)+'px';if(tCo){tCo.textContent=n.op.company;tCo.style.background=n.op.color+'22';tCo.style.color=n.op.color;}if(tT)tT.innerHTML='<strong style="color:#fff;display:block">'+n.op.name+'</strong>'+n.op.title;tip.classList.add('vis');}else tip.classList.remove('vis');
  }
  resize();window.addEventListener('resize',resize);loop();
})();
</script>
