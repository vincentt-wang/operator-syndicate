<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);
--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin:6px 0 14px}
.when{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.when b{font-weight:700}
.when span{color:#AFC0D3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 0;min-width:140px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:700 .92rem var(--fb);border-radius:999px;padding:11px 14px;border:1.5px solid var(--or);cursor:pointer;background:none;color:inherit}
.btn.p{background:var(--or);color:#fff}
.btn.g{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.o{color:var(--or2);background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--tx2);font-size:.95rem}
.bar{display:flex;border-radius:10px;overflow:hidden;font-weight:700;font-size:.88rem;text-align:center}
.bar div{padding:10px 6px}
.bar .a{flex:10;background:var(--or);color:#fff}.bar .b{flex:8;background:var(--orp);color:var(--or2)}.bar .c{flex:2;background:#EEF1F4;color:var(--tx3)}
ol.st{list-style:none;counter-reset:s;margin-top:4px}
ol.st li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--line);color:var(--tx2);font-size:.95rem}
ol.st li:first-child{border-top:0}
ol.st li::before{content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
ol.st b{color:var(--tx);display:block}
.note{font-size:.85rem;color:var(--tx3);margin-top:8px}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
.deal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.deal .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.deal b{font-size:1.02rem}
.deal .tg{flex:none;font-size:.72rem;font-weight:700;border-radius:6px;padding:2px 8px;background:#EEF1F4;color:var(--tx3);white-space:nowrap}
.deal .tg.dr{background:var(--orp);color:var(--or2)}
.deal .sec{font-size:.8rem;color:var(--tx3);margin:2px 0 6px}
.deal p{font-size:.92rem;color:var(--tx2)}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
</style>
</head>

<div class="wrap">
<header><a class="logo" href="https://evoscalecapital.com/"><span class="lm">ES</span><span data-zh="一春資本" data-en="EvoScale Capital">一春資本</span></a><button id="lang" type="button">English</button></header>
<div class="hero">

  <h1 data-zh="一春資本最近在看的團隊" data-en="Teams EvoScale is looking at">一春資本最近在看的團隊</h1>
  <div class="when"><b><span data-zh="2026 年 10 月" data-en="October 2026">2026 年 10 月</span></b><span data-zh="每月 Deal Room 之後更新一次" data-en="Updated after each monthly Deal Room">每月 Deal Room 之後更新一次</span></div>
</div>
<div class="card">
  <h2 data-zh="怎麼交流" data-en="How it works">怎麼交流</h2>
  <ol class="st">
    <li><b data-zh="對哪一家有興趣，直接跟我們說" data-en="Tell us which team interests you">對哪一家有興趣，直接跟我們說</b><span data-zh="我們先問過創辦人，再幫雙方介紹" data-en="We check with the founders first, then make the introduction">我們先問過創辦人，再幫雙方介紹</span></li>
    <li><b data-zh="你們手上有適合的團隊，也歡迎分享" data-en="Share teams that might fit us">你們手上有適合的團隊，也歡迎分享</b><span data-zh="我們主要看 B2B，已有營收或 POC 完成、正在推市場的團隊" data-en="We focus on B2B teams with revenue, or a completed POC, now going to market">我們主要看 B2B，已有營收或 POC 完成、正在推市場的團隊</span></li>
    <li><b data-zh="每月交流一次" data-en="Monthly exchange">每月交流一次</b><span data-zh="月底 Deal Room 結束後更新這一頁，看過的結果也會回給你們" data-en="We refresh this page after each month-end Deal Room and share back what we learn">月底 Deal Room 結束後更新這一頁，看過的結果也會回給你們</span></li>
  </ol>
</div>

<script>
(function(){
  var b=document.getElementById('lang'),T={"zh":"一春資本｜案源交流","en":"EvoScale · Deal Exchange"};
  function set(l){
    document.documentElement.setAttribute('data-lang',l);document.documentElement.lang=l==='en'?'en':'zh-Hant';
    document.querySelectorAll('[data-zh]').forEach(function(e){e.innerHTML=e.getAttribute('data-'+l)});
    b.textContent=l==='en'?'中文':'English';document.title=T[l];
    try{localStorage.setItem('dr_lang',l)}catch(e){}
    if(window.drRender)window.drRender(l);
  }
  window.drLang=function(){return document.documentElement.getAttribute('data-lang')};
  var q=new URLSearchParams(location.search).get('lang'),s=null;try{s=localStorage.getItem('dr_lang')}catch(e){}
  var l=(q==='en'||q==='zh')?q:(s||'zh'); if(l!=='zh')set(l);
  b.addEventListener('click',function(){set(window.drLang()==='en'?'zh':'en')});
})();
</script>
<script>
(function(){
  var code=location.hash.replace(/^#/,''),el=document.getElementById('sealed'),T=null;
  if(!code||!window.crypto||!crypto.subtle)return;
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  function e(s){return String(s||'').replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var raw=b64(el.textContent.trim());
  crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){
    return crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt']);
  }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28))}).then(function(b){T=JSON.parse(new TextDecoder().decode(b));render(window.drLang())}).catch(function(){});
  function render(l){
    if(!T)return; var zh=l!=='en';
    document.getElementById('body').innerHTML='<div class="card" style="padding-bottom:12px"><h2 style="margin:0">'+(zh?'這個月的 8 隊':'8 teams this month')+'</h2></div>'+T.map(function(x){
      var dr=/Deal Room/.test(x.tag_zh);
      return '<div class="deal"><div class="top"><b>'+e(zh?x.name:(x.name_en||x.name))+'</b><span class="tg'+(dr?' dr':'')+'">'+e(zh?x.tag_zh:x.tag_en)+'</span></div><div class="sec">'+e(zh?x.sector_zh:x.sector_en)+' · '+e(zh?x.stage_zh:x.stage_en)+'</div><p>'+e(zh?x.zh:x.en)+'</p></div>';
    }).join('');
  }
  window.drRender=render;
})();
</script>
