<!DOCTYPE html>
<html lang="zh-TW">
<head>

<style>
:root{
  --bg:#0B0C0E;--surface:#15171A;--surface-2:#1C1F23;--line:#272A30;--line-hi:#3a3f46;
  --ink:#F2F3F5;--ink-2:#AEB3BA;--ink-3:#6B7077;
  --accent:#FF6600;--accent-soft:#FF8A3D;--accent-tint:rgba(255,102,0,.12);--accent-line:rgba(255,102,0,.34);
  /* 三色重點系統：橘為主視覺，藍／綠為輔助標註 */
  --c1:#FF6600;--c1k:#FF9A52;--c1t:rgba(255,102,0,.13);--c1l:rgba(255,102,0,.42);
  --c2:#5B9DF9;--c2k:#93C0FC;--c2t:rgba(91,157,249,.13);--c2l:rgba(91,157,249,.42);
  --c3:#34D399;--c3k:#7CE9C0;--c3t:rgba(52,211,153,.13);--c3l:rgba(52,211,153,.44);
  --orange:#FF6600;--mid:#AEB3BA;--cyan:#5B9DF9;--green:#34D399;--purple:#5B9DF9;--blue:#5B9DF9;--red:#FF6600;--yellow:#FF8A3D;
  --serif:'Source Serif 4','Noto Serif TC',Georgia,'Songti TC',serif;
  --ease-smooth:cubic-bezier(.4,0,.2,1);--ease-out:cubic-bezier(.16,1,.3,1);
  --min-font:clamp(1.2rem,1.5vw,1.38rem);--min-label:clamp(1.08rem,1.25vw,1.2rem);--eyebrow:1rem;
  --maxw:1150px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink-2);-webkit-font-smoothing:antialiased;overflow:hidden}

/* slow brand aurora */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;opacity:.6}
.aurora::before,.aurora::after{content:"";position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(64px);will-change:transform}
.aurora::before{top:-18vmax;left:-12vmax;background:radial-gradient(circle at center,rgba(255,102,0,.15),transparent 64%);animation:auA 23s ease-in-out infinite}
.aurora::after{bottom:-20vmax;right:-14vmax;background:radial-gradient(circle at center,rgba(255,138,61,.1),transparent 64%);animation:auB 28s ease-in-out infinite}
@keyframes auA{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vw,4vh,0) scale(1.12)}}
@keyframes auB{0%,100%{transform:translate3d(0,0,0) scale(1.05)}50%{transform:translate3d(-5vw,-3vh,0) scale(.95)}}

#slides{position:relative;z-index:1;height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.slide{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:clamp(48px,7vh,84px) clamp(36px,6vw,80px);overflow:hidden}
.inner{position:relative;z-index:1;width:100%;max-width:var(--maxw);display:flex;flex-direction:column;align-items:center;gap:.9rem}

/* reveal-on-enter motion */
.js-reveal .slide [data-reveal]{opacity:0;transform:translateY(20px);transition:opacity .6s var(--ease-out),transform .6s var(--ease-out);transition-delay:var(--rd,0ms);will-change:opacity,transform}
.slide.in-view [data-reveal]{opacity:1;transform:none;will-change:auto}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}
.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:var(--min-label);font-weight:600;letter-spacing:.01em;padding:.45rem 1rem;border-radius:10px;white-space:nowrap;border:1px solid var(--c1l);background:var(--c1t);color:var(--c1k);transition:transform .16s var(--ease-smooth),background-color .16s,border-color .16s}
.chip.b{border-color:var(--c2l);background:var(--c2t);color:var(--c2k)}
.chip.g{border-color:var(--c3l);background:var(--c3t);color:var(--c3k)}
.chip:hover{transform:translateY(-2px);filter:brightness(1.12)}
.chip.n{border-color:var(--line);background:var(--surface);color:var(--ink-2)}
.chip.n:hover{border-color:var(--line-hi);background:var(--surface-2)}

/* type */
.ey{display:inline-flex;align-items:center;font-size:var(--eyebrow);font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.ey::before{content:"";width:24px;height:3px;border-radius:2px;background:var(--accent);margin-right:.6rem}
.title{font-weight:800;font-size:clamp(2.1rem,3.5vw,2.85rem);line-height:1.14;letter-spacing:-.02em;color:var(--ink)}
.title .g,.cover-h .g,.big .g{background:linear-gradient(96deg,var(--accent),var(--accent-soft));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cover-h{font-weight:800;font-size:clamp(3rem,5.2vw,4.2rem);line-height:1.05;letter-spacing:-.03em;color:var(--ink)}
.sub{font-size:clamp(1.28rem,1.85vw,1.6rem);line-height:1.55;color:var(--ink-2);max-width:42ch}
.sub b{color:var(--ink);font-weight:700}
.big{font-weight:800;font-size:clamp(2.7rem,4.7vw,3.75rem);line-height:1.16;letter-spacing:-.025em;max-width:34ch;color:var(--ink);text-wrap:balance}
.nlg{font-size:clamp(1.3rem,1.85vw,1.62rem);line-height:1.5;color:var(--ink-2);max-width:44ch}
.nlg b{color:var(--ink);font-weight:700}
.note{font-size:var(--min-font);line-height:1.58;color:var(--ink-2);max-width:50ch}
.note b{color:var(--ink);font-weight:600}
.foot{font-size:var(--min-label);color:var(--ink-3);letter-spacing:.04em}
.title,.cover-h,.sub,.big,.orb .n,.card .ch,.fbox .ft{text-wrap:balance}
.card .cd,.orb .d,.fbox .fd,.disc{text-wrap:pretty}
.note,.ruler-head{text-wrap:balance}
.card.ruler .cd,.startbox span:last-child{text-wrap:balance;white-space:normal}

/* highlights */
.hl1{color:var(--c1k)!important}.hl2{color:var(--c2k)!important}.hl3{color:var(--c3k)!important}

/* hero single stat */
.hero-stat{display:flex;flex-direction:column;align-items:center;gap:.1rem;margin:.2rem 0}
.hnum{font-weight:800;font-size:clamp(4.4rem,11.5vw,7.6rem);line-height:.92;color:var(--c1);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.hunit{font-weight:700;font-size:clamp(1.3rem,2vw,1.72rem);color:var(--ink);letter-spacing:.01em}
.hcap{font-size:var(--min-font);color:var(--ink-2);max-width:34ch;line-height:1.5;margin-top:.3rem}
.hcap b{color:var(--ink)}

/* metric cards */
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:.85rem;width:100%;max-width:780px}
.metric{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:15px;padding:1.35rem 1.2rem;display:flex;flex-direction:column;gap:.38rem;align-items:center;text-align:center;transition:transform .2s var(--ease-smooth),box-shadow .2s}
.metric:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.34)}
.mnum{font-weight:800;font-size:clamp(2.9rem,5.4vw,3.9rem);line-height:1;color:var(--c,var(--accent));font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mnum.mtext{font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.14;letter-spacing:-.01em}
.mcap{font-size:var(--min-label);color:var(--ink);font-weight:600;line-height:1.42;max-width:26ch}
.msrc{font-size:var(--eyebrow);color:var(--ink-3);letter-spacing:.02em}

/* tables */
.dt{width:100%;border-collapse:separate;border-spacing:0;margin-top:.1rem;font-size:var(--min-label);border-radius:14px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.dt th,.dt td{padding:.44rem .85rem;text-align:left;border-bottom:1px solid var(--line);line-height:1.38;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt thead th{font-weight:700;background:rgba(255,255,255,.03);color:var(--accent);font-size:var(--min-label);letter-spacing:.02em}
.dt td.k{font-weight:700;color:var(--ink);white-space:nowrap;background:rgba(255,255,255,.02)}
.dt .dim{color:var(--ink);font-weight:600;display:block}
.dt .q{color:var(--ink-2)}

/* disc / pagenote */
.disc-tag{display:inline-flex;align-items:center;gap:.45rem;font-size:var(--min-label);color:var(--ink-3);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:.4rem 1.05rem}
.pagenote{position:absolute;left:0;right:0;bottom:2.2vh;margin:0 auto;width:100%;max-width:72ch;padding:0 6vw;display:flex;align-items:center;justify-content:center;gap:.4rem;font-size:var(--min-label);line-height:1.45;color:var(--ink-3);opacity:.75;text-align:center;text-wrap:pretty}
.pagenote svg{width:13px;height:13px;flex-shrink:0;opacity:.8}

/* gem button */
.gembtn{display:inline-flex;align-items:center;gap:.5rem;font-weight:700;font-size:var(--min-label);color:#0B0C0E;background:var(--accent);border:none;border-radius:12px;padding:.74rem 1.6rem;text-decoration:none;box-shadow:0 6px 22px rgba(255,102,0,.26);transition:transform .18s var(--ease-smooth),box-shadow .18s,filter .18s;white-space:nowrap;cursor:pointer}
.gembtn:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(255,102,0,.4);filter:brightness(1.05)}
.gembtn:active{transform:translateY(0);transition-duration:.08s}
.gembtn svg{width:17px;height:17px;flex-shrink:0}

/* triad */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem;width:100%}
.orb{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:15px;padding:.92rem .85rem;display:flex;flex-direction:column;align-items:center;gap:.15rem;transition:transform .2s var(--ease-smooth),border-color .2s,box-shadow .2s}
.orb:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.34)}
.orb .L{font-weight:800;font-size:clamp(2.2rem,3.1vw,2.8rem);color:var(--c,var(--accent));line-height:1}
.orb .n{font-weight:700;font-size:clamp(1.25rem,1.75vw,1.5rem);white-space:nowrap;color:var(--ink)}
.orb .d{font-size:var(--min-label);color:var(--ink-2);line-height:1.4}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:.5rem;width:100%}
.fbox{flex:1;min-width:128px;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:.9rem .8rem;display:flex;flex-direction:column;gap:.25rem;transition:transform .2s var(--ease-smooth),border-color .2s}
.fbox:hover{transform:translateY(-3px);border-color:var(--accent-line)}
.fbox .ft{font-weight:700;font-size:var(--min-font);color:var(--accent);white-space:nowrap}
.fbox .fd{font-size:var(--min-label);color:var(--ink-2);line-height:1.38}
.farr{display:flex;align-items:center;color:var(--ink-3);font-weight:700;font-size:1.3rem;flex-shrink:0}

/* cards */
.cards{display:grid;gap:.85rem;width:100%}
.c2{grid-template-columns:1fr 1fr;grid-auto-rows:1fr}
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--c,var(--accent));border-radius:15px;padding:1.25rem 1.3rem;text-align:left;display:flex;flex-direction:column;gap:.5rem;transition:transform .2s var(--ease-smooth),border-color .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 28px rgba(0,0,0,.34)}
.card .ch{font-weight:700;font-size:clamp(1.2rem,1.6vw,1.42rem);color:var(--ink);white-space:nowrap;display:flex;align-items:center;gap:.5rem}
.card .ch::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex-shrink:0}
.card .cd{font-size:var(--min-label);color:var(--ink-2);line-height:1.55}
.card .cd b{color:var(--ink)}
.card.ruler .ch{font-size:clamp(1.12rem,1.5vw,1.3rem)}

/* steps / starts */
.ruler-head{font-size:var(--min-label);font-weight:700;letter-spacing:.03em;color:var(--ink-3);margin-top:.3rem}
.starts{display:flex;flex-wrap:wrap;gap:.55rem;width:100%;justify-content:center}
.startbox{flex:1;min-width:206px;display:flex;align-items:center;gap:.65rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--c,var(--accent));border-radius:12px;padding:.8rem 1rem;font-size:var(--min-label);color:var(--ink-2);text-align:left;line-height:1.42;transition:transform .2s var(--ease-smooth),box-shadow .2s}
.startbox:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.3)}
.sn2{font-weight:800;color:var(--c,var(--accent));font-size:1.5rem;flex-shrink:0;line-height:1}

/* UI chrome */
#prog{position:fixed;top:0;left:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent-soft));z-index:60;transition:width .3s var(--ease-smooth);width:0}
#counter{position:fixed;bottom:18px;right:18px;z-index:60;font-size:16px;font-weight:600;letter-spacing:.05em;padding:.3rem .7rem;border-radius:999px;background:rgba(0,0,0,.4);color:var(--ink-2);border:1px solid var(--line)}
.nav-btn{position:fixed;right:18px;z-index:60;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(20,22,25,.6);backdrop-filter:blur(10px);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s}
.nav-btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
#btn-prev{bottom:116px}#btn-next{bottom:68px}
#btn-lang{position:fixed;top:14px;right:16px;z-index:60;padding:.34rem .9rem;border-radius:999px;font-size:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);background:rgba(20,22,25,.6);backdrop-filter:blur(12px);border:1px solid var(--line);cursor:pointer;transition:all .2s}
#btn-lang:hover{border-color:var(--accent);color:var(--accent)}

@media(max-width:820px){
  html{font-size:17px}
  #slides{scroll-snap-type:y proximity}
  .slide{height:auto;min-height:100vh;min-height:100svh;overflow:visible;padding:11vh 5vw 8vh}
  .inner{gap:.85rem;max-width:100%}
  .sub,.big,.note{max-width:100%}
  .triad{gap:.45rem}
  .orb{padding:.8rem .35rem}
  .orb .d{display:none}
  .c2{grid-template-columns:1fr}
  .flow{flex-direction:column;gap:.4rem}
  .farr{transform:rotate(90deg);justify-content:center;font-size:1.05rem}
  .fbox{padding:.7rem 1rem}
  .dt td span{white-space:normal!important}
  .card{padding:1.05rem 1.1rem}
  .metrics{grid-template-columns:1fr}
  .pagenote{position:static;bottom:auto;margin-top:1rem;padding:0;max-width:100%}
}

@media (prefers-reduced-motion:reduce){
  .js-reveal .slide [data-reveal]{opacity:1!important;transform:none!important;transition:none!important}
  .orb:hover,.card:hover,.fbox:hover,.chip:hover,.startbox:hover,.gembtn:hover,.nav-btn:hover{transform:none!important}
  .aurora::before,.aurora::after{animation:none!important}
  *{scroll-behavior:auto!important}
}
</style>
</head>

/* ════ RENDER ════ */
let LANG=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';
const $=s=>document.querySelector(s);
function L(sd){return LANG==='en'&&T_en[sd.id]?{...sd,...T_en[sd.id]}:sd;}
function chips(cs,n){return cs&&cs.length?`<div class="chips" data-reveal>${cs.map((c,i)=>`<span class="chip ${n?'n':['','b','g'][i%3]}">${Array.isArray(c)?c[0]:c}</span>`).join('')}</div>`:'';}
function eyT(d){return d.ey?`<div class="ey" data-reveal>${d.ey}</div>`:'';}
function noteT(d){return d.note?`<div class="note" data-reveal>${d.note}</div>`:'';}
function gembtn(b){return b?`<a class="gembtn" href="${GEM}" target="_blank" rel="noopener">${b.label}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`:'';}
function pagenote(t){return `<div class="pagenote" data-reveal><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8"/></svg>${t}</div>`;}

function render(sd){
  const d=L(sd);let h='<div class="inner">';
  if(d.type==='cover'){
    h+=eyT(d)+`<h1 class="cover-h" data-reveal>${d.title}</h1><div class="sub" data-reveal>${d.sub}</div>`+chips(d.chips)+(d.foot?`<div class="foot" data-reveal style="margin-top:.4rem">${d.foot}</div>`:'');
  }else if(d.type==='big'){
    h+=eyT(d)+`<div class="big" data-reveal>${d.big}</div>`+(d.note?`<div class="note nlg" data-reveal>${d.note}</div>`:'')+(d.button?`<div data-reveal style="margin-top:.7rem">${gembtn(d.button)}</div>`:'')+(d.foot?`<div class="foot" data-reveal style="margin-top:.4rem">${d.foot}</div>`:'');
  }else if(d.type==='metric'){
    h+=eyT(d)+`<h2 class="title" data-reveal style="max-width:24ch">${d.title}</h2>`;
    h+=`<div class="hero-stat" data-reveal><div class="hnum"><span class="mn" data-count="${d.hero.n}">0</span>${d.hero.suf||''}</div><div class="hunit">${d.hero.unit}</div><div class="hcap">${d.hero.cap}</div></div>`;
    h+=chips(d.chips);
    h+=(d.note?`<div class="note nlg" data-reveal>${d.note}</div>`:'');
  }else if(d.type==='triad'){
    h+=eyT(d)+`<h2 class="title" data-reveal>${d.title}</h2>`;
    h+=`<div class="triad">${d.orbs.map((o,i)=>`<div class="orb" data-reveal style="--c:var(--c${i+1})"><div class="L">${o.L}</div><div class="n">${o.n}</div><div class="d">${o.d}</div></div>`).join('')}</div>`;
    h+=`<table class="dt" data-reveal><thead><tr>${d.heads.map((x,i)=>`<th style="width:33.33%;color:var(--c${i+1})">${x.t}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td><span class="dim">${c[0]}</span><span class="q">${c[1]}</span></td>`).join('')}</tr>`).join('')}</tbody></table>`;
    h+=noteT(d);
  }else if(d.type==='lenses'){
    h+=eyT(d)+`<h2 class="title" data-reveal>${d.title}</h2>`;
    h+=`<table class="dt" data-reveal><thead><tr><th style="width:20%">${d.stageCols[0]}</th><th colspan="2">${d.stageCols[1]}</th></tr></thead><tbody>${d.stageRows.map(r=>`<tr><td class="k">${r[0]}</td>${r[1].map(q=>`<td class="q" style="width:40%">${q}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    h+=`<div class="ruler-head" data-reveal>${d.rulerHead}</div>`;
    h+=`<div class="cards" data-reveal style="grid-template-columns:repeat(3,1fr);gap:.7rem">${d.rulers.map((c,i)=>`<div class="card ruler" style="--c:var(--c${i+1})"><div class="ch">${c.t}</div><div class="cd">${c.d}</div></div>`).join('')}</div>`;
    h+=noteT(d);
  }else if(d.type==='process'){
    const f=d.flow.map((x,i)=>`<div class="fbox"><div class="ft">${x.ft}</div><div class="fd">${x.fd}</div></div>`+(i<d.flow.length-1?'<div class="farr" aria-hidden="true">›</div>':'')).join('');
    h+=eyT(d)+`<h2 class="title" data-reveal>${d.title}</h2><div class="flow" data-reveal>${f}</div>`;
    h+=noteT(d)+(d.button?`<div data-reveal style="margin-top:.4rem">${gembtn(d.button)}</div>`:'');
  }else if(d.type==='value'){
    h+=eyT(d)+`<h2 class="title" data-reveal>${d.title}</h2>`+chips(d.traits);
    h+=`<div class="cards c2" style="margin-top:.2rem">${d.cards.map((c,i)=>`<div class="card" data-reveal style="--c:var(--c${(i%3)+1})"><div class="ch">${c.ch}</div><div class="cd">${c.cd}</div></div>`).join('')}</div>`;
  }
  h+='</div>';if(d.disc)h+=pagenote(d.disc);return h;
}

function build(){
  const c=$('#slides');c.innerHTML='';
  D.forEach(sd=>{const s=document.createElement('section');s.className='slide';s.id='sl-'+sd.id;s.innerHTML=render(sd);c.appendChild(s);});
  document.documentElement.setAttribute('lang',LANG==='en'?'en':'zh-TW');
  $('#btn-lang').textContent=LANG==='en'?'CH':'EN';
  setupReveal();
}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(el){
  if(el.dataset.done)return;el.dataset.done='1';
  const target=parseFloat(el.dataset.count);if(isNaN(target)){return;}
  if(REDUCE){el.textContent=target;return;}
  const dur=1000,t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/dur);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);})(t0);
}
function runCounts(slide){slide&&slide.querySelectorAll('[data-count]').forEach(countUp);}
let _io=null;
function setupReveal(){
  if(REDUCE){document.querySelectorAll('[data-count]').forEach(countUp);return;}
  const root=$('#slides');
  document.querySelectorAll('.slide').forEach(slide=>{
    slide.querySelectorAll('[data-reveal]').forEach((el,i)=>el.style.setProperty('--rd',Math.min(i*60,360)+'ms'));
  });
  if(_io)_io.disconnect();
  _io=new IntersectionObserver((es)=>{es.forEach(e=>{
    if(e.intersectionRatio>=0.5){e.target.classList.add('in-view');runCounts(e.target);}
    else if(e.intersectionRatio<0.12) e.target.classList.remove('in-view');
  });},{root,threshold:[0,0.12,0.5,1]});
  document.querySelectorAll('.slide').forEach(s=>_io.observe(s));
  const first=document.querySelectorAll('.slide')[cur||0];if(first){first.classList.add('in-view');runCounts(first);}
}
let cur=0;const total=D.length;
function syncCounter(){const c=$('#slides'),hh=c.clientHeight;cur=Math.round(c.scrollTop/hh);$('#counter').textContent=(cur+1)+' / '+total;$('#prog').style.width=((cur+1)/total*100)+'%';}
function go(dir){const c=$('#slides'),hh=c.clientHeight;let n=Math.max(0,Math.min(total-1,cur+dir));c.scrollTo({top:n*hh,behavior:'smooth'});}
function toggleLang(){const idx=cur;LANG=LANG==='en'?'zh':'en';const u=new URL(location);LANG==='en'?u.searchParams.set('lang','en'):u.searchParams.delete('lang');history.replaceState(null,'',u);build();requestAnimationFrame(()=>{const c=$('#slides');c.scrollTo({top:idx*c.clientHeight,behavior:'auto'});syncCounter();});}

document.documentElement.classList.add('js-reveal');
build();
$('#slides').addEventListener('scroll',()=>requestAnimationFrame(syncCounter),{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(-1);}
  else if(e.key==='Home'){go(-total);}else if(e.key==='End'){go(total);}
});
syncCounter();
</script>
