<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--ink:#f0f0f5;--mid:rgba(240,240,245,.8);
  --line:rgba(255,255,255,.1);
  --orange:#FF6B00;--red:#FF2055;--blue:#3B82F6;--purple:#A855F7;--green:#22C55E;--yellow:#FBBF24;--cyan:#06B6D4;
  --ease-back:cubic-bezier(0.34,1.56,0.64,1);--ease-smooth:cubic-bezier(0.4,0,0.2,1);
  --min-font:clamp(1.1rem,1.7vw,1.4rem);--min-label:clamp(1rem,1.5vw,1.25rem);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:20px}
body{font-family:'Inter','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden}
#slides{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;scroll-behavior:smooth}
.slide{height:100vh;scroll-snap-align:start;position:relative;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:6vh 6vw;overflow:hidden}
.inner{position:relative;z-index:1;width:100%;max-width:1180px;display:flex;flex-direction:column;align-items:center;gap:1rem}
@keyframes aurora{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.blob{position:absolute;inset:0;pointer-events:none;z-index:0;background-size:200% 200%;animation:aurora 18s ease-in-out infinite}

.chip{display:inline-flex;align-items:center;gap:.4rem;font-size:var(--min-label);font-weight:700;letter-spacing:.04em;padding:.4rem 1rem;border-radius:999px;white-space:nowrap;border:1px solid var(--line);background:rgba(255,255,255,.05)}
.chip-orange{color:var(--orange);border-color:rgba(255,107,0,.4);background:rgba(255,107,0,.1)}
.chip-cyan{color:var(--cyan);border-color:rgba(6,182,212,.4);background:rgba(6,182,212,.1)}
.chip-green{color:var(--green);border-color:rgba(34,197,94,.4);background:rgba(34,197,94,.1)}
.chip-white{color:rgba(255,255,255,.82)}
.chips{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center}

.ey{font-size:var(--min-label);font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--orange)}
.title{font-weight:900;font-size:clamp(2.1rem,5vw,3.5rem);line-height:1.1;letter-spacing:-.02em}
.title .g{background:linear-gradient(100deg,var(--orange),#FF9E4D 60%,var(--yellow));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cover-h{font-weight:900;font-size:clamp(2.8rem,7vw,5.2rem);line-height:1.04;letter-spacing:-.03em}
.cover-h .g{background:linear-gradient(100deg,var(--orange),#FF9E4D 55%,var(--yellow));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:clamp(1.2rem,2vw,1.55rem);line-height:1.65;color:var(--mid);max-width:44ch}
.sub b{color:var(--ink);font-weight:700}
.big{font-weight:800;font-size:clamp(1.7rem,3.6vw,2.7rem);line-height:1.4;letter-spacing:-.01em;max-width:30ch}
.big .g{color:var(--orange)}
.note{font-size:var(--min-font);line-height:1.62;color:var(--mid);max-width:56ch}
.note b{color:var(--ink)}
.foot{font-size:var(--min-label);color:var(--mid);letter-spacing:.05em}
.title,.cover-h,.sub,.big,.orb .n,.card .ch,.fbox .ft{text-wrap:balance}
.note,.card .cd,.orb .d,.fbox .fd,.step .st,.disc{text-wrap:pretty}

/* data tables */
.dt{width:100%;border-collapse:separate;border-spacing:0;margin-top:.2rem;font-size:var(--min-label);border-radius:14px;border:1px solid var(--line);overflow:hidden}
.dt th,.dt td{padding:.5rem .8rem;text-align:left;border-bottom:1px solid var(--line);line-height:1.42;vertical-align:top}
.dt tr:last-child td{border-bottom:none}
.dt thead th{font-weight:800;background:rgba(255,255,255,.05)}
.dt td.k{font-weight:800;color:var(--ink);white-space:nowrap;background:rgba(255,255,255,.02)}
.dt .dim{color:var(--ink);font-weight:800;display:block}
.dt .q{color:var(--mid)}
.disc{font-size:var(--min-label);color:var(--mid);opacity:.95;max-width:64ch}
.disc-tag{display:inline-flex;align-items:center;gap:.45rem;font-size:var(--min-label);color:var(--mid);border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:.4rem 1.1rem}
.gembtn{display:inline-flex;align-items:center;gap:.55rem;font-weight:800;font-size:var(--min-label);color:#0a0a0f;background:linear-gradient(100deg,var(--orange),#FF9E4D);border:none;border-radius:999px;padding:.78rem 1.7rem;text-decoration:none;box-shadow:0 6px 24px rgba(255,107,0,.3);transition:transform .2s,box-shadow .2s;white-space:nowrap;cursor:pointer}
.gembtn:hover{transform:translateY(-2px);box-shadow:0 10px 32px rgba(255,107,0,.45)}
.gembtn svg{width:18px;height:18px;flex-shrink:0}

/* triad */
.triad{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;width:100%}
.orb{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:16px;padding:.7rem .85rem;display:flex;flex-direction:column;align-items:center;gap:.1rem}
.orb .L{font-weight:900;font-size:clamp(1.9rem,3vw,2.4rem);color:var(--c);line-height:1}
.orb .n{font-weight:800;font-size:clamp(1.1rem,1.6vw,1.35rem);white-space:nowrap}
.orb .d{font-size:var(--min-label);color:var(--mid);line-height:1.4}

/* flow */
.flow{display:flex;flex-wrap:wrap;align-items:stretch;justify-content:center;gap:.5rem;width:100%}
.fbox{flex:1;min-width:130px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:1rem .8rem;display:flex;flex-direction:column;gap:.3rem}
.fbox .ft{font-weight:800;font-size:var(--min-font);color:var(--orange);white-space:nowrap}
.fbox .fd{font-size:var(--min-label);color:var(--mid);line-height:1.4}
.farr{display:flex;align-items:center;color:var(--orange);font-weight:800;font-size:1.4rem;flex-shrink:0}

/* cards */
.cards{display:grid;gap:1rem;width:100%}
.c2{grid-template-columns:1fr 1fr}
.card{background:var(--bg2);border:1px solid var(--line);border-top:3px solid var(--c,var(--orange));border-radius:16px;padding:1.3rem 1.3rem;text-align:left;display:flex;flex-direction:column;gap:.5rem}
.card .ch{font-weight:800;font-size:clamp(1.15rem,1.7vw,1.4rem);color:var(--c,var(--orange));white-space:nowrap}
.card .cd{font-size:var(--min-label);color:var(--mid);line-height:1.55}
.card .cd b{color:var(--ink)}

/* steps */
.steps{display:flex;flex-direction:column;gap:.6rem;width:100%;max-width:820px;text-align:left}
.step{display:flex;gap:1rem;align-items:flex-start;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem}
.step .sn{font-weight:900;font-size:clamp(1.4rem,2vw,1.7rem);color:var(--orange);flex-shrink:0;line-height:1.2;min-width:1.6rem}
.step .st{font-size:var(--min-font);line-height:1.5}
.step .st b{font-weight:800}

/* UI */
#prog{position:fixed;top:0;left:0;height:3px;background:linear-gradient(90deg,var(--orange),var(--yellow));z-index:60;transition:width .3s var(--ease-smooth);width:0}
#counter{position:fixed;bottom:18px;right:18px;z-index:60;font-size:16px;font-weight:700;letter-spacing:.05em;padding:.3rem .7rem;border-radius:999px;background:rgba(0,0,0,.45);color:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.18)}
.nav-btn{position:fixed;right:18px;z-index:60;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.06);backdrop-filter:blur(10px);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.nav-btn:hover{border-color:var(--orange);color:var(--orange)}
#btn-prev{bottom:118px}#btn-next{bottom:70px}
#btn-lang{position:fixed;top:14px;left:16px;z-index:60;padding:.34rem .9rem;border-radius:999px;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.78);background:rgba(255,255,255,.06);backdrop-filter:blur(12px);border:1px solid var(--line);cursor:pointer;transition:all .25s}
#btn-lang:hover{border-color:var(--orange);color:var(--orange)}

@media(max-width:820px){
  html{font-size:17px}
  /* slides grow & scroll instead of clipping; gentler snap for tall slides */
  #slides{scroll-snap-type:y proximity}
  .slide{height:auto;min-height:100vh;min-height:100svh;overflow:visible;padding:11vh 5vw 8vh}
  .inner{gap:.8rem;max-width:100%}
  .cover-h{font-size:clamp(2.3rem,11vw,3.2rem)}
  .title{font-size:clamp(1.65rem,6.6vw,2.3rem)}
  .big{font-size:clamp(1.45rem,5.8vw,2rem);max-width:100%}
  .sub{max-width:100%}
  /* triad: keep 3 orbs across but compact */
  .triad{grid-template-columns:repeat(3,1fr);gap:.45rem}
  .orb{padding:.7rem .35rem;border-radius:12px}
  .orb .L{font-size:1.7rem}
  .orb .n{font-size:1rem}
  .orb .d{display:none}
  .c2{grid-template-columns:1fr}
  .flow{flex-direction:column;gap:.45rem}
  .farr{transform:rotate(90deg);justify-content:center;font-size:1.1rem;padding:0}
  .fbox{padding:.7rem 1rem}
  /* tables: fit width, allow wrapping (kills horizontal overflow) */
  .dt{font-size:1rem}
  .dt th,.dt td{padding:.5rem .55rem;line-height:1.4}
  .dt td span{white-space:normal!important}
  .card{padding:1.1rem 1.15rem}
  .step{padding:.85rem 1rem}
  .gembtn{font-size:1rem;padding:.72rem 1.4rem}
  .disc-tag{font-size:1rem;padding:.45rem 1rem;line-height:1.4}
}
</style>
</head>

/* ════ RENDER ════ */
let LANG=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';
const $=s=>document.querySelector(s);
function L(sd){return LANG==='en'&&T_en[sd.id]?{...sd,...T_en[sd.id]}:sd;}
function blob(b){return b?`<div class="blob" style="background:radial-gradient(ellipse 80% 70% at 20% 20%,${b[0]},transparent 55%),radial-gradient(ellipse 70% 80% at 80% 80%,${b[1]},transparent 55%)"></div>`:'';}
function chips(cs){return cs&&cs.length?`<div class="chips">${cs.map(c=>`<span class="chip chip-${c[1]}">${c[0]}</span>`).join('')}</div>`:'';}
function eyT(d){return d.ey?`<div class="ey">${d.ey}</div>`:'';}
function noteT(d){return d.note?`<div class="note">${d.note}</div>`:'';}
function discT(d){return d.disc?`<div class="disc-tag"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="16"/><line x1="12" y1="8" x2="12" y2="8"/></svg>${d.disc}</div>`:'';}
function gembtn(b){return b?`<a class="gembtn" href="${GEM}" target="_blank" rel="noopener">${b.label}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M7 17 17 7M7 7h10v10"/></svg></a>`:'';}
function nbItems(s){return s.split('·').map(x=>`<span style="white-space:nowrap">${x.trim()}</span>`).join(' · ');}

function render(sd){
  const d=L(sd);let h=blob(d.blob)+'<div class="inner">';
  if(d.type==='cover'){
    h+=eyT(d)+`<h1 class="cover-h">${d.title}</h1><div class="sub">${d.sub}</div>`+chips(d.chips)+(d.foot?`<div class="foot" style="margin-top:.5rem">${d.foot}</div>`:'');
  }else if(d.type==='big'){
    h+=eyT(d)+`<div class="big">${d.big}</div>`+noteT(d)+(d.button?`<div style="margin-top:.6rem">${gembtn(d.button)}</div>`:'')+discT(d)+(d.foot?`<div class="foot" style="margin-top:.3rem">${d.foot}</div>`:'');
  }else if(d.type==='triad'){
    h+=eyT(d)+`<h2 class="title">${d.title}</h2>`;
    h+=`<div class="triad">${d.orbs.map(o=>`<div class="orb" style="--c:${o.c}"><div class="L">${o.L}</div><div class="n">${o.n}</div><div class="d">${o.d}</div></div>`).join('')}</div>`;
    h+=`<table class="dt"><thead><tr>${d.heads.map(x=>`<th style="color:${x.c};width:33.33%">${x.t}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr>${r.map(c=>`<td><span class="dim">${c[0]}</span><span class="q">${c[1]}</span></td>`).join('')}</tr>`).join('')}</tbody></table>`;
    h+=noteT(d);
  }else if(d.type==='stages'){
    h+=eyT(d)+`<h2 class="title">${d.title}</h2>`;
    h+=`<table class="dt"><thead><tr>${d.cols.map((c,i)=>`<th style="${i===0?'color:var(--orange);width:20%':'color:var(--cyan)'}">${c}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr><td class="k">${r[0]}</td><td class="q">${r[1]}</td></tr>`).join('')}</tbody></table>`;
    h+=noteT(d);
  }else if(d.type==='flow'){
    const f=d.flow.map((x,i)=>`<div class="fbox"><div class="ft">${x.ft}</div><div class="fd">${x.fd}</div></div>`+(i<d.flow.length-1?'<div class="farr">›</div>':'')).join('');
    h+=eyT(d)+`<h2 class="title">${d.title}</h2><div class="flow">${f}</div>`+noteT(d)+(d.button?`<div style="margin-top:.4rem">${gembtn(d.button)}</div>`:'');
  }else if(d.type==='rubric'){
    h+=eyT(d)+`<h2 class="title">${d.title}</h2>`;
    h+=`<table class="dt"><thead><tr>${d.cols.map((c,i)=>`<th style="${i===0?'width:19%':i===2?'width:23%':''}">${c}</th>`).join('')}</tr></thead><tbody>${d.rows.map(r=>`<tr><td class="k" style="color:${r[0][1]}">${r[0][0]}</td><td>${nbItems(r[1])}</td><td class="q" style="text-wrap:balance">${r[2]}</td></tr>`).join('')}</tbody></table>`;
    h+=noteT(d);
  }else if(d.type==='cards2'){
    h+=eyT(d)+`<h2 class="title">${d.title}</h2><div class="cards c2">${d.cards.map(c=>`<div class="card" style="--c:${c.c}"><div class="ch">${c.ch}</div><div class="cd">${c.cd}</div></div>`).join('')}</div>`+discT(d);
  }else if(d.type==='steps'){
    h+=eyT(d)+`<h2 class="title">${d.title}</h2><div class="steps">${d.steps.map(s=>`<div class="step"><div class="sn">${s.n}</div><div class="st">${s.t}</div></div>`).join('')}</div>`+noteT(d);
  }
  h+='</div>';return h;
}

function build(){
  const c=$('#slides');c.innerHTML='';
  D.forEach(sd=>{const s=document.createElement('section');s.className='slide';s.id='sl-'+sd.id;s.innerHTML=render(sd);c.appendChild(s);});
  document.documentElement.setAttribute('lang',LANG==='en'?'en':'zh-TW');
  $('#btn-lang').textContent=LANG==='en'?'CH':'EN';
}
let cur=0;const total=D.length;
function syncCounter(){const c=$('#slides'),hh=c.clientHeight;cur=Math.round(c.scrollTop/hh);$('#counter').textContent=(cur+1)+' / '+total;$('#prog').style.width=((cur+1)/total*100)+'%';}
function go(dir){const c=$('#slides'),hh=c.clientHeight;let n=Math.max(0,Math.min(total-1,cur+dir));c.scrollTo({top:n*hh,behavior:'smooth'});}
function toggleLang(){const c=$('#slides');const idx=cur;LANG=LANG==='en'?'zh':'en';const u=new URL(location);LANG==='en'?u.searchParams.set('lang','en'):u.searchParams.delete('lang');history.replaceState(null,'',u);build();requestAnimationFrame(()=>{c.scrollTo({top:idx*c.clientHeight,behavior:'auto'});syncCounter();});}

build();
$('#slides').addEventListener('scroll',()=>requestAnimationFrame(syncCounter),{passive:true});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1);}
  else if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();go(-1);}
  else if(e.key==='Home'){go(-total);}else if(e.key==='End'){go(total);}
});
syncCounter();
</script>
