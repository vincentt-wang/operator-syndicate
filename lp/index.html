<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EvoScale</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}.wrap{max-width:600px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800;min-height:44px}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer;min-height:44px;min-width:44px}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px;animation:fi .45s ease-out both}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:8px}
.card p{color:var(--tx2);font-size:.95rem}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.nx .k{font-size:.8rem;font-weight:700;color:var(--or2);letter-spacing:.06em}
.nx h2{font-size:1.45rem;margin:2px 0 6px}
.st{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;font-weight:700;padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--tx2)}
.pill.on{background:#E3F4EA;color:#166534}.pill.off{background:#F1F2F4;color:var(--tx3)}
.nx .gos{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.nx .gos .btn{flex:1 1 140px;margin:0}
.tag{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 9px;border-radius:99px;white-space:nowrap}.tag.y{background:#FDF3D7;color:#92600A}.tag.g{background:#E3F4EA;color:#166534}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.mt{flex:0 0 auto;min-width:84px;min-height:56px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;text-align:left;cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,box-shadow .2s}
.mt b{display:block;font-size:1rem;color:var(--navy)}.mt span{font-size:.76rem;color:var(--tx3)}
.mt.past{background:var(--bg)}
.mt[aria-selected="true"]{border-color:var(--or);box-shadow:0 0 0 2px rgba(255,102,0,.18)}
.pan{border-top:1px solid var(--line);padding-top:12px;animation:fi .25s ease-out both}
.ph{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}.pn{font-size:.8rem;font-weight:700;color:var(--or2)}.ph h3{font-size:1.1rem;color:var(--navy)}
.wait{background:var(--orp);border-radius:12px;padding:12px 14px}.wait p{margin-top:6px}.wait .by{font-size:.88rem;color:var(--tx3)}
.mine{margin:10px 0 0;font-weight:700;color:var(--tx)!important}.mine:empty{display:none}
.tm{list-style:none;margin:10px 0 0}.tm li{padding:8px 0;border-top:1px solid var(--line)}.tm li:first-child{border-top:0}
.tm b{display:block;font-size:.98rem}.tm em{display:block;font-style:normal;font-size:.9rem;color:var(--tx2)}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.lk .btn{flex:1 1 140px;margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:14px;font:700 1rem var(--fb);border-radius:999px;padding:12px;border:1.5px solid var(--or);background:var(--or);color:#fff;cursor:pointer;text-decoration:none}
.btn.sm{font-size:.93rem;min-height:44px;padding:9px 14px}.btn.o{background:#fff;color:var(--or2)}.btn[disabled]{opacity:.6;cursor:wait}
.rd{border:0;border-top:1px solid var(--line);padding:12px 0}.rd legend{float:left;width:100%}.rd .seg{clear:both}.rd:first-of-type{margin-top:6px}
.rd legend{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding:0;font-size:1rem}.rd legend em{font-style:normal;font-size:.82rem;color:var(--tx3)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.seg label{flex:1 1 0;min-width:88px;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label>span{display:flex;align-items:center;justify-content:center;min-height:44px;padding:6px 10px;border:1.5px solid rgba(11,22,35,.18);border-radius:10px;font-size:.92rem;font-weight:700;color:var(--tx2);text-align:center;transition:background .15s,border-color .15s}
.seg input:checked+span{border-color:var(--or);background:var(--orp);color:var(--or2)}
.seg input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.lunch .lb{font-weight:700;color:var(--tx)!important;margin-top:10px;font-size:.88rem}
.mon{border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.mon summary{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;list-style:none}.mon summary::-webkit-details-marker{display:none}
.mon summary::before{content:"+";color:var(--or2);font-weight:800;width:14px;text-align:center}.mon[open] summary::before{content:"\2212"}
.day h4{font-size:.95rem;color:var(--navy);margin-top:12px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:44px}
.ck input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--or)}
.ckb{min-width:0;font-size:.95rem}.ckb i{font-style:normal;color:var(--or2);font-weight:700;margin-right:8px}.ckb em{display:block;font-style:normal;color:var(--tx2);font-size:.88rem}
.nt{font-size:.88rem!important;color:var(--tx3)!important;margin-top:6px}
.who{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.fd{display:block;font-weight:700;font-size:.9rem;margin-top:10px}
.fd input{display:block;width:100%;min-height:44px;margin-top:4px;font:400 16px var(--fb);padding:10px 12px;border:1px solid rgba(11,22,35,.25);border-radius:10px;background:#fff;color:var(--tx)}
.hp{position:absolute;left:-9999px;height:1px;overflow:hidden}
#err{color:#B42318;font-weight:700;font-size:.92rem;margin-top:10px}
#ok{color:#166534;font-weight:700;font-size:.92rem;margin-top:10px}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}.row:first-of-type{border-top:0}
.row span{flex:1;min-width:0}.row b{display:block}.row em{display:block;font-style:normal;font-size:.88rem;color:var(--tx2)}.row i{font-style:normal;font-size:1.4rem;color:var(--or2)}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
@media(prefers-reduced-motion:reduce){.card,.pan{animation:none}.mt,.seg label>span{transition:none}}
</style>
</head>

 function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-tab')===id?'true':'false')});
  [].forEach.call(document.querySelectorAll('.pan'),function(p){p.hidden=p.getAttribute('data-pan')!==id})}
 tabs.forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-tab'))})});
 show(R.length?R[0].id:tabs[0].getAttribute('data-tab'));

 // 便當只在選現場時出現
 function sync(){[].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');fs.querySelector('.lunch').hidden=!(m&&m.value==='現場')})}
 f.addEventListener('change',function(){sync();okm.hidden=true});

 function mineText(r){var x=rec&&rec.dr&&rec.dr[r];if(!x)return T('你還沒預約這一場','You have not booked this one');
  var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch];
  return T('你的預約：'+m[0]+(lu?'，'+lu[0]:''),'Your booking: '+m[1]+(lu?', '+lu[1]:''))}
 function paint(){
  [].forEach.call(document.querySelectorAll('[data-mine]'),function(p){p.innerHTML=mineText(p.getAttribute('data-mine'))});
  var nx=document.getElementById('next');
  if(!R.length){nx.innerHTML=T('下一場','Next session','p','class="k"')+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');apply(L);return}
  var r=R[0],x=rec&&rec.dr&&rec.dr[r.id];
  nx.innerHTML=T('下一場 · 第 '+('0'+r.n).slice(-2)+' 場','Next · Round '+('0'+r.n).slice(-2),'p','class="k"')+T(r.zh,r.en,'h2')+T(r.note_zh,r.note_en,'p')
   +'<div class="st"><span class="pill '+(x?(x.mode==='不克參加'?'off':'on'):'')+'">'+mineText(r.id)+'</span></div>'
   +'<div class="gos"><button type="button" class="btn sm" data-goto="'+r.id+'">'+(x?T('更改預約','Change my booking'):T('預約這一場','Book this one'))+'</button>'
   +'<button type="button" class="btn sm o" data-tabgo="'+r.id+'">'+T('看這個月','This month')+'</button></div>';
  go.innerHTML=rec?T('更新預約','Update booking'):T('送出預約','Book');
  apply(L)}
 document.addEventListener('click',function(ev){
  var g=ev.target.closest('[data-goto]');if(g){var fs=f.querySelector('.rd[data-r="'+g.getAttribute('data-goto')+'"]');(fs||f).scrollIntoView({behavior:'smooth',block:'start'});var i=fs&&fs.querySelector('input');if(i)setTimeout(function(){i.focus({preventScroll:true})},400);return}
  var t=ev.target.closest('[data-tabgo]');if(t){show(t.getAttribute('data-tabgo'));document.getElementById('months').scrollIntoView({behavior:'smooth',block:'start'})}});

 function fill(r){
  f.elements.name.value=r.name||'';f.elements.email.value=r.email||'';f.elements.company_title.value=r.company_title||'';
  Object.keys(r.dr||{}).forEach(function(k){var a=f.querySelector('input[name="m_'+k+'"][value="'+r.dr[k].mode+'"]');if(a)a.checked=true;var l=f.querySelector('input[name="l_'+k+'"][value="'+r.dr[k].lunch+'"]');if(l)l.checked=true});
  [].forEach.call(f.querySelectorAll('input[name="ms"]'),function(c){c.checked=(r.ms||[]).indexOf(c.value)>=0});
  if((r.ms||[]).some(function(v){return f.querySelector('input[name="ms"][value="'+v+'"]')}))f.querySelector('.mon').open=true;
  sync()}
 if(me){f.elements.name.value=me.name||'';f.elements.email.value=me.email||'';f.elements.company_title.value=me.company_title||''}
 paint();
 if(me&&me.email&&me.t){fetch(WK+'/rsvp?e='+encodeURIComponent(me.email)+'&t='+encodeURIComponent(me.t)).then(function(r){return r.json()}).then(function(j){if(j&&j.rec){rec=j.rec;fill(rec);paint()}}).catch(function(){})}

 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;okm.hidden=true;
  var dr={},sum=[],old=rec;
  [].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');if(!m)return;
   var l=f.querySelector('input[name="l_'+r+'"]:checked'),lu=m.value==='現場'&&l?l.value:'';dr[r]={mode:m.value,lunch:lu};
   var rr=d.rounds.filter(function(z){return z.id===r})[0];sum.push(rr.zh+' 第 '+('0'+rr.n).slice(-2)+' 場：'+m.value+(lu?'，'+lu:''))});
  if(old&&old.dr)Object.keys(old.dr).forEach(function(k){if(!dr[k]&&!f.querySelector('.rd[data-r="'+k+'"]'))dr[k]=old.dr[k]});
  var ms=[].slice.call(f.querySelectorAll('input[name="ms"]:checked')).map(function(c){return c.value});
  var a={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),company_title:f.elements.company_title.value.trim(),dr:dr,ms:ms,lang:L,t:(me&&me.email&&me.email.toLowerCase()===f.elements.email.value.trim().toLowerCase())?me.t:'',_honey:f.elements._honey.value};
  if(!a.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email))return fail('請填姓名與 email。','Please add your name and email.');
  if(!Object.keys(dr).length&&!ms.length&&!old)return fail('請至少選一場。','Please choose at least one session.');
  go.disabled=true;
  var subj=(old?'LP 預約更新 ':'LP 預約 ')+a.name;
  var note={name:a.name,email:a.email,company_title:a.company_title,deal_room:sum.join('\n'),monday_sessions:ms.map(function(v){return d.ms[v]?d.ms[v].zh:v}).join('\n'),lang:L};
  function mail(){return Promise.all(RECIP.map(function(to){var fd=new FormData();fd.append('_subject',subj);fd.append('_template','table');fd.append('_captcha','false');Object.keys(note).forEach(function(k){fd.append(k,note[k])});
   return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).then(function(r){return r.json().then(function(j){return r.ok&&(j.success===true||j.success==='true')},function(){return false})},function(){return false})})).then(function(rs){return rs.indexOf(true)>=0})}
  var mailed=mail();
  fetch(WK+'/rsvp',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(a)}).then(function(r){return r.json()}).then(function(j){return j&&j.ok?j:null},function(){return null}).then(function(j){
   if(j){me={name:a.name,email:a.email,company_title:a.company_title,t:j.t};ls(KM,JSON.stringify(me));
    rec={name:a.name,email:a.email,company_title:a.company_title,dr:dr,ms:ms};paint();go.disabled=false;
    okm.innerHTML=old?T('已更新。','Updated.'):T('收到了，已幫你預約。','Got it. You are booked.');okm.hidden=false;return}
   mailed.then(function(ok){go.disabled=false;
    if(ok){okm.innerHTML=T('收到了。之後要改，直接回覆群組或來信 vincent@evoscalecapital.com。','Got it. To change it later, reply in the group or email vincent@evoscalecapital.com.');okm.hidden=false}
    else fail('送出失敗，請稍後再試，或來信 vincent@evoscalecapital.com。','Could not send. Please try again shortly, or email vincent@evoscalecapital.com.')})
  });
 });
}
})();
</script>
</body></html>
