<head>

<meta name="robots" content="noindex,nofollow">

<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);
--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin:6px 0 14px}
.when{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.when b{font-weight:700}
.when span{color:#AFC0D3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 0;min-width:140px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:700 .92rem var(--fb);border-radius:999px;padding:11px 14px;border:1.5px solid var(--or);cursor:pointer;background:none;color:inherit}
.btn.p{background:var(--or);color:#fff}
.btn.g{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.o{color:var(--or2);background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--tx2);font-size:.95rem}
.bar{display:flex;border-radius:10px;overflow:hidden;font-weight:700;font-size:.88rem;text-align:center}
.bar div{padding:10px 6px}
.bar div{white-space:nowrap}.bar .a{flex:10;background:var(--or);color:#fff}.bar .b{flex:8;background:var(--orp);color:var(--or2)}.bar .c{flex:3;background:#EEF1F4;color:var(--tx3)}
@media (max-width:480px){.hero .btn,.card .btn{flex:1 1 100%}}
ol.st{list-style:none;counter-reset:s;margin-top:4px}
ol.st li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--line);color:var(--tx2);font-size:.95rem}
ol.st li:first-child{border-top:0}
ol.st li::before{content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
ol.st b{color:var(--tx);display:block}
.note{font-size:.85rem;color:var(--tx3);margin-top:8px}
.qrimg{display:block;width:100%;height:auto;border-radius:12px;margin-top:14px;cursor:zoom-in}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
.teams{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.team details.more{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;margin-left:-76px}
.team details.more summary{text-align:center}
.team details.more summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--or2);list-style:none}
.team details.more summary::-webkit-details-marker{display:none}
.team details.more summary::after{content:' ▾'}.team details.more[open] summary::after{content:' ▴'}
.team dl{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.85rem}
.team dt{font-weight:700;color:var(--tx);white-space:nowrap}.team dd{color:var(--tx2);margin:0}
.team p.src{font-size:.75rem;color:var(--tx3);margin-top:8px}
.team button.ai{margin-top:10px;width:100%;font:700 .88rem var(--fb);border:1.5px solid var(--or);background:var(--or);color:#fff;border-radius:999px;padding:10px 12px;cursor:pointer}
.team button.ai.sd{background:#fff;color:var(--or2)}
.team button.cp{margin-top:6px;width:100%;font:700 .85rem var(--fb);border:1.5px solid var(--line);background:#fff;color:var(--tx2);border-radius:999px;padding:9px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.88rem;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90vw;text-align:center}
.team p.fd{font-size:.82rem;color:var(--tx3);margin-top:2px}
.team{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;gap:12px;padding:12px}
.team .th{flex:none;width:64px;height:64px;border:1px solid var(--line);padding:0;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.6rem;color:var(--tx3)}
.team .th img{width:100%;height:100%;object-fit:cover;display:block}
.team .bs a{font:700 .82rem var(--fb);border:1.5px solid var(--line);color:var(--tx2);background:#fff;border-radius:999px;padding:6px 12px;text-decoration:none}
.team .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.team .ord{font-size:.75rem;font-weight:700;color:var(--or2)}
.team b{font-size:1.02rem}
.team p{font-size:.88rem;color:var(--tx2)}
.team .bs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.team .bs button{font:700 .82rem var(--fb);border:1.5px solid var(--or);color:var(--or2);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.team.tba{color:var(--tx3)}
.team.tba .th{background:#E9EEF3}
.btn.big{font-size:1.05rem;padding:14px 16px;flex:1 1 100%}
.inv{padding:0;overflow:hidden}.inv img{display:block;width:100%;height:auto}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
#lb{position:fixed;inset:0;background:rgba(6,12,22,.94);display:none;z-index:9;overflow:auto;-webkit-overflow-scrolling:touch}
#lb.on{display:block}
#lbi{padding:56px 10px 40px}
#lbi img{display:block;width:100%;max-width:900px;margin:0 auto;border-radius:6px}
#lbi img+img{margin-top:12px}
#lbd{position:fixed;top:10px;right:60px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.2rem;font-weight:700;cursor:pointer;z-index:10}
#lbx{position:fixed;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.3rem;font-weight:700;cursor:pointer;z-index:10}
.calx{flex:1 1 100%}.calx summary{list-style:none;width:100%}.calx summary::-webkit-details-marker{display:none}.calx .btns{margin-top:8px}.calx .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding:11px 6px}
</style>

<style>ul.cn{list-style:none;margin-top:6px;padding:0}ul.cn li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line);color:var(--tx2);font-size:.93rem}ul.cn li:first-child{border-top:0}ul.cn li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--or)}.ah{font-size:.82rem;font-weight:800;color:var(--tx2);letter-spacing:.04em;margin:16px 0 0}.al{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media (max-width:420px){.al{grid-template-columns:1fr}}.ac{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:66px;background:#fff;min-width:0}.am{flex:none;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem;letter-spacing:.02em}.am.lg{background:#fff;border:1px solid var(--line)}.am.lg svg{width:26px;height:26px}.am.lg img{width:32px;height:32px;object-fit:contain;border-radius:6px;display:block}.ai{min-width:0;display:flex;flex-direction:column;gap:2px}.ai b{font-size:.9rem;line-height:1.25}.at{font-size:.78rem;color:var(--tx2);line-height:1.3}</style><style id="rv2">/* LP 會後頁 v2 樣式（11/02 分區版，檔尾有 A／B 區塊、參訪、CTA、KPI 規則），由 _build_dealroom_recap.py 注入成 <style id="rv2">，規則一律以 .rv2 開頭；2026-11-02 */
.rv2{
  --rv-green:#16A34A;--rv-yellow:#F59E0B;--rv-red:#DC2626;--rv-none:#CBD5E1;
  --rv-navy2:#1E3A5F;--rv-tint:#FFFBF7;--rv-tint-line:#FFE3CC;--rv-tint2:#F3F5F8;--rv-blue:#1E5BB8;
  --rv-r:14px;--rv-rs:10px;--rv-top:52px;
  --rv-ease:cubic-bezier(.2,.7,.2,1);
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
}
@media(min-width:640px){.rv2 .wrap{max-width:720px}}
@media(min-width:960px){.rv2 .wrap{max-width:1040px}}
.rv2 :focus-visible{outline:2px solid var(--or);outline-offset:2px}

/* hero */
.rv2 .hero{display:grid;gap:var(--s3)}
.rv2 .hero h1{margin-bottom:0}
.rv2 .hs{display:flex;flex-wrap:wrap;gap:var(--s1) 14px;font-size:.9rem;color:#AFC0D3;font-weight:500}
.rv2 .hs span+span::before{content:"·";margin-right:14px;opacity:.6}
@media(min-width:640px){.rv2 .hero{grid-template-columns:1fr auto;align-items:end;padding:32px 36px 28px}.rv2 .hero h1{font-size:1.75rem}.rv2 .hs{justify-content:flex-end;padding-bottom:4px}.rv2 .hero .kick{grid-column:1/-1}}

/* 速覽 */
.rv2 .ov{display:grid;gap:10px;margin-top:var(--s3)}
.rv2 .ovc{display:grid;grid-template-columns:40px 1fr;grid-template-rows:auto auto;gap:6px 12px;align-items:center;text-align:left;min-height:44px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:var(--rv-r);cursor:pointer;font:inherit;color:inherit;transition:border-color .2s,transform .2s,box-shadow .2s}
.rv2 .ovc:hover{border-color:var(--or);transform:translateY(-1px);box-shadow:0 4px 14px rgba(11,22,35,.06)}
.rv2 .ovc.on{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.rv2 .ovl{grid-row:1/3;width:40px;height:40px;border-radius:10px;object-fit:cover;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--fd);color:var(--tx3)}
.rv2 .ovt{display:grid;gap:2px;min-width:0}.rv2 .ovt b{font-size:1rem;font-weight:800}
.rv2 .ovt span{font-size:.85rem;color:var(--tx2);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rv2 .ltw{display:grid;gap:4px;min-width:0}
.rv2 .lt{display:flex;height:8px;border-radius:999px;overflow:hidden;background:#EEF1F5;transform:scaleX(0);transform-origin:left;transition:transform .7s var(--rv-ease) .15s}
.rv2 .lt i{display:block;height:100%}
.rv2 .in .lt{transform:none}
.rv2 .ltx{font-size:.78rem;font-weight:700;color:var(--tx3)}
.rv2 .lvs{display:flex;flex-wrap:wrap;gap:4px 6px;min-width:0}
.rv2 .lvs .chip{display:inline-block;font-size:.78rem;font-weight:700;color:var(--tx2);background:var(--rv-tint2);border-radius:999px;padding:2px 10px}
.rv2 .ov .lvs{grid-column:2}
@media(min-width:640px){.rv2 .ov{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}}

/* tab */
.rv2 .tabs{position:sticky;top:0;z-index:5;display:flex;gap:4px;padding:4px 0;margin-top:20px;background:rgba(246,247,249,.92);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rv2 .tab{flex:1 1 0;min-width:0;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:700 .92rem var(--fb);color:var(--tx2);background:none;border:0;border-radius:var(--rv-rs);position:relative;cursor:pointer;padding:0 8px;transition:color .2s,background .2s}
.rv2 .tab img{width:22px;height:22px;border-radius:6px;object-fit:cover;flex:none}
.rv2 .tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rv2 .tab:hover{background:rgba(11,22,35,.04)}
.rv2 .tab::after{content:"";position:absolute;left:12px;right:12px;bottom:-5px;height:3px;border-radius:3px;background:var(--or);transform:scaleX(0);transition:transform .22s var(--rv-ease)}
.rv2 .tab.on{color:var(--navy)}.rv2 .tab.on::after{transform:scaleX(1)}
@media(min-width:640px){.rv2 .tab{flex:0 0 auto;padding:0 18px}}

/* 面板 */
.rv2 .tp{display:grid;gap:28px;margin-top:24px}
.rv2 .tp[hidden]{display:none!important}   /* display:grid 會蓋掉 hidden 屬性，一定要這條 */
.rv2 .tpm1,.rv2 .tpm2{display:grid;gap:28px}
.rv2 .tp.enter{animation:rvpan .22s ease-out}
@keyframes rvpan{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(min-width:640px){.rv2 .tp,.rv2 .tpm1,.rv2 .tpm2{gap:32px}}
@media(min-width:960px){
  .rv2 .tp{grid-template-columns:minmax(0,1fr) 300px;grid-template-rows:auto auto;column-gap:32px;row-gap:32px}
  .rv2 .tpm1{grid-column:1;grid-row:1}.rv2 .tpm2{grid-column:1;grid-row:2}
  .rv2 .tpr{grid-column:2;grid-row:1/3;align-self:start;position:sticky;top:64px}
}
.rv2 .rs{min-width:0}
.rv2 .rh{font:800 1.05rem var(--fb);color:var(--navy);margin:0 0 6px;display:flex;align-items:center;gap:8px}
.rv2 .rc{font-size:.78rem;font-family:var(--fb);background:var(--navy);color:#fff;border-radius:999px;padding:1px 8px;min-width:22px;text-align:center}
.rv2 .rn{font-size:.85rem;color:var(--tx3);margin:0 0 10px}

/* 隊頭 */
.rv2 .tph{display:grid;grid-template-columns:48px 1fr;grid-template-areas:"l n" "t t" "k k";gap:6px 14px;align-items:center}
.rv2 .tpl{grid-area:l;width:48px;height:48px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);color:var(--tx3)}
.rv2 .tpn{grid-area:n;font:800 1.3rem var(--fd);color:var(--tx);margin:0}
.rv2 .tg2{grid-area:t;font-size:1.05rem;color:var(--tx2);margin:0;line-height:1.5}
.rv2 .tph .kv{grid-area:k;list-style:none;margin:4px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px 14px}
.rv2 .tph .kv li{font-size:.82rem;font-weight:700;color:var(--tx)}
.rv2 .tph .kv li i{font-style:normal;font-weight:600;color:var(--tx3);margin-right:5px}
@media(min-width:640px){.rv2 .tph{grid-template-columns:64px 1fr;grid-template-areas:"l n" "l t" "l k";gap:4px 16px;align-items:start}.rv2 .tpl{width:64px;height:64px;border-radius:14px}.rv2 .tpn{font-size:1.5rem}}

/* 現場講了什麼 */
.rv2 ol.st{margin-top:0}.rv2 ol.st li{font-size:.95rem;line-height:1.65;padding:10px 0 10px 36px;color:var(--tx2)}
.rv2 ol.st li::before{top:12px}
@media(min-width:640px){.rv2 ol.st li{font-size:1rem}}

/* 成員怎麼看 */
.rv2 .vw{border-top:3px solid var(--or);padding-top:14px}
.rv2 .vw .ltw{margin:0 0 12px}
.rv2 ol.vwp{list-style:none;counter-reset:v;margin:0;padding:0}
.rv2 ol.vwp li{counter-increment:v;position:relative;padding:10px 0 10px 36px;border-top:1px solid var(--line);font-size:.95rem;line-height:1.65;color:var(--tx)}
.rv2 ol.vwp li:first-child{border-top:0}
.rv2 ol.vwp li::before{content:counter(v);position:absolute;left:0;top:12px;width:24px;height:24px;border-radius:50%;background:var(--or);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
.rv2 .vw .cl{margin-top:12px}
.rv2 ul.vo{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px}
.rv2 .voc{background:#fff;border:1px solid var(--line);border-left:3px solid var(--or);border-radius:var(--rv-rs);padding:12px 14px}
.rv2 .vq{margin:0;font-size:.95rem;line-height:1.65;color:var(--tx)}
.rv2 .vt{margin:6px 0 0;font-size:.82rem;line-height:1.55;color:var(--tx3)}
@media(min-width:640px){
  .rv2 .vw{border:1px solid var(--rv-tint-line);border-top:3px solid var(--or);border-radius:var(--rv-r);background:var(--rv-tint);padding:18px 24px 20px}
  .rv2 ol.vwp li,.rv2 .vq{font-size:1rem}
}

/* 問答 */
.rv2 .qf button{min-height:44px;padding:0 14px}
.rv2 ol.ql{gap:0}
.rv2 .qi{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:12px 0;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent}
.rv2 .qi:first-child{border-top:0}
.rv2 .qi.ask{background:transparent}
.rv2 .qn{width:24px;height:24px;font-size:.78rem}
.rv2 .qi p{font-weight:600;font-size:.95rem;line-height:1.6}
@media(min-width:640px){
  .rv2 ol.ql{gap:8px}
  .rv2 .qi{grid-template-columns:28px 1fr;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}
  .rv2 .qi.ask{background:#FFF8F2;border-color:#FFD9BD}
  .rv2 .qn{width:28px;height:28px;font-size:.85rem}
  .rv2 .qi p{font-size:1rem}
}

/* 側欄 */
.rv2 .tpc{background:#fff;border:1px solid var(--line);border-radius:var(--rv-r);padding:16px}
.rv2 .tprh{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.rv2 .tprh img{width:28px;height:28px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.rv2 .tprh b{font-size:.95rem;font-weight:800}
.rv2 .rh3{font:800 .8rem var(--fb);letter-spacing:.04em;color:var(--tx3);margin:14px 0 6px}
.rv2 .ask{margin:0;font-size:.95rem;line-height:1.6;color:var(--tx)}
.rv2 .hp{display:flex;flex-wrap:wrap;gap:6px}
.rv2 .hp span{font-size:.78rem;font-weight:700;color:var(--tx2);background:var(--rv-tint2);border-radius:999px;padding:4px 10px}
.rv2 .mt{display:grid;gap:8px;margin-top:16px}
.rv2 .mt .btn{width:100%;min-width:0;min-height:44px;flex:none}
@media(min-width:640px){.rv2 .tpc{padding:20px}.rv2 .ask{border-left:3px solid var(--or);padding-left:10px}}

/* 公司資料 */
.rv2 .pf{margin:0;border:0;border-radius:0;background:transparent}
.rv2 .pf .gd{display:grid;grid-template-columns:1fr;gap:0}
.rv2 .pf .mn{padding:12px 0 0}
.rv2 .pf .sd{padding:12px 0 0;margin-top:12px;border-top:1px solid var(--line)}
.rv2 .pf h4{display:flex;align-items:center;gap:7px;font:800 .95rem var(--fb);color:var(--navy);margin:14px 0 6px}.rv2 .pf h4:first-child{margin-top:0}
.rv2 .pf h4 i{font-style:normal;width:20px;height:20px;border-radius:6px;background:var(--or);color:#fff;font:800 .7rem var(--fb);display:inline-flex;align-items:center;justify-content:center}
.rv2 .pf .bx{border-left:2px solid #E3E7ED;padding-left:10px;font-size:.95rem;line-height:1.65;color:var(--tx2)}.rv2 .pf .bx ol,.rv2 .pf .bx ul{margin:0;padding-left:18px}
.rv2 .pf .sd h5{font:800 .84rem var(--fb);color:var(--navy);margin:14px 0 6px;border-bottom:1px solid #D9DEE6;padding-bottom:3px}.rv2 .pf .sd h5:first-child{margin-top:0}

  }
  window.drRender=function(l){render(l)};
})();
