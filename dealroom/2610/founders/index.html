<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);
--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin:6px 0 14px}
.when{display:flex;flex-direction:column;gap:6px;font-size:1rem}
.when b{font-weight:700}
.when span{color:#AFC0D3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 0;min-width:140px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;font:700 .92rem var(--fb);border-radius:999px;padding:11px 14px;border:1.5px solid var(--or);cursor:pointer;background:none;color:inherit}
.btn.p{background:var(--or);color:#fff}
.btn.g{color:#fff;border-color:rgba(255,255,255,.4)}
.btn.o{color:var(--or2);background:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:10px}
.card p{color:var(--tx2);font-size:.95rem}
.bar{display:flex;border-radius:10px;overflow:hidden;font-weight:700;font-size:.88rem;text-align:center}
.bar div{padding:10px 6px}
.bar div{white-space:nowrap}.bar .a{flex:10;background:var(--or);color:#fff}.bar .b{flex:8;background:var(--orp);color:var(--or2)}.bar .c{flex:3;background:#EEF1F4;color:var(--tx3)}
@media (max-width:480px){.hero .btn,.card .btn{flex:1 1 100%}}
ol.st{list-style:none;counter-reset:s;margin-top:4px}
ol.st li{counter-increment:s;position:relative;padding:9px 0 9px 36px;border-top:1px solid var(--line);color:var(--tx2);font-size:.95rem}
ol.st li:first-child{border-top:0}
ol.st li::before{content:counter(s);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:.78rem;display:flex;align-items:center;justify-content:center}
ol.st b{color:var(--tx);display:block}
.note{font-size:.85rem;color:var(--tx3);margin-top:8px}
.qrimg{display:block;width:100%;height:auto;border-radius:12px;margin-top:14px;cursor:zoom-in}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
.teams{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
.team details.more{margin-top:8px;border-top:1px dashed var(--line);padding-top:8px;margin-left:-76px}
.team details.more summary{text-align:center}
.team details.more summary{cursor:pointer;font-weight:700;font-size:.85rem;color:var(--or2);list-style:none}
.team details.more summary::-webkit-details-marker{display:none}
.team details.more summary::after{content:' ▾'}.team details.more[open] summary::after{content:' ▴'}
.team dl{margin-top:8px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:.85rem}
.team dt{font-weight:700;color:var(--tx);white-space:nowrap}.team dd{color:var(--tx2);margin:0}
.team p.src{font-size:.75rem;color:var(--tx3);margin-top:8px}
.team button.ai{margin-top:10px;width:100%;font:700 .88rem var(--fb);border:1.5px solid var(--or);background:var(--or);color:#fff;border-radius:999px;padding:10px 12px;cursor:pointer}
.team button.ai.sd{background:#fff;color:var(--or2)}
.team button.cp{margin-top:6px;width:100%;font:700 .85rem var(--fb);border:1.5px solid var(--line);background:#fff;color:var(--tx2);border-radius:999px;padding:9px 12px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.88rem;padding:10px 16px;border-radius:10px;display:none;z-index:20;max-width:90vw;text-align:center}
.team p.fd{font-size:.82rem;color:var(--tx3);margin-top:2px}
.team{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;gap:12px;padding:12px}
.team .th{flex:none;width:64px;height:64px;border:1px solid var(--line);padding:0;border-radius:14px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.6rem;color:var(--tx3)}
.team .th img{width:100%;height:100%;object-fit:cover;display:block}
.team .bs a{font:700 .82rem var(--fb);border:1.5px solid var(--line);color:var(--tx2);background:#fff;border-radius:999px;padding:6px 12px;text-decoration:none}
.team .tb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.team .ord{font-size:.75rem;font-weight:700;color:var(--or2)}
.team b{font-size:1.02rem}
.team p{font-size:.88rem;color:var(--tx2)}
.team .bs{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.team .bs button{font:700 .82rem var(--fb);border:1.5px solid var(--or);color:var(--or2);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer}
.team.tba{color:var(--tx3)}
.team.tba .th{background:#E9EEF3}
.btn.big{font-size:1.05rem;padding:14px 16px;flex:1 1 100%}
.inv{padding:0;overflow:hidden}.inv img{display:block;width:100%;height:auto}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
#lb{position:fixed;inset:0;background:rgba(6,12,22,.94);display:none;z-index:9;overflow:auto;-webkit-overflow-scrolling:touch}
#lb.on{display:block}
#lbi{padding:56px 10px 40px}
#lbi img{display:block;width:100%;max-width:900px;margin:0 auto;border-radius:6px}
#lbi img+img{margin-top:12px}
#lbd{position:fixed;top:10px;right:60px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.2rem;font-weight:700;cursor:pointer;z-index:10}
#lbx{position:fixed;top:10px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.3rem;font-weight:700;cursor:pointer;z-index:10}
.calx{flex:1 1 100%}.calx summary{list-style:none;width:100%}.calx summary::-webkit-details-marker{display:none}.calx .btns{margin-top:8px}.calx .btn{flex:1 1 0;min-width:0;white-space:nowrap;padding:11px 6px}
</style>

<style>ul.cn{list-style:none;margin-top:6px}ul.cn li{position:relative;padding:8px 0 8px 18px;border-top:1px solid var(--line);color:var(--tx2);font-size:.93rem}ul.cn li:first-child{border-top:0}ul.cn li::before{content:"";position:absolute;left:2px;top:17px;width:7px;height:7px;border-radius:50%;background:var(--or)}.card h3{font-size:.95rem;margin:14px 0 2px;color:var(--navy)}ol.st li .q{color:var(--tx);font-weight:700;display:block;margin-bottom:2px}.th2{display:flex;align-items:center;gap:12px}.th2 img{width:52px;height:52px;border-radius:12px;border:1px solid var(--line);object-fit:cover}.th2 b{font-family:var(--fd);font-size:1.25rem}.th2 span{display:block;font-size:.82rem;color:var(--tx3)}.fbl{margin-top:10px;font-size:.93rem;color:var(--tx2)}.also{display:inline-block;font-size:.72rem;font-weight:700;color:#C2410C;background:#FFF1E6;border:1px solid #FFB27A;border-radius:999px;padding:0 8px;margin-bottom:4px}.ah{font-size:.82rem;font-weight:800;color:var(--tx2);letter-spacing:.04em;margin:16px 0 0}.al{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}@media (max-width:420px){.al{grid-template-columns:1fr}}.ac{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;min-height:66px;background:#fff;min-width:0}.am{flex:none;width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.82rem;letter-spacing:.02em}.am.lg{background:#fff;border:1px solid var(--line)}.am.lg svg{width:26px;height:26px}.am.lg img{width:32px;height:32px;object-fit:contain;border-radius:6px;display:block}.ai{min-width:0;display:flex;flex-direction:column;gap:2px}.ai b{font-size:.9rem;line-height:1.25}.at{font-size:.78rem;color:var(--tx2);line-height:1.3}</style></head>
