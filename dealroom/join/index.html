<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Room</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=DM+Sans:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px}
a{color:inherit}.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
#lang{font:700 .85rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:20px;padding:5px 14px;cursor:pointer}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:24px 20px 20px}
.kick{color:#FF8C42;font-weight:700;font-size:.78rem;letter-spacing:.1em}
.hero h1{font-family:var(--fd);font-size:1.65rem;line-height:1.25;margin-top:6px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 16px;margin-top:12px}
.card h2{font-family:var(--fd);font-size:1.2rem;margin-bottom:8px}
.card p{color:var(--tx2);font-size:.95rem}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:12px;color:var(--tx2);font-size:.95rem}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.ck:first-of-type{margin-top:8px}
.ck input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--or)}
.ckb{min-width:0;font-size:.95rem}.ckb i{font-style:normal;color:var(--or2);font-weight:700;margin-right:8px}
.ckb em{display:block;font-style:normal;color:var(--tx2);font-size:.88rem}
.tag{display:inline-block;margin-left:8px;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:99px;white-space:nowrap}.tag.y{background:#FDF3D7;color:#92600A}.tag.g{background:#E3F4EA;color:#166534}
.ck{min-height:44px}.rad label{min-height:44px}
.rd{border-top:1px solid var(--line)}.rd .ck{border-top:0}.rd:first-of-type{margin-top:8px}
.nt{font-size:.85rem!important;color:var(--tx3)!important;margin-top:10px}
.att{margin:0 0 10px 30px;padding:10px 12px;background:var(--bg);border-radius:10px}.att .lb{margin-top:0;font-size:.85rem}.att ul{list-style:none;margin-top:4px}.att li{font-size:.9rem;color:var(--tx2);padding:2px 0}
.pd{border-top:1px solid var(--line)}.pd:first-of-type{margin-top:8px}
.pd summary{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;font-size:.95rem;list-style:none}.pd summary::-webkit-details-marker{display:none}
.pd summary::before{content:"+";color:var(--or2);font-weight:800;width:14px;text-align:center}.pd[open] summary::before{content:"2"}
.pc{margin-left:auto;font-size:.8rem;color:var(--tx3)}
.pd ul{list-style:none;padding:0 0 10px 24px}.pd li{padding:6px 0}.pd li b{display:block;font-size:.95rem}.pd li em{display:block;font-style:normal;font-size:.88rem;color:var(--tx2)}
.mem{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:.85rem!important}.mem[hidden]{display:none}
.mem button{min-height:44px;min-width:44px;padding:0 12px;border:0;background:none;color:var(--or2);font:700 .85rem var(--fb);text-decoration:underline;cursor:pointer}
#lang{min-height:44px;min-width:44px}.logo{min-height:44px}.fd input{min-height:44px}
.card,.locked{animation:fi .45s ease-out both}@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.card,.locked{animation:none}}
.day h3{font-size:.95rem;color:var(--navy);margin-top:14px}
.lb{font-weight:700;color:var(--tx)!important;margin-top:12px}
.rad{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:4px}.rad label{display:flex;align-items:center;gap:6px;font-size:.95rem;cursor:pointer}.rad input{accent-color:var(--or);width:18px;height:18px}
.fd{display:block;font-weight:700;font-size:.9rem;margin-top:10px}
.fd input{display:block;width:100%;margin-top:4px;font:400 16px var(--fb);padding:10px 12px;border:1px solid rgba(11,22,35,.25);border-radius:10px;background:#fff;color:var(--tx)}
.hp{position:absolute;left:-9999px;height:1px;overflow:hidden}
#err{color:#B42318;font-weight:700;font-size:.9rem;margin-top:10px}
.btn{display:block;width:100%;margin-top:14px;font:700 1rem var(--fb);border-radius:999px;padding:13px;border:0;background:var(--or);color:#fff;cursor:pointer}.btn[disabled]{opacity:.6;cursor:wait}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
</style>
</head>

<script>
(function(){
var code=location.hash.replace(/^#/,''),el=document.getElementById('sealed'),box=document.getElementById('body'),done=false;
function lang(){try{return localStorage.getItem('dr_lang')||'zh'}catch(e){return 'zh'}}
function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
 document.getElementById('lang').textContent=l==='en'?'中文':'English';document.title='Deal Room';try{localStorage.setItem('dr_lang',l)}catch(e){}}
var q=new URLSearchParams(location.search).get('lang'),L=(q==='en'||q==='zh')?q:lang();apply(L);
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L)});
window.addEventListener('hashchange',function(){location.reload()});
if(!code||!el||!window.crypto||!crypto.subtle)return;
var b=Uint8Array.from(atob(el.textContent.trim()),function(c){return c.charCodeAt(0)});
crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
.then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))}).then(function(x){start(JSON.parse(new TextDecoder().decode(x)))}).catch(function(){});
function start(d){
 box.innerHTML=d.html;
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
 document.querySelectorAll('.day,.rd').forEach(function(e){if(e.getAttribute('data-date')<today)e.remove()});
 document.querySelectorAll('.att').forEach(function(e){if(today<e.getAttribute('data-from')||today>e.getAttribute('data-to'))e.remove()});
 apply(L);
 var f=document.getElementById('f'),mem=document.getElementById('mem'),err=document.getElementById('err'),go=document.getElementById('go'),drx=document.getElementById('drx');
 function picked(nm){return [].slice.call(f.querySelectorAll('input[name="'+nm+'"]:checked')).map(function(x){return x.getAttribute('data-label')})}
 function radio(nm){var r=f.querySelector('input[name="'+nm+'"]:checked');return r?r.value:''}
 f.addEventListener('change',function(){drx.hidden=!picked('dr').length});
 function ids(){return [].slice.call(f.querySelectorAll('input[name="dr"]:checked')).map(function(x){return x.value})}
 try{var me=JSON.parse(localStorage.getItem('dr_join_me')||'null');if(me&&(me.name||me.email)){f.elements.name.value=me.name||'';f.elements.email.value=me.email||'';f.elements.company_title.value=me.company_title||'';mem.hidden=false}}catch(e){}
 document.getElementById('clr').addEventListener('click',function(){try{localStorage.removeItem('dr_join_me')}catch(e){}f.elements.name.value='';f.elements.email.value='';f.elements.company_title.value='';mem.hidden=true});
 function fail(zh,en){err.textContent=L==='en'?en:zh;err.hidden=false}
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 f.addEventListener('submit',function(ev){
  ev.preventDefault();if(done)return;err.hidden=true;
  var dr=picked('dr'),ms=picked('ms');
  var a={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),company_title:f.elements.company_title.value.trim(),deal_room:dr.join('、'),deal_room_ids:ids().join(','),mode:dr.length?radio('mode'):'',lunch:dr.length?radio('lunch'):'',monday_sessions:ms.join('、'),lang:L,_honey:f.elements._honey.value};
  if(!a.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email))return fail('請填姓名與 email。','Please add your name and email.');
  if(!dr.length&&!ms.length)return fail('請至少勾一個場次。','Please tick at least one session.');
  if(dr.length&&!a.mode)return fail('請選 Deal Room 的出席方式。','Please choose how you will join the Deal Room.');
  go.disabled=true;
  var subj='Deal Room 報名 '+a.name;
  var mails=RECIP.map(function(to){var fd=new FormData();fd.append('_subject',subj);fd.append('_template','table');fd.append('_captcha','false');Object.keys(a).forEach(function(k){fd.append(k,a[k])});
   return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).then(function(r){return r.json().then(function(j){return r.ok&&(j.success===true||j.success==='true')},function(){return false})},function(){return false})});
  var backup=fetch('https://evoscale-forms.comicbnb.workers.dev/submit',{method:'POST',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({form:'member_rsvp',subject:subj,fields:a})}).then(function(r){return r.json()}).then(function(j){return !!(j&&j.stored)},function(){return false});
  backup.then(function(ok){return ok||Promise.all(mails).then(function(rs){return rs.indexOf(true)>=0})}).then(function(ok){
   go.disabled=false;
   if(!ok)return fail('送出失敗，請稍後再試，或來信 vincent@evoscalecapital.com。','Could not send. Please try again shortly, or email vincent@evoscalecapital.com.');
   try{localStorage.setItem('dr_join_me',JSON.stringify({name:a.name,email:a.email,company_title:a.company_title}))}catch(e){}
   done=true;f.hidden=true;document.getElementById('done').hidden=false;window.scrollTo(0,0);
  });
 });
}
})();
</script>
