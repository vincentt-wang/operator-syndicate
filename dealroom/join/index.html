<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deal Room</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<style>
:root{--or:#FF6600;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--bg:#F6F7F9;--line:rgba(11,22,35,.1)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Noto Sans TC',sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 18px}
h1{font-size:1.3rem;margin-bottom:8px}p{color:var(--tx2)}
a.btn{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:14px;border-radius:999px;background:var(--or);color:#fff;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>報名改到一春成員專區</h1>
<p>預約、每月場次與會後資料都放在成員專區，連結在群組裡。</p>
<a class="btn" href="/lp/">開啟成員專區</a>
</div></div>
</body>
</html>
