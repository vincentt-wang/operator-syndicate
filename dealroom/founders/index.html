<script>/* 10/31 Vincent：問答只放成員問的問題，不附我們整理的答案（看起來像自問自答）。LP 頁與創辦人頁共用這一塊。 */
(function(){
  var TG={rev:['收費與獲利','Revenue','#FF6600'],cus:['客戶與通路','Customers and channels','#1E5BB8'],prd:['產品與競爭','Product and competition','#0A1628'],exp:['合作與拓展','Partners and expansion','#64748B'],trc:['牽引數據','Traction','#FFB27A']};
  if(!document.getElementById('qacss')){var st=document.createElement('style');st.id='qacss';st.textContent=
    '.qbar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#EEF1F5;margin:12px 0 10px;transform-origin:left;animation:qgrow .8s cubic-bezier(.2,.7,.2,1) both}'
    +'.qbar i{display:block;height:100%}'
    +'.qf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}'
    +'.qf button{font:inherit;font-size:.8rem;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--tx2);border-radius:999px;padding:4px 11px;min-height:34px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}'
    +'.qf button i{width:8px;height:8px;border-radius:50%;display:inline-block}'
    +'.qf button.on{background:var(--navy);color:#fff;border-color:var(--navy)}'
    +'ol.ql{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px}'
    +'.qi{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;animation:qin .45s ease both;animation-delay:var(--d,0ms)}'
    +'.qi[hidden]{display:none}.qi.ask{background:#FFF8F2;border-color:#FFD9BD}'
    +'.qn{flex:none;width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center}'
    +'.qi.ask .qn{background:#FF6600}'
    +'.qt{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:700;color:var(--tx2);margin-right:6px}'
    +'.qt i{width:7px;height:7px;border-radius:50%;display:inline-block}'
    +'.qk{display:inline-block;font-size:.72rem;font-weight:700;color:#C2410C;background:#FFF1E6;border:1px solid #FFB27A;border-radius:999px;padding:0 8px}'
    +'.qi p{margin:4px 0 0;color:var(--tx);font-weight:600;line-height:1.55}'
    +'.qx{margin:10px 0 0;font-size:.88rem;color:var(--tx2)}'
    +'.qh{margin:6px 0 0}.qh summary{cursor:pointer;list-style:none;display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:#C2410C}'
    +'.qh summary::-webkit-details-marker{display:none}.qh summary::before{content:"";border:5px solid transparent;border-left-color:#C2410C;transition:transform .15s}'
    +'.qh[open] summary::before{transform:rotate(90deg)}.qh p{margin:6px 0 0;font-weight:400;color:var(--tx2);border-left:2px solid #FFD9BD;padding-left:10px;line-height:1.6}'
    +'.qh small{display:block;margin-top:4px;color:var(--tx3);font-size:.74rem}'
    +'@keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}'
    +'@keyframes qgrow{from{transform:scaleX(0)}to{transform:scaleX(1)}}'
    +'@media (prefers-reduced-motion:reduce){.qi,.qbar{animation:none}.qh summary::before{transition:none}}';
    document.head.appendChild(st)}
  function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  /* items: [{tag, text, ask:bool}]；id 用來讓篩選只動自己這一塊 */
  window.drQA=function(items,zh,id){
    var order=[],cnt={};items.forEach(function(q){var t=TG[q.tag]?q.tag:'prd';q.tag=t;if(!cnt[t]){cnt[t]=0;order.push(t)}cnt[t]++});
    var lab=function(t){return TG[t][zh?0:1]};
    var h='<div class="qbar" aria-hidden="true">'+order.map(function(t){return '<i style="flex:'+cnt[t]+';background:'+TG[t][2]+'"></i>'}).join('')+'</div>';
    if(order.length>1)h+='<div class="qf" data-qf="'+id+'"><button type="button" class="on" data-t="">'+(zh?'全部':'All')+(items.nocount?'':' '+items.length)+'</button>'+order.map(function(t){return '<button type="button" data-t="'+t+'"><i style="background:'+TG[t][2]+'"></i>'+e(lab(t))+(items.nocount?'':' '+cnt[t])+'</button>'}).join('')+'</div>';
    h+='<ol class="ql" id="'+id+'">'+items.map(function(q,i){
      return '<li class="qi'+(q.ask?' ask':'')+'" data-t="'+q.tag+'" style="--d:'+(i*50)+'ms"><span class="qn">'+(i+1)+'</span><div><span class="qt"><i style="background:'+TG[q.tag][2]+'"></i>'+e(lab(q.tag))+'</span>'+(q.ask?'<span class="qk">'+(zh?'我們想再問':'We would like to ask')+'</span>':'')+'<p>'+e(q.text)+'</p>'+(q.heard&&q.hl?'<div class="qans"><span class="qal">'+e(q.hl)+'</span><p>'+e(q.heard)+'</p></div>':'')+(q.src?'<small class="qsrc">'+e(q.src)+'</small>':'')+(q.heard&&!q.hl?'<details class="qh"><summary>'+(zh?'現場聽到的回答大意':'What we heard you answer')+'</summary><p>'+e(q.heard)+'</p><small>'+(zh?'依錄音整理的摘要，不是逐字稿；有出入請在群裡更正。':'Summarised from the recording, not a transcript. Correct us in the group if this is off.')+'</small></details>':'')+'</div></li>'}).join('')+'</ol>';
    return h};
  document.addEventListener('click',function(ev){
    var b=ev.target.closest('.qf button');if(!b)return;var box=b.parentNode,v=b.getAttribute('data-t'),n=0;
    [].forEach.call(box.children,function(x){x.classList.toggle('on',x===b)});
    [].forEach.call(document.querySelectorAll('#'+box.getAttribute('data-qf')+' .qi'),function(li){
      var show=!v||li.getAttribute('data-t')===v;li.hidden=!show;
      if(show){li.style.animation='none';void li.offsetWidth;li.style.animation='';li.style.setProperty('--d',(n++*50)+'ms')}})});
})();
</script>
<script>/* LP 會後頁與創辦人會後頁共用的渲染元件（v2）。由兩支產生器先於各自的頁面 JS 內嵌；11/02 起。

(function(){
  var RM=matchMedia('(prefers-reduced-motion: reduce)').matches,OPEN={};
  try{OPEN=JSON.parse(sessionStorage.getItem('dr_open')||'{}')}catch(er){}
  function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var FBEN={'引薦客戶或買方':'Customer intros','通路或經銷資源':'Channels','場域驗證或技術合作':'Pilot site or tech partner','介紹人才或顧問':'Talent or advisors','引薦其他投資人':'Investor intros','有興趣跟投':'Interested in co-investing','其他':'Other'};
