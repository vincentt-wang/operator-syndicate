<style>
:root{
  --orange:#FF6600;--orange-2:#E55A00;--orange-pale:#FFF7ED;
  --navy:#0A1628;--text:#0B1623;--text-2:#2D3748;--text-3:#5A6A7A;
  --bg:#F7F9FB;--white:#fff;--border:rgba(11,22,35,.09);
  --fd:'Playfair Display','Noto Serif TC',serif;
  --fb:'DM Sans','Noto Sans TC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.lm{width:34px;height:34px;border-radius:8px;background:var(--orange);color:#fff;font-weight:800;font-family:var(--fd);display:flex;align-items:center;justify-content:center;font-size:.95rem}
.logo span{font-family:var(--fd);font-weight:800;font-size:1.05rem}
.only{font-size:.8rem;font-weight:700;color:var(--orange-2);background:var(--orange-pale);border-radius:999px;padding:5px 12px}
.hero{background:var(--navy);color:#fff;border-radius:18px;padding:34px 28px 28px;margin-top:6px}
.kick{color:#FF8C42;font-weight:700;font-size:.82rem;letter-spacing:.12em}
.hero h1{font-family:var(--fd);font-size:2.1rem;line-height:1.2;margin:10px 0 6px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 20px}
.fact{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:12px 14px}
.fact b{display:block;font-size:1.08rem}
.fact small{color:#9FB0C3;font-size:.82rem}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;border-radius:999px;padding:11px 20px;border:1.5px solid var(--orange);cursor:pointer;font-family:var(--fb);background:none}
.btn.p{background:var(--orange);color:#fff}
.btn.g{color:#fff;border-color:rgba(255,255,255,.45)}
.btn.o{color:var(--orange-2);background:var(--white)}
.btn.s{padding:8px 14px;font-size:.88rem}
section{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:26px 26px 24px;margin-top:16px}
.num{display:inline-block;color:var(--orange);font-weight:800;font-size:.85rem;letter-spacing:.1em}
section h2{font-family:var(--fd);font-size:1.45rem;line-height:1.3;margin:4px 0 14px}
.teams{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.team{border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.team .th{display:block;width:100%;aspect-ratio:1/1;border:0;padding:0;cursor:zoom-in;background:#E9EEF3}
.team .th img{width:100%;height:100%;object-fit:cover;display:block}
.team .tb{padding:14px 14px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.team .ord{font-size:.78rem;font-weight:700;color:var(--orange-2)}
.team b{font-size:1.08rem}
.team p{font-size:.9rem;color:var(--text-2);flex:1}
.team .tba{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:1.4rem;color:var(--text-3);border-bottom:1px dashed var(--border)}
.team .btns{margin-top:6px}
.lbl{font-size:.86rem;color:var(--text-3);margin-top:14px}
.ppl{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.p{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.p>div{flex:1;min-width:0}
.p b{display:block;font-size:.95rem}
.p span{display:block;font-size:.86rem;color:var(--text-3)}
.p.off{opacity:.55}
.tg{font-style:normal;font-size:.74rem;font-weight:700;border-radius:6px;padding:2px 7px;white-space:nowrap}
.tg.onsite{background:var(--orange-pale);color:var(--orange-2)}
.tg.online{background:#E8F1FB;color:#1E5AA8}
.tg.absent{background:#EEF2F7;color:var(--text-3)}
.li{flex:none;width:26px;height:26px;border-radius:6px;background:#0A66C2;color:#fff;font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;text-decoration:none}
.locked{font-size:1rem;color:var(--text-2);background:var(--white);border:1px solid var(--border);border-radius:16px;padding:28px 26px;margin-top:16px}
footer{color:var(--text-3);font-size:.85rem;text-align:center;padding:28px 0 40px}
#lb{position:fixed;inset:0;background:rgba(6,12,22,.92);display:none;z-index:9;overflow:auto;-webkit-overflow-scrolling:touch}
#lb.on{display:block}
#lb img{display:block;max-width:min(100%,1000px);margin:56px auto 32px;border-radius:8px}
#lbx{position:fixed;top:12px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);font-size:1.3rem;font-weight:700;cursor:pointer;z-index:10}
@media (max-width:760px){
  .wrap{padding:0 16px}
  .hero{padding:28px 20px 24px}
  .hero h1{font-size:1.7rem}
  .facts,.teams,.ppl{grid-template-columns:1fr}
  section{padding:22px 18px 20px}
  .hero .btn{flex:1 1 100%}
  .team .tba{aspect-ratio:auto;height:96px;font-size:1.15rem}
}
</style>
</head>

      if(x.card)IM['c'+x.n]=x.card; if(x.one)IM['o'+x.n]=x.one;
      var top=x.tba?'<div class="tba">下週揭曉</div>':'<button class="th" type="button" data-im="c'+x.n+'" aria-label="放大圖卡"><img src="'+x.card+'" alt="'+e(x.name)+' 圖卡"></button>';
      var bt=x.tba?'':'<div class="btns">'+(x.card?'<button class="btn o s" type="button" data-im="c'+x.n+'">圖卡</button>':'')+(x.one?'<button class="btn o s" type="button" data-im="o'+x.n+'">一頁介紹</button>':'<span class="lbl" style="margin:0">一頁介紹準備中</span>')+'</div>';
      return '<div class="team">'+top+'<div class="tb">'+(x.slot?'<span class="ord">'+e(x.slot)+'</span>':'')+'<b>'+e(x.name)+'</b><p>'+e(x.zh)+'</p>'+bt+'</div></div>';
    }).join('');
    document.getElementById('body').innerHTML='<section><span class="num">01</span><h2>這一場的三隊</h2><div class="teams">'+t+'</div><div class="lbl">每隊 20 分鐘。點圖卡或按鈕可以放大看；出場順序確定後會更新。</div></section><section><span class="num">02</span><h2>出席成員</h2>'+d.who+'</section>';
  }).catch(function(){});
  var lb=document.getElementById('lb'), li=lb.querySelector('img');
  document.addEventListener('click',function(ev){
    var t=ev.target.closest('[data-im]'); if(!t)return;
    li.src=IM[t.getAttribute('data-im')]; lb.classList.add('on'); lb.scrollTop=0; document.body.style.overflow='hidden';
  });
  function close(){lb.classList.remove('on');document.body.style.overflow=''}
  document.getElementById('lbx').addEventListener('click',close);
  lb.addEventListener('click',function(ev){if(ev.target===lb)close()});
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')close()});
})();
</script>
</body>
</html>
