<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>內部頁面｜一春資本</title>
<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);
--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}html{overflow-x:hidden}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);line-height:1.65;font-size:16px;overflow-wrap:anywhere;word-break:break-word;-webkit-font-smoothing:antialiased}
.wrap{max-width:920px;margin:0 auto;padding:18px 16px 40px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--fd);font-weight:800;margin-bottom:14px;min-height:44px}
.lm{width:30px;height:30px;border-radius:7px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.locked{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;color:var(--tx2);font-size:.95rem}
.hero{background:var(--navy);color:#fff;border-radius:16px;padding:22px 20px 18px}
.hero .for{display:inline-block;background:var(--or);color:#fff;font-weight:700;font-size:.8rem;border-radius:999px;padding:3px 14px;margin-bottom:10px}
.hero h1{font-family:var(--fd);font-size:1.6rem;line-height:1.3;margin-bottom:6px}
.hero p{color:rgba(255,255,255,.82);font-size:.95rem}
.lgd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.78rem;color:var(--tx3);margin:12px 2px 0}
.sx{display:inline-block;font-size:.75rem;font-weight:700;line-height:1;border-radius:999px;padding:3px 7px;margin:0 2px;vertical-align:1px;white-space:nowrap}
.s-co{background:#FFF1E6;color:#B84A00}.s-dk{background:#E8F0FE;color:#1E4FB8}.s-rg{background:#E6F4EC;color:#1D6B3F}.s-es{background:#F1ECFB;color:#5B3BA6}.s-dp{background:#E0F2F7;color:#0B5F78}
.deal{background:#fff;border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden;animation:fu .42s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms);transition:box-shadow .2s,border-color .2s}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.deal summary{list-style:none;cursor:pointer;padding:16px 18px 0;min-height:44px}
.deal summary::-webkit-details-marker{display:none}
.deal .hd{display:flex;gap:14px;align-items:center}
.deal .lg{flex:none;width:52px;height:52px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--tx3);font-size:1.2rem}
.deal .hm{flex:1;min-width:0}
.deal .nmw{display:block;font-size:1.05rem;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .sec{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:.84rem;color:var(--tx2);white-space:nowrap;overflow:hidden}
.deal .sec .ind{overflow:hidden;text-overflow:ellipsis}
.deal .ct{flex:none;font-size:.76rem;font-weight:700;color:var(--or2);background:var(--orp);border-radius:999px;padding:2px 8px}
.deal .mt{font-size:.8rem;color:var(--tx3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.deal .more{display:flex;align-items:center;justify-content:center;min-height:44px;margin:10px -18px 0;border-top:1px solid var(--line);font-size:.84rem;font-weight:700;color:var(--or2)}
.deal .more .c{display:none}.deal[open] .more .o{display:none}.deal[open] .more .c{display:inline}
.deal[open]{border-color:rgba(255,102,0,.4);box-shadow:0 8px 22px rgba(255,102,0,.08)}
.bd{padding:6px 18px 18px;border-top:1px solid var(--line);animation:fi .28s ease-out}
@keyframes fi{from{opacity:0}to{opacity:1}}
.bd h4{font-family:var(--fd);font-size:1.02rem;margin:24px 0 10px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bd h4:first-child{margin-top:14px}
.bd h4 i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;font:800 .8rem var(--fb);display:inline-flex;align-items:center;justify-content:center}
.bd h4 small{flex-basis:100%;font:500 .8rem var(--fb);color:var(--tx3)}
.bd dl{font-size:.9rem}
.rw{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid rgba(11,22,35,.06)}
.rw:last-child{border-bottom:0}
.bd dt{color:var(--tx3);font-size:.82rem;font-weight:700;padding-top:2px}
.bd dd{margin:0;color:var(--tx);line-height:1.65}
.src small{display:inline;color:var(--tx3);font-size:.78rem;margin-left:2px}
.mu{color:var(--tx3)}
.bd ul{padding-left:1.2em;color:var(--tx2);font-size:.92rem}.bd li{margin:4px 0}
.tb{width:100%;border-collapse:collapse;font-size:.88rem}
.tb th{text-align:left;font-size:.78rem;color:var(--tx3);font-weight:700;padding:6px 8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
.tb td{vertical-align:top;padding:9px 8px;border-bottom:1px solid rgba(11,22,35,.06);color:var(--tx2)}
.tb.dk td:first-child{width:104px;color:var(--tx)}.tb.dk td.ask{color:var(--tx);font-weight:600}
.tb.deck td:first-child{width:96px;color:var(--tx);font-weight:600}.tb.deck td:last-child{width:84px;white-space:nowrap;color:var(--tx3)}
.tb tr.gh td{background:#F6F7F9;font-size:.78rem;font-weight:800;letter-spacing:.06em;color:var(--tx3);padding:5px 8px}
.tb tr.mst td:first-child{box-shadow:inset 3px 0 0 var(--or)}
.must{display:inline-block;font-style:normal;font-size:.76rem;font-weight:800;color:#B84300;background:#FFE8D6;border-radius:999px;padding:1px 8px;margin-left:6px}
.ang{display:block;color:var(--tx3);font-size:.76rem;margin-top:2px}
.ex,.vd,.af{font-size:.92rem;color:var(--tx2);margin:6px 0}.ex b,.vd b{display:inline-block;min-width:72px;color:var(--tx)}
.vd{background:var(--orp);border-left:4px solid var(--or);border-radius:8px;padding:9px 12px;margin-top:12px;color:var(--tx);font-weight:600}
.af{color:var(--tx3);font-size:.86rem;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line)}
.jgs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}
.jg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.88rem}
.jl{font-size:.8rem;font-weight:700;color:var(--tx3)}
.jc{align-self:flex-start;font-size:.8rem;font-weight:800;border-radius:999px;padding:2px 10px}
.jc.y{background:#E6F4EC;color:#1D6B3F}.jc.n{background:#FDE8E8;color:#B42318}.jc.p{background:#FFF1E6;color:#B84A00}.jc.q{background:#EEF0F3;color:#5B6676}
.ibtn{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.ibtn button{flex:1 1 180px;min-height:46px;font:700 .92rem var(--fb);border-radius:999px;border:1.5px solid var(--or);background:var(--or);color:#fff;cursor:pointer}
.rv img{display:block;width:100%;height:auto;border:1px solid var(--line);border-radius:8px;margin-top:10px;box-shadow:0 4px 16px rgba(11,22,35,.08)}
.rv .pg{font-size:.8rem;color:var(--tx3);margin-top:10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.88rem;padding:10px 16px;border-radius:10px;display:none;max-width:90vw}
footer{text-align:center;color:var(--tx3);font-size:.82rem;margin-top:22px}
@media(max-width:700px){
.jgs{grid-template-columns:1fr}
.tb thead{display:none}
.tb,.tb tbody{display:block}
.tb tr{display:block;border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:10px 0}
.tb tr.gh{border:0;padding:0;margin:14px 0 0;background:none}.tb tr.gh td{display:block;border-radius:8px}
.tb td,.tb.dk td:first-child,.tb.deck td:first-child,.tb.deck td:last-child{display:grid;grid-template-columns:64px 1fr;gap:8px;width:auto;border-bottom:1px solid rgba(11,22,35,.06);padding:7px 0}
.tb td:last-child{border-bottom:0}
.tb td::before{content:attr(data-l);font-size:.78rem;font-weight:700;color:var(--tx3)}
.tb tr.gh td::before{content:none}
.tb tr.mst td:first-child{box-shadow:none}
.tb.dk td:first-child::before{content:attr(data-l)}
.rw{grid-template-columns:1fr;gap:3px}}
@media(prefers-reduced-motion:reduce){.deal,.bd{animation:none}.deal{transition:none}}
</style></head><body><div class="wrap">
<div class="logo"><span class="lm">一</span>一春資本</div>
<p class="locked" id="lock">內部頁面</p>
<div id="app" hidden></div>

<script>
(function(){
  var code=decodeURIComponent(location.hash.replace(/^#/,'')),B=JSON.parse(document.getElementById('sealed').textContent);
  function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
  var enc=new TextEncoder(),T=document.getElementById('toast');
  function toast(m){T.textContent=m;T.style.display='block';setTimeout(function(){T.style.display='none'},1800)}
  function dec(t){var raw=b64(t.trim());
    return crypto.subtle.importKey('raw',enc.encode(code),'PBKDF2',false,['deriveKey']).then(function(k){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:raw.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])
    }).then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(16,28)},k,raw.slice(28))})}
  if(!code||!window.crypto||!crypto.subtle)return;
  crypto.subtle.digest('SHA-256',enc.encode(code)).then(function(d){
    var idx=Array.prototype.map.call(new Uint8Array(d),function(x){return('0'+x.toString(16)).slice(-2)}).join('').slice(0,8);
    if(!B[idx])throw 0;
    return dec(B[idx]);
  }).then(function(b){
    var X=JSON.parse(new TextDecoder().decode(b));
    document.title=X.title+'｜一春資本';
    document.getElementById('lock').hidden=true;
    var app=document.getElementById('app');app.innerHTML=X.html;app.hidden=false;
    app.addEventListener('click',function(ev){
      var br=ev.target.closest&&ev.target.closest('.rbtn');if(!br)return;
      var rv=br.parentNode.nextElementSibling,n=br.getAttribute('data-n'),lab='看十頁判讀（'+n+' 頁）',rid=br.getAttribute('data-rid');
      if(rv.getAttribute('data-on')){rv.innerHTML='';rv.removeAttribute('data-on');br.textContent=lab;return}
      br.textContent='載入中';
      fetch('r/'+rid+'.bin',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(dec).then(function(b){
        var R=JSON.parse(new TextDecoder().decode(b));
        rv.innerHTML=R.pages.map(function(p,i){return '<p class="pg">第 '+(i+1)+' 頁</p><img alt="" src="data:image/jpeg;base64,'+p+'">'}).join('')+(R.pdf?'<div class="ibtn"><button type="button" class="pdfb">下載十頁判讀 PDF</button></div>':'');
        rv.setAttribute('data-on','1');br.textContent='收起十頁判讀';
        var bp=rv.querySelector('.pdfb');if(bp)bp.onclick=function(){bp.textContent='下載中';
          fetch('r/'+rid+'p.bin',{cache:'no-store'}).then(function(r){return r.text()}).then(dec).then(function(buf){
            var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'application/pdf'}));a.download=R.pdfname||'report.pdf';document.body.appendChild(a);a.click();
            setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},800);bp.textContent='下載十頁判讀 PDF'}).catch(function(){bp.textContent='下載十頁判讀 PDF';toast('下載失敗，稍後再試')})}
      }).catch(function(){br.textContent=lab;toast('載入失敗，稍後再試')})});
  }).catch(function(){});
})();
</script></body></html>
