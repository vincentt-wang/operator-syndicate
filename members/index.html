 document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
var onLang=null,A=ESA({guest:true,lang:function(){return L},apply:function(){apply(L)},start:start,clear:function(){box.innerHTML=''}});
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);A.relang();if(onLang)onLang()});
A.boot();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(zh,en,tag,attr){tag=tag||'span';return '<'+tag+(attr?' '+attr:'')+' data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+esc(L==='en'?en:zh)+'</'+tag+'>'}
var MODE={'現場':['現場','On site'],'線上':['線上','Online'],'不克參加':['不克參加',"Can't make it"]};
var LUN={'葷食':['葷食','regular lunch'],'素食':['素食','vegetarian lunch'],'不用':['不用便當','no lunch']};

function start(d,auth){
 box.innerHTML=d.html;
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 var R=d.rounds.filter(function(r){return r.date>=today});
 document.querySelectorAll('.rd,.day,.mt[data-date],.pan[data-date]').forEach(function(e){if(e.getAttribute('data-date')<today){if(e.hasAttribute('data-eval')){[].forEach.call(e.querySelectorAll('.bk,.mine,.calb,.wait'),function(x){x.remove()})}else e.remove()}});
 [].forEach.call(document.querySelectorAll('[data-evalfrom]'),function(a){a.hidden=a.getAttribute('data-evalfrom')>today});
 var f=document.getElementById('f'),err=document.getElementById('err'),done=document.getElementById('done'),go=document.getElementById('go');
 var rec=auth.rec,email=(auth.user&&auth.user.email)||'';
 document.getElementById('roacct').innerHTML=T('預約帳號：'+email,'Booking account: '+email);

 var tabs=[].slice.call(document.querySelectorAll('.mt'));
 function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-tab')===id?'true':'false')});
  [].forEach.call(document.querySelectorAll('.pan'),function(p){p.hidden=p.getAttribute('data-pan')!==id})}
 tabs.forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-tab'))})});
 if(tabs.length){var sid=R.length?R[0].id:tabs[tabs.length-1].getAttribute('data-tab');show(sid);
  var tb=document.querySelector('.tabs'),sel=tb.querySelector('[data-tab="'+sid+'"]');
  var scr=function(){tb.scrollLeft=Math.max(0,sel.offsetLeft-12)};scr();requestAnimationFrame(scr);window.addEventListener('load',scr)}
 else document.getElementById('months').innerHTML='<h2>'+T('每月場次','Monthly sessions')+'</h2>'+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');

 function sync(){[].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');fs.querySelector('.lunch').hidden=!(m&&m.value==='現場')});
  [].forEach.call(f.querySelectorAll('.rtb'),function(b){var t=f.querySelector('input[name="t_'+b.getAttribute('data-rt')+'"]:checked');b.setAttribute('aria-pressed',t&&t.value==='參加'?'true':'false')})}
 f.addEventListener('change',function(){sync();done.hidden=true});
 f.addEventListener('click',function(e){var b=e.target.closest('.rtb');if(!b)return;var id=b.getAttribute('data-rt'),on=b.getAttribute('aria-pressed')!=='true',x=f.querySelector('input[name="t_'+id+'"][value="'+(on?'參加':'不參加')+'"]');if(x)x.checked=true;sync();done.hidden=true});

 function modeTxt(x){var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch],rt=x.rt==='參加';return [m[0]+(lu?'，'+lu[0]:'')+(rt?'，Roundtable':''),m[1]+(lu?', '+lu[1]:'')+(rt?', roundtable':'')]}
 function mineText(r){var x=rec&&rec.dr&&rec.dr[r];if(!x)return T('尚未預約','Not booked yet');var m=modeTxt(x);return T('已預約：'+m[0],'Booked: '+m[1])}
 function days(r){var p=r.date.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((dt-t0)/864e5)}
 function booked(id){var y=rec&&rec.dr&&rec.dr[id];return !!(y&&y.mode!=='不克參加')}
 function paint(){
  [].forEach.call(document.querySelectorAll('[data-mine]'),function(p){p.innerHTML=mineText(p.getAttribute('data-mine'))});
  [].forEach.call(document.querySelectorAll('[data-pvbtn]'),function(b){b.hidden=false});
  var nx=document.getElementById('next');
  if(!R.length){nx.innerHTML=T('下一場','Next session','p','class="k"')+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');apply(L);return}
  var r=R[0],x=rec&&rec.dr&&rec.dr[r.id],dd=days(r);
  var rows='';
  if(rec){R.forEach(function(z){var y=rec.dr&&rec.dr[z.id];if(y){var m=modeTxt(y);rows+='<li>'+T(z.zh,z.en)+T(m[0],m[1])+'</li>'}});
   Object.keys(d.ms).forEach(function(k){if((rec.ms||[]).indexOf(k)>=0&&d.ms[k].date>=today)rows+='<li>'+T('週一旁聽 '+d.ms[k].zh,'Monday sit-in '+d.ms[k].en)+'<span></span></li>'})}
  nx.innerHTML=T('下一場','Next session','p','class="k"')+'<div class="nxh">'+T(r.zh,r.en,'h2')+(r.time_zh?T(r.time_zh,r.time_en,'span','class="nxt"'):'')+'</div>'
   +T('', '', 'p', 'class="cd"')
   +T(r.note_zh,r.note_en,'p','class="nn"')
   +'<div class="st"><span class="pill '+(x?(x.mode==='不克參加'?'off':'on'):'')+'">'+mineText(r.id)+'</span></div>'
   +(rows?'<ul class="ml">'+rows+'</ul>':'')
   +'<div class="gos"><button type="button" class="btn sm" data-goto="'+r.id+'">'+(x?T('更改預約','Change my booking'):T('預約這一場','Book this one'))+'</button>'+(r.ready?'<button type="button" class="btn sm g" data-pv-open="'+r.id+'">'+T('會前資料','Before the session')+'</button>':'<button type="button" class="btn sm g dis" disabled aria-disabled="true">'+T('會前資料','Before the session')+T('近期公布','Soon','i','class="soon"')+'</button>')+'</div>'
   +(r.calh||'')
   +(d.last?'<a class="rc" href="'+esc(d.last.u)+'">'+T(d.last.zh,d.last.en)+'</a>':'');
  [].forEach.call(document.querySelectorAll('.pan[data-pan="'+r.id+'"] .calx'),function(e){e.hidden=true});
  var c=nx.querySelector('.cd');c.setAttribute('data-zh',dd<=0?'今天':'還有 '+dd+' 天');c.setAttribute('data-en',dd<=0?'Today':dd+(dd===1?' day to go':' days to go'));c.textContent=c.getAttribute('data-'+L);
  go.innerHTML=rec?T('更新預約','Update booking'):T('送出預約','Book');
  apply(L)}
 onLang=function(){if(!done.hidden&&lastDone)showDone(lastDone.old,lastDone.items)};
 var pvLast=null;
 function pvOpen(id){var rr=d.rounds.filter(function(z){return z.id===id})[0];if(rr){location.href=rr.lp||('/members/'+rr.pg+'/');return}var p=document.querySelector('.pv[data-pv="'+id+'"]');if(!p)return;pvLast=document.activeElement;p.hidden=false;document.body.classList.add('pvon');var x=p.querySelector('.pvx');if(x)x.focus({preventScroll:true})}
 function pvClose(){[].forEach.call(document.querySelectorAll('.pv'),function(p){p.hidden=true});document.body.classList.remove('pvon');if(pvLast&&pvLast.focus)pvLast.focus({preventScroll:true})}
 document.addEventListener('keydown',function(ev){if(ev.key==='Escape')pvClose()});
 document.addEventListener('click',function(ev){
  var po=ev.target.closest('[data-pv-open]');if(po){pvOpen(po.getAttribute('data-pv-open'));return}
  var pc=ev.target.closest('[data-pv-close]');if(pc||ev.target.classList.contains('pv')){pvClose();if(!(pc&&pc.hasAttribute('data-goto')))return}
  var g=ev.target.closest('[data-goto]');if(g){var fs=f.querySelector('.rd[data-r="'+g.getAttribute('data-goto')+'"]');(fs||f).scrollIntoView({behavior:'smooth',block:'start'});var i=fs&&fs.querySelector('input');if(i)setTimeout(function(){i.focus({preventScroll:true})},400)}});

 function fill(r){
  if(r.name)f.elements.name.value=r.name;f.elements.company_title.value=r.company_title||'';f.elements.note.value=r.note||'';
  Object.keys(r.dr||{}).forEach(function(k){var a=f.querySelector('input[name="m_'+k+'"][value="'+r.dr[k].mode+'"]');if(a)a.checked=true;var l=f.querySelector('input[name="l_'+k+'"][value="'+r.dr[k].lunch+'"]');if(l)l.checked=true;var t=r.dr[k].rt&&f.querySelector('input[name="t_'+k+'"][value="'+r.dr[k].rt+'"]');if(t)t.checked=true});
  sync()}
 var kn=auth.known||{};f.elements.name.value=kn.name||(auth.user&&auth.user.name)||'';f.elements.company_title.value=kn.company_title||'';   // 11/02 Vincent：已知身分先幫他填好
 if(rec)fill(rec);
 paint();
 var bk=new URLSearchParams(location.search).get('book');if(bk){var bf=f.querySelector('.rd[data-r="'+bk+'"]');if(bf)setTimeout(function(){bf.scrollIntoView({behavior:'smooth',block:'start'})},300)}

 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=null;
 function showDone(old,items){
  lastDone={old:old,items:items};
  document.getElementById('donet').innerHTML=old?T('預約已更新','Booking updated'):T('預約已送出','Booking received');
  document.getElementById('donel').innerHTML=items.map(function(i){return '<li>'+T(i[0],i[1])+'</li>'}).join('');
  var nb=R.filter(function(z){return booked(z.id)&&z.ready});
  document.getElementById('donep').innerHTML=nb.map(function(z){return '<button type="button" class="btn sm o" data-pv-open="'+z.id+'">'+T('會前資料 '+z.zh.replace(/（.*/,''),'Before the session · '+z.en)+'</button>'}).join('');
  var was=done.hidden;done.hidden=false;
  if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}
  done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function mail(a,sum){ /* 11/16：後端 /rsvp2 沒有寄信金鑰，名單信一封都沒寄出過，通知改回前端 FormSubmit；完整名單看總部 */
  var note={name:a.name,email:email,company_title:a.company_title,deal_room:sum.join('\n'),note:a.note,lang:L};
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','LP 預約（新增或更新） '+a.name);fd.append('_template','table');fd.append('_captcha','false');Object.keys(note).forEach(function(k){fd.append(k,note[k])});
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  if(f.elements._honey.value)return;
  var dr={},sum=[],items=[],old=rec;
  [].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');if(!m)return;
   var l=f.querySelector('input[name="l_'+r+'"]:checked'),lu=m.value==='現場'&&l?l.value:'',t=f.querySelector('input[name="t_'+r+'"]:checked'),rt=m.value==='現場'&&t?t.value:'';dr[r]={mode:m.value,lunch:lu,rt:rt};
   var rr=d.rounds.filter(function(z){return z.id===r})[0],tx=modeTxt(dr[r]);sum.push(rr.zh+'：'+m.value+(lu?'，'+lu:'')+(rt?'，會後圓桌'+rt:''));items.push([rr.zh+'　'+tx[0],rr.en+'  '+tx[1]])});
  if(old&&old.dr)Object.keys(old.dr).forEach(function(k){if(!dr[k]&&!f.querySelector('.rd[data-r="'+k+'"]'))dr[k]=old.dr[k]});
  var a={name:f.elements.name.value.trim(),company_title:f.elements.company_title.value.trim(),dr:dr,note:f.elements.note.value.trim().slice(0,300),lang:L};
  if(!a.name)return fail('還需要你的姓名。','We still need your name.');
  if(!a.company_title)return fail('還需要你的公司與職稱。','We still need your company and title.');
  if(!Object.keys(dr).length&&!old)return fail('還沒選場次。','No session selected yet.');
  go.disabled=true;
  fetch(WK+'/rsvp2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(a)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}
   if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   rec=j.rec||{company_title:a.company_title,dr:dr,note:a.note};paint();
   showDone(typeof j.created==='boolean'?!j.created:!!old,items);mail(a,sum)});
 });
}
})();
</script>
<style>
.rd.cx{border:0;border-radius:16px;padding:0;margin:10px 0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);overflow:hidden;min-inline-size:0}
.rd.cx>legend{float:left;width:100%;padding:0;margin:0}.rd.cx>.rdb{clear:both}
.rd.cx.op{box-shadow:inset 0 0 0 1.5px rgba(255,102,0,.45)}
.rdh{display:flex;align-items:center;gap:10px;width:100%;padding:14px 16px;background:none;border:0;cursor:pointer;text-align:left;font:inherit;color:var(--navy)}
.rdh .rdm{flex:1;min-width:0}.rdh b{display:block;font-size:1.05rem}.rdh .rdt{display:block;font-size:.88rem;color:var(--tx2);margin-top:2px}
.rdh .rds{font-size:.82rem;font-weight:700;color:var(--or2);white-space:nowrap}.rdh .rds.no{color:var(--tx3)}
.rdh i{width:10px;height:10px;border-right:2px solid var(--tx3);border-bottom:2px solid var(--tx3);transform:rotate(45deg);transition:transform .2s;flex:0 0 auto;margin-right:4px}
.rd.cx.op .rdh i{transform:rotate(-135deg)}.rd.cx .rdb{padding:0 16px 14px}.rd.cx .rdb[hidden]{display:none}
.rd.cx .lgt{display:none}
</style>
<script>
(function(){var TM={"dr_1126": {"zh": "11:45 報到，12:15 開始，14:00 結束", "en": "Doors 11:45 am, starts 12:15 pm, ends 2:00 pm"}, "dr_1217": {"zh": "16:30 到 19:30（傍晚場）", "en": "4:30 to 7:30 pm (evening)"}, "dr_0128": {"zh": "11:45 報到，12:15 開始，14:00 結束", "en": "Doors 11:45 am, starts 12:15 pm, ends 2:00 pm"}};var L=function(){return document.documentElement.lang==='en'};
function st(fs){var c=fs.querySelector('input[name^="m_"]:checked,input[name^="gm_"]:checked');var s=fs.querySelector('.rds');if(!s)return;
 if(c){s.textContent=c.parentNode.textContent.trim();s.classList.remove('no')}else{s.textContent=L()?'Not chosen':'還沒選';s.classList.add('no')}}
function cx(fs){if(fs.classList.contains('cx'))return;var id=fs.getAttribute('data-r')||fs.getAttribute('data-g');var t=TM[id]||{};var lg=fs.querySelector('legend');if(!lg)return;
 fs.classList.add('cx');var b=document.createElement('div');b.className='rdb';b.hidden=true;
 [].slice.call(fs.childNodes).forEach(function(n){if(n!==lg)b.appendChild(n)});fs.appendChild(b);
 var dz=lg.querySelector('b');var dt=dz?dz.outerHTML:'';var zh=t.zh||'時間公布後更新',en=t.en||'Time to be announced';
 lg.innerHTML='<button type="button" class="rdh" aria-expanded="false"><span class="rdm">'+dt+'<span class="rdt" data-zh="'+zh+'" data-en="'+en+'">'+(L()?en:zh)+'</span></span><span class="rds"></span><i></i></button>';
 lg.querySelector('.rdh').addEventListener('click',function(){var o=b.hidden;b.hidden=!o;fs.classList.toggle('op',o);this.setAttribute('aria-expanded',o?'true':'false')});
 fs.addEventListener('change',function(){st(fs)});st(fs)}
function run(){[].forEach.call(document.querySelectorAll('fieldset.rd'),cx)}
new MutationObserver(run).observe(document.documentElement,{childList:true,subtree:true});document.addEventListener('DOMContentLoaded',run);
setInterval(function(){[].forEach.call(document.querySelectorAll('fieldset.rd.cx'),st)},1500)})();
</script>
