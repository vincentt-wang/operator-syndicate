<style>
:root{--or:#FF6600;--or2:#E55A00;--orp:#FFF4EA;--navy:#0A1628;--tx:#0B1623;--tx2:#334155;--tx3:#64748B;--bg:#F6F7F9;--line:rgba(11,22,35,.1);--fd:'Playfair Display','Noto Serif TC',serif;--fb:'DM Sans','Noto Sans TC',sans-serif;--gap:14px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fb);background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased;line-height:1.6;font-size:16px;overflow-x:hidden}
a{color:inherit}.wrap{max-width:680px;margin:0 auto;padding:0 16px 44px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0}
.logo{display:flex;align-items:center;gap:9px;text-decoration:none;font-family:var(--fd);font-weight:800;min-height:44px}
.lm{width:32px;height:32px;border-radius:8px;background:var(--or);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.9rem}
#lang{font:700 .9rem var(--fb);border:1.5px solid var(--or);background:#fff;color:var(--or2);border-radius:22px;padding:6px 16px;cursor:pointer;min-height:44px;min-width:44px;transition:transform .12s}
#lang:active{transform:scale(.95)}
.hero{padding:6px 2px 4px}
.kick{color:var(--or2);font-weight:700;font-size:.875rem;letter-spacing:.12em}
.hero h1{font-family:var(--fd);font-size:1.9rem;line-height:1.2;margin-top:4px;color:var(--navy)}
.hero p{color:var(--tx2);font-size:1rem;margin-top:4px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-top:var(--gap);animation:fi .5s cubic-bezier(.2,.7,.2,1) both}
#body>.card:nth-child(1){animation-delay:.02s}#body>.card:nth-child(2){animation-delay:.1s}#body>.card:nth-child(3){animation-delay:.18s}#body>.card:nth-child(4){animation-delay:.26s}#body>.card:nth-child(5){animation-delay:.34s}
.card h2{font-family:var(--fd);font-size:1.25rem;margin-bottom:10px;color:var(--navy)}
.card p{color:var(--tx2);font-size:1rem}
.locked{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:var(--gap);color:var(--tx2);font-size:1rem}
@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
.nx{background:var(--navy);color:#fff;border-color:var(--navy);padding:22px 20px}
.nx .k{font-size:.875rem;font-weight:700;color:#FFB27A;letter-spacing:.08em}
.nxh{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-top:6px}
.nx h2{font-size:2rem;line-height:1.2;color:#fff;margin:0}
.cd{color:var(--or);font-weight:800;font-size:1.25rem;font-family:var(--fd)}
.nx .nn{color:#D5DCE6;margin-top:10px}.nx .nn,.nx p{color:#D5DCE6}
.st{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 2px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;font-weight:700;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.12);color:#fff}
.pill.on{background:#DFF3E6;color:#14532D}.pill.off{background:rgba(255,255,255,.16);color:#D5DCE6}
.ml{list-style:none;margin:10px 0 0;border-top:1px solid rgba(255,255,255,.16)}
.ml li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:.95rem;color:#fff}
.ml li span:last-child{color:#FFB27A;font-weight:700;text-align:right}
.nx .gos{margin-top:6px}
.tag{display:inline-block;font-size:.875rem;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap;align-self:flex-start}.tag.y{background:#FDF3D7;color:#92600A}.tag.g{background:#E3F4EA;color:#166534}
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.mt{flex:0 0 auto;min-width:104px;min-height:48px;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;text-align:center;cursor:pointer;font:700 1rem var(--fb);color:var(--navy);transition:border-color .2s,background .2s,transform .12s}
.mt.past{background:var(--bg);color:var(--tx3);font-weight:500}.mt.past[aria-selected="true"]{color:var(--or2);font-weight:700}
.rc{display:block;margin-top:12px;color:#FFB27A;font-weight:700;min-height:44px;line-height:44px;text-decoration:none}
.mt:active{transform:scale(.97)}
.mt[aria-selected="true"]{border-color:var(--or);background:var(--orp);color:var(--or2)}
.btn.dis{position:relative;background:#F1F2F4!important;color:#94A3B8!important;border-color:#E2E8F0!important;cursor:not-allowed}.btn.dis .soon{position:absolute;top:-9px;right:10px;font-style:normal;font-size:.7rem;font-weight:800;background:#FDF3D7;color:#92600A;border-radius:99px;padding:1px 8px}
.calb{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}.calb .cl{font-size:.85rem;font-weight:700;color:var(--tx3);flex:1 0 100%}.calb .btn{flex:1 1 140px;margin:0}
.gos{display:flex;gap:8px;flex-wrap:wrap}.pan .gos .btn,#donep .btn{flex:1 1 140px;margin-top:12px}
.btn.g{background:#fff;color:var(--navy);border-color:#fff}
.pv{position:fixed;inset:0;z-index:50;background:rgba(10,22,40,.55);display:flex;align-items:flex-end;justify-content:center;animation:pvf .2s ease-out}
.pv[hidden]{display:none}
.pvb{background:#fff;width:100%;max-width:600px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px;animation:pvu .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:720px){.pv{align-items:center}.pvb{border-radius:18px}}
.pvh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.pvh .pn{font-size:.8rem;font-weight:700;color:var(--or2);letter-spacing:.06em}.pvh h3{font-size:1.25rem;color:var(--navy)}
.pvx{min-width:44px;min-height:44px;border:0;background:var(--bg);border-radius:50%;font-size:1.5rem;line-height:1;cursor:pointer;color:var(--tx2)}
.pvl{background:var(--orp);border-radius:12px;padding:10px 12px;margin:10px 0 4px;color:var(--tx)!important}
.pvb section{border-top:1px solid var(--line);padding:12px 0 0;margin-top:12px}.pvb h4{font-size:.92rem;color:var(--navy);margin-bottom:4px}
.pw{color:var(--tx3)!important}.pa{list-style:none}.pa li{padding:4px 0;font-size:.93rem;color:var(--tx2)}
body.pvon{overflow:hidden}
@keyframes pvf{from{opacity:0}to{opacity:1}}@keyframes pvu{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pv,.pvb{animation:none}}
.pan{border-top:1px solid var(--line);padding-top:14px;animation:slide .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
.ph{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.pn{font-size:.875rem;font-weight:700;color:var(--or2)}.ph h3{font-size:1.2rem;color:var(--navy)}
.wait{background:var(--orp);border-radius:12px;padding:14px}.wait p{margin:0}.wait .by{font-size:.9rem;color:var(--tx3);margin-top:6px}
.mine{margin:12px 0 0;font-weight:700;color:var(--tx)!important;font-size:.95rem!important}
.tm{list-style:none;margin:6px 0 0}.tm li{padding:9px 0;border-top:1px solid var(--line)}.tm li:first-child{border-top:0}
.tm b{display:block;font-size:1rem}.tm em{display:block;font-style:normal;font-size:.95rem;color:var(--tx2)}
.lk{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.lk .btn{flex:1 1 140px;margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:14px;font:700 1rem var(--fb);border-radius:999px;padding:12px;border:1.5px solid var(--or);background:var(--or);color:#fff;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.sm{font-size:.95rem;min-height:46px;padding:10px 16px}.btn.o{background:#fff;color:var(--or2)}.btn[disabled]{opacity:.6;cursor:wait}
.rd{border:0;border-top:1px solid var(--line);padding:14px 0}.rd legend{float:left;width:100%}.rd .seg{clear:both}
.rd legend{display:block;padding:0;font-size:1.05rem;color:var(--navy)}
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.seg label{flex:1 1 0;min-width:96px;position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label>span{display:flex;align-items:center;justify-content:center;min-height:46px;padding:6px 10px;border:1.5px solid rgba(11,22,35,.18);border-radius:12px;font-size:.95rem;font-weight:700;color:var(--tx2);text-align:center;transition:background .15s,border-color .15s,transform .12s}
.seg label:active>span{transform:scale(.95)}
.seg input:checked+span{border-color:var(--or);background:var(--orp);color:var(--or2)}
.seg input:focus-visible+span{outline:2px solid var(--navy);outline-offset:2px}
.lunch{animation:fi .25s ease-out both}
.lunch .lb{font-weight:700;color:var(--tx)!important;margin-top:12px;font-size:.9rem!important}
.mon{border-top:1px solid var(--line);padding-top:4px;margin-top:4px}
.mon summary{display:flex;align-items:center;gap:10px;min-height:48px;cursor:pointer;font-weight:700;list-style:none}.mon summary::-webkit-details-marker{display:none}
.mon summary::before{content:"+";color:var(--or2);font-weight:800;width:16px;text-align:center}.mon[open] summary::before{content:"\2212"}
.pm{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:6px}
.day h4{font-size:1rem;color:var(--navy);margin-top:12px}
.ck{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;min-height:48px}
.ck input{width:22px;height:22px;margin-top:2px;flex:none;accent-color:var(--or)}
.ckb{min-width:0;font-size:1rem}.ckb i{font-style:normal;color:var(--or2);font-weight:700;margin-right:8px}.ckb em{display:block;font-style:normal;color:var(--tx2);font-size:.95rem}
.nt{font-size:.95rem!important;color:var(--tx3)!important;margin-top:6px}
.who{border-top:1px solid var(--line);margin-top:8px;padding-top:4px}
.fd{display:block;font-weight:700;font-size:.95rem;margin-top:12px}
.fd input,.fd textarea{display:block;width:100%;min-height:46px;margin-top:4px;font:400 16px var(--fb);padding:10px 12px;border:1px solid rgba(11,22,35,.25);border-radius:10px;background:#fff;color:var(--tx);resize:vertical}
.fd input:focus,.fd textarea:focus{outline:2px solid var(--or);outline-offset:1px;border-color:var(--or)}
.hp{position:absolute;left:-9999px;height:1px;overflow:hidden}
#err{color:#B42318;font-weight:700;font-size:.95rem;margin-top:12px}
.done{display:flex;gap:14px;align-items:flex-start;margin-top:16px;padding:16px;border-radius:14px;background:#EAF7EF;border:1px solid #BFE3CC;animation:pop .4s cubic-bezier(.2,.7,.2,1) both}
.done[hidden]{display:none}
.done h3{font-size:1.05rem;color:#14532D}.done ul{list-style:none;margin-top:6px}.done li{font-size:.95rem;color:#14532D;padding:2px 0}
.ck-svg{width:44px;height:44px;flex:none}.ck-svg circle{stroke-dasharray:151;stroke-dashoffset:151;animation:draw .5s ease-out .05s forwards}.ck-svg path{stroke-dasharray:44;stroke-dashoffset:44;animation:draw .35s ease-out .45s forwards}
.row{display:flex;align-items:center;gap:10px;min-height:56px;padding:10px 0;border-top:1px solid var(--line);text-decoration:none}.row:first-of-type{border-top:0}
.row span{flex:1;min-width:0}.row b{display:block}.row em{display:block;font-style:normal;font-size:.95rem;color:var(--tx2)}.row i{font-style:normal;font-size:1.4rem;color:var(--or2)}
footer{text-align:center;color:var(--tx3);font-size:.875rem;margin-top:26px}
@media(min-width:720px){.wrap{padding:0 24px 56px}.hero h1{font-size:2.3rem}.nx h2{font-size:2.4rem}.card{padding:24px 26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.ck-svg circle,.ck-svg path{stroke-dashoffset:0!important}}
</style>

.then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))}).then(function(x){
 ls(KC,code);start(JSON.parse(new TextDecoder().decode(x)))})
.catch(function(){if(!hash)ls(KC,null)});

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(zh,en,tag,attr){tag=tag||'span';return '<'+tag+(attr?' '+attr:'')+' data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+esc(L==='en'?en:zh)+'</'+tag+'>'}

var LUN={'葷食':['葷食','regular lunch'],'素食':['素食','vegetarian lunch'],'不用':['不用便當','no lunch']};

function start(d){
 box.innerHTML=d.html;
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 var R=d.rounds.filter(function(r){return r.date>=today});
 document.querySelectorAll('.rd,.day,.mt[data-date],.pan[data-date]').forEach(function(e){if(e.getAttribute('data-date')<today)e.remove()});
 var f=document.getElementById('f'),err=document.getElementById('err'),done=document.getElementById('done'),go=document.getElementById('go');
 var me=null;try{me=JSON.parse(ls(KM)||'null')}catch(e){}
 var rec=null;

 var tabs=[].slice.call(document.querySelectorAll('.mt'));
 function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-tab')===id?'true':'false')});
  [].forEach.call(document.querySelectorAll('.pan'),function(p){p.hidden=p.getAttribute('data-pan')!==id})}
 tabs.forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-tab'))})});
 if(tabs.length){var sid=R.length?R[0].id:tabs[tabs.length-1].getAttribute('data-tab');show(sid);
  var tb=document.querySelector('.tabs'),sel=tb.querySelector('[data-tab="'+sid+'"]');
  var scr=function(){tb.scrollLeft=Math.max(0,sel.offsetLeft-12)};scr();requestAnimationFrame(scr);window.addEventListener('load',scr)}
 else document.getElementById('months').innerHTML='<h2>'+T('每月場次','Upcoming sessions')+'</h2>'+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');

 function sync(){[].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');fs.querySelector('.lunch').hidden=!(m&&m.value==='現場')})}
 f.addEventListener('change',function(){sync();done.hidden=true});

 function modeTxt(x){var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch];return [m[0]+(lu?'，'+lu[0]:''),m[1]+(lu?', '+lu[1]:'')]}
 function mineText(r){var x=rec&&rec.dr&&rec.dr[r];if(!x)return T('尚未預約','Not booked yet');var m=modeTxt(x);return T('已預約：'+m[0],'Booked: '+m[1])}
 function days(r){var p=r.date.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((dt-t0)/864e5)}
 function booked(id){var y=rec&&rec.dr&&rec.dr[id];return !!(y&&y.mode!=='不克參加')}
 function paint(){
  [].forEach.call(document.querySelectorAll('[data-mine]'),function(p){p.innerHTML=mineText(p.getAttribute('data-mine'))});
  [].forEach.call(document.querySelectorAll('[data-pvbtn]'),function(b){b.hidden=false});
  var nx=document.getElementById('next');
  if(!R.length){nx.innerHTML=T('下一場','Next session','p','class="k"')+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');apply(L);return}
  var r=R[0],x=rec&&rec.dr&&rec.dr[r.id],dd=days(r);
  var cd=dd<=0?T('今天','Today'):T('還有 '+dd+' 天',dd+(dd===1?' day to go':' days to go'));
  var rows='';
  if(rec){R.forEach(function(z){var y=rec.dr&&rec.dr[z.id];if(y){var m=modeTxt(y);rows+='<li>'+T(z.zh,z.en)+T(m[0],m[1])+'</li>'}});
   Object.keys(d.ms).forEach(function(k){if((rec.ms||[]).indexOf(k)>=0&&d.ms[k].date>=today)rows+='<li>'+T('週一旁聽 '+d.ms[k].zh,'Monday sit-in '+d.ms[k].en)+'<span></span></li>'})}
  nx.innerHTML=T('下一場','Next session','p','class="k"')+'<div class="nxh">'+T(r.zh,r.en,'h2')+T('', '', 'span', 'class="cd"').replace('></span>','>'+(dd<=0?'':'')+'</span>')+'</div>'
   +T(r.note_zh,r.note_en,'p','class="nn"')
   +'<div class="st"><span class="pill '+(x?(x.mode==='不克參加'?'off':'on'):'')+'">'+mineText(r.id)+'</span></div>'
   +(rows?'<ul class="ml">'+rows+'</ul>':'')
   +'<div class="gos"><button type="button" class="btn sm" data-goto="'+r.id+'">'+(x?T('更改預約','Change my booking'):T('預約這一場','Book this one'))+'</button>'+(r.ready?'<button type="button" class="btn sm g" data-pv-open="'+r.id+'">'+T('會前資料','Before the session')+'</button>':'<button type="button" class="btn sm g dis" disabled aria-disabled="true">'+T('會前資料','Before the session')+T('近期公布','Soon','i','class="soon"')+'</button>')+'</div>'
   +(d.last?'<a class="rc" href="'+esc(d.last.u)+'">'+T(d.last.zh,d.last.en)+'</a>':'');
  var c=nx.querySelector('.cd');c.setAttribute('data-zh',dd<=0?'今天':'還有 '+dd+' 天');c.setAttribute('data-en',dd<=0?'Today':dd+(dd===1?' day to go':' days to go'));c.textContent=c.getAttribute('data-'+L);
  go.innerHTML=rec?T('更新預約','Update booking'):T('送出預約','Book');
  apply(L)}
 onLang=function(){if(!done.hidden&&lastDone)showDone(lastDone.old,lastDone.items)};
 var pvLast=null;
 function pvOpen(id){var rr=d.rounds.filter(function(z){return z.id===id})[0];if(rr){location.href='/members/'+rr.pg+'/#'+code;return}var p=document.querySelector('.pv[data-pv="'+id+'"]');if(!p)return;pvLast=document.activeElement;p.hidden=false;document.body.classList.add('pvon');var x=p.querySelector('.pvx');if(x)x.focus({preventScroll:true})}
 function pvClose(){[].forEach.call(document.querySelectorAll('.pv'),function(p){p.hidden=true});document.body.classList.remove('pvon');if(pvLast&&pvLast.focus)pvLast.focus({preventScroll:true})}
 document.addEventListener('keydown',function(ev){if(ev.key==='Escape')pvClose()});
 document.addEventListener('click',function(ev){
  var po=ev.target.closest('[data-pv-open]');if(po){pvOpen(po.getAttribute('data-pv-open'));return}
  var pc=ev.target.closest('[data-pv-close]');if(pc||ev.target.classList.contains('pv')){pvClose();if(!(pc&&pc.hasAttribute('data-goto')))return}
  var g=ev.target.closest('[data-goto]');if(g){var fs=f.querySelector('.rd[data-r="'+g.getAttribute('data-goto')+'"]');(fs||f).scrollIntoView({behavior:'smooth',block:'start'});var i=fs&&fs.querySelector('input');if(i)setTimeout(function(){i.focus({preventScroll:true})},400)}});

 function fill(r){
  f.elements.name.value=r.name||'';f.elements.email.value=r.email||'';f.elements.company_title.value=r.company_title||'';f.elements.note.value=r.note||'';
  Object.keys(r.dr||{}).forEach(function(k){var a=f.querySelector('input[name="m_'+k+'"][value="'+r.dr[k].mode+'"]');if(a)a.checked=true;var l=f.querySelector('input[name="l_'+k+'"][value="'+r.dr[k].lunch+'"]');if(l)l.checked=true});
  [].forEach.call(f.querySelectorAll('input[name="ms"]'),function(c){c.checked=(r.ms||[]).indexOf(c.value)>=0});
  if((r.ms||[]).some(function(v){return f.querySelector('input[name="ms"][value="'+v+'"]')}))f.querySelector('.mon').open=true;
  sync()}
 if(me){f.elements.name.value=me.name||'';f.elements.email.value=me.email||'';f.elements.company_title.value=me.company_title||''}
 paint();
 var bk=new URLSearchParams(location.search).get('book');if(bk){var bf=f.querySelector('.rd[data-r="'+bk+'"]');if(bf)setTimeout(function(){bf.scrollIntoView({behavior:'smooth',block:'start'})},300)}
 if(me&&me.email&&me.t){fetch(WK+'/rsvp?e='+encodeURIComponent(me.email)+'&t='+encodeURIComponent(me.t)).then(function(r){return r.json()}).then(function(j){if(j&&j.rec){rec=j.rec;fill(rec);paint()}}).catch(function(){})}

 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=null;
 function showDone(old,items){
  lastDone={old:old,items:items};
  document.getElementById('donet').innerHTML=old?T('預約已更新','Booking updated'):T('預約已送出','Booking received');
  document.getElementById('donel').innerHTML=items.map(function(i){return '<li>'+T(i[0],i[1])+'</li>'}).join('');
  var nb=R.filter(function(z){return booked(z.id)&&z.ready});
  document.getElementById('donep').innerHTML=nb.map(function(z){return '<button type="button" class="btn sm o" data-pv-open="'+z.id+'">'+T('會前資料 '+z.zh.replace(/（.*/,''),'Before the session · '+z.en)+'</button>'}).join('');
  var was=done.hidden;done.hidden=false;
  if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}
  done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  var dr={},sum=[],items=[],old=rec;
  [].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');if(!m)return;
   var l=f.querySelector('input[name="l_'+r+'"]:checked'),lu=m.value==='現場'&&l?l.value:'';dr[r]={mode:m.value,lunch:lu};
   var rr=d.rounds.filter(function(z){return z.id===r})[0],tx=modeTxt(dr[r]);sum.push(rr.zh+'：'+m.value+(lu?'，'+lu:''));items.push([rr.zh+'　'+tx[0],rr.en+'  '+tx[1]])});
  if(old&&old.dr)Object.keys(old.dr).forEach(function(k){if(!dr[k]&&!f.querySelector('.rd[data-r="'+k+'"]'))dr[k]=old.dr[k]});
  var ms=[].slice.call(f.querySelectorAll('input[name="ms"]:checked')).map(function(c){return c.value});
  ms.forEach(function(v){if(d.ms[v])items.push(['週一旁聽　'+d.ms[v].zh,'Monday sit-in  '+d.ms[v].en])});
  var a={name:f.elements.name.value.trim(),email:f.elements.email.value.trim(),company_title:f.elements.company_title.value.trim(),dr:dr,ms:ms,note:f.elements.note.value.trim().slice(0,300),lang:L,t:(me&&me.email&&me.email.toLowerCase()===f.elements.email.value.trim().toLowerCase())?me.t:'',_honey:f.elements._honey.value};
  if(!a.name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email))return fail('請填姓名與 email。','Please add your name and email.');
  if(!Object.keys(dr).length&&!ms.length&&!old)return fail('請至少選一場。','Please choose at least one session.');
  go.disabled=true;
  var subj=(old?'LP 預約更新 ':'LP 預約 ')+a.name;
  var note={name:a.name,email:a.email,company_title:a.company_title,deal_room:sum.join('\n'),monday_sessions:ms.map(function(v){return d.ms[v]?d.ms[v].zh:v}).join('\n'),note:a.note,lang:L};
  var ar=L==='en'?'We received your Deal Room booking:\n'+items.map(function(i){return i[1]}).join('\n')+'.\nTo change how you join, go back to the members page and send it again: '+HOME
   :'收到你的 Deal Room 預約：\n'+items.map(function(i){return i[0]}).join('\n')+'。之後要改出席方式，回到成員專區再送一次：'+HOME;
  function mail(){return Promise.all(RECIP.map(function(to){var fd=new FormData();fd.append('_subject',subj);fd.append('_template','table');fd.append('_captcha','false');Object.keys(note).forEach(function(k){fd.append(k,note[k])});
   if(to.indexOf('vincent@')===0)fd.append('_autoresponse',ar);
   return fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).then(function(r){return r.json().then(function(j){return r.ok&&(j.success===true||j.success==='true')},function(){return false})},function(){return false})})).then(function(rs){return rs.indexOf(true)>=0})}
  var mailed=mail();
  fetch(WK+'/rsvp',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(a)}).then(function(r){return r.json()}).then(function(j){return j&&j.ok?j:null},function(){return null}).then(function(j){
   if(j){me={name:a.name,email:a.email,company_title:a.company_title,t:j.t};ls(KM,JSON.stringify(me));
    rec={name:a.name,email:a.email,company_title:a.company_title,dr:dr,ms:ms,note:a.note};paint();go.disabled=false;
    showDone(old,items);return}
   mailed.then(function(ok){go.disabled=false;
    if(ok){showDone(old,items)}
    else fail('送出失敗，請稍後再試，或來信 vincent@evoscalecapital.com。','Could not send. Please try again shortly, or email vincent@evoscalecapital.com.')})
  });
 });
