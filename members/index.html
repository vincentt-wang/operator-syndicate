function initGis(){

function guestLink(big){if(o.guestFn)return '<p class="gn"><a href="#" id="glk">'+T(o.guestTxt[0],o.guestTxt[1])+'</a></p>';if(!o.guest)return '';return big?'<button type="button" class="btn o" id="glk">'+T('不登入，直接填表預約','Book without signing in')+'</button>':'<p class="gn"><a href="#" id="glk">'+T('不用 Google 登入，直接填表預約','Book without signing in')+'</a></p>'}
function bindGuest(){var a=document.getElementById('glk');if(a)a.addEventListener('click',function(e){e.preventDefault();if(o.guestFn){gate.innerHTML='';o.guestFn(false)}else guest()})}
function gsv(){try{return JSON.parse(ls(GK)||'null')}catch(e){return null}}
function guest(lead,foot){
 var sv=gsv();
 card(T(sv?'你的預約':'Deal Room 預約',sv?'Your booking':'Deal Room booking','h2')+(lead||T('填完送出就預約好了，這支手機會記得，之後再打開這頁就能改。','Submit and you are booked. This phone remembers it, so you can change it here later.','p'))+GUEST+(foot||''));
 var f=document.getElementById('gform'),er=document.getElementById('gferr');bk(INAPP?'inapp_form':'guest_form');
 var fill=function(r){if(!r)return;f.elements.name.value=r.name||'';f.elements.ct.value=r.company_title||'';f.elements.email.value=r.email||'';f.elements.email.readOnly=true;
  Object.keys(r.dr||{}).forEach(function(id){var d=r.dr[id],m=f.querySelector('input[name="gm_'+id+'"][value="'+d.mode+'"]');if(m){m.checked=true;var fs=m.closest('fieldset');fs.querySelector('.lunch').hidden=d.mode!=='現場';var l=d.lunch&&f.querySelector('input[name="gl_'+id+'"][value="'+d.lunch+'"]');if(l)l.checked=true}});
  var sb=f.querySelector('button[type=submit]');sb.innerHTML=T('更新預約','Update booking')};
 if(sv&&sv.e&&sv.t)fetch(WK+'/rsvp?e='+encodeURIComponent(sv.e)+'&t='+encodeURIComponent(sv.t)).then(function(r){return r.json()}).then(function(j){if(j&&j.rec)fill(j.rec)}).catch(function(){});
 f.addEventListener('change',function(e){var fs=e.target.closest('fieldset[data-g]');if(!fs||e.target.name.indexOf('gm_')!==0)return;fs.querySelector('.lunch').hidden=e.target.value!=='現場'});
 f.addEventListener('submit',function(e){e.preventDefault();er.hidden=true;
  var v=function(n){var x=f.elements[n];return x?String(x.value||'').trim():''},dr={},n=0;
  f.querySelectorAll('fieldset[data-g]').forEach(function(fs){var id=fs.getAttribute('data-g'),m=f.querySelector('input[name="gm_'+id+'"]:checked');if(!m)return;var l=f.querySelector('input[name="gl_'+id+'"]:checked');dr[id]={mode:m.value,lunch:m.value==='現場'&&l?l.value:''};n++});
  var bad=function(zh,en){er.innerHTML=T(zh,en);er.hidden=false};
  if(!v('name'))return bad('請填姓名。','Please enter your name.');
  if(!v('ct'))return bad('請填公司與職稱。','Please enter your company and title.');   /* 11/15 Vincent：姓名與公司職稱必填，不然看不出是誰 */
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')))return bad('Email 格式看起來不對。','That email does not look right.');
  if(!n)return bad('至少選一場要現場、線上或不克參加。','Choose at least one session.');
  var b=f.querySelector('button[type=submit]');b.disabled=true;
  fetch(WK+'/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),email:v('email'),company_title:v('ct'),dr:dr,ms:[],note:INAPP?'LINE 內填表':'不登入預約',lang:o.lang(),_honey:v('_honey'),t:(sv&&sv.e===v('email').toLowerCase()?sv.t:undefined)})})
  .then(function(r){return r.json().then(function(j){return [r.status,j]})}).then(function(x){
   if(x[1]&&x[1].ok){if(x[1].t)ls(GK,JSON.stringify({e:v('email').toLowerCase(),t:x[1].t}));bk('guest_ok');var li=[];f.querySelectorAll('fieldset[data-g]').forEach(function(fs){var d=dr[fs.getAttribute('data-g')];if(d)li.push('<li>'+fs.querySelector('legend').innerHTML+' · '+esc(d.mode)+(d.lunch?' · '+esc(d.lunch):'')+'</li>')});
    card(T('預約好了','You are booked','h2')+'<ul class="gl" style="text-align:left;margin:12px auto 0;max-width:320px">'+li.join('')+'</ul>'+T('要改預約，用這支手機再打開這一頁就能改。','To change it, open this page again on this phone.','p','class="gn"'));return}
   b.disabled=false;if(x[0]===409){bk('guest_409');return bad('這個 Email 已經有預約了。要改請用當初預約的那支手機再打開這頁，或在群組說一聲。','This email already has a booking. Open this page on the phone you booked with, or tell us in the group.')}bk('guest_fail');
   bad('送出沒有成功，請稍後再試。','Submission failed. Please try again.')})
  .catch(function(){b.disabled=false;bad('連線有問題，請稍後再試。','Connection problem. Please try again.')})})}
function showLogin(){
 var head=T('一春成員專區','EvoScale Members','h2')+T('用 Google 帳號登入後，就能看每月場次與預約','Sign in with Google to see the monthly sessions and book a seat','p');
 if(!CID){card(head+T('登入功能設定中，稍後開放','Sign-in is being set up and will open soon','p','class="gn"'));return}
 if(INAPP){var ext=location.pathname+'?openExternalBrowser=1',clean=location.origin+location.pathname;bk('inapp_view');
  /* 11/05 Vincent：Google 登入放上面，註明複製網址用 Google Chrome 打開；不登入的表單放下面 */
  var crm=AND?'intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end':'googlechromes://'+location.host+location.pathname;
  var gtop='<div class="gtop">'+T('用 Google 登入','Sign in with Google','h3')
   +T('LINE 裡不能用 Google 登入。請複製網址，用 Google Chrome 打開，登入後就能預約與看每月場次。','Google sign-in does not work inside LINE. Copy the link and open it in Google Chrome to sign in, book and see the monthly sessions.','p','class="gn"')
   +'<div class="gact"><button type="button" class="btn" id="iabcp">'+T('複製網址','Copy link')+'</button><a class="btn o" href="'+crm+'" id="gcrm">'+T('用 Chrome 打開','Open in Chrome')+'</a></div>'
   +'<p class="gn gurl">'+esc(clean)+'</p></div>'
   +T('或不登入，直接在這裡填表預約','Or book here without signing in','p','class="gor"');
  if(o.guest){guest(gtop)}
  else if(o.guestFn){gate.innerHTML='';o.guestFn(true)}   /* 11/10 評估表：LINE 裡直接給不登入的表單 */
  else{card(T('一春成員專區','EvoScale Members','h2')+T('這一頁要用 Google 登入。App 內建的瀏覽器不支援 Google 登入，請改用瀏覽器開啟。','This page needs Google sign-in, which in-app browsers do not support. Please open it in your browser.','p')
   +(ISLINE?'<a class="btn" href="'+ext+'" id="gext2">'+T('用瀏覽器開啟','Open in browser')+'</a>':'<button type="button" class="btn" id="iabcp">'+T('複製連結','Copy link')+'</button>'))}
  var ge=document.getElementById('gext');if(ge)ge.addEventListener('click',function(e){bk('inapp_google');if(!ISLINE){e.preventDefault();var done=function(){ge.innerHTML=T('已複製，貼到 Safari 或 Chrome 開啟','Copied. Paste it into Safari or Chrome')};if(navigator.clipboard)navigator.clipboard.writeText(clean).then(done,function(){prompt('',clean)});else prompt('',clean)}});
  var gc=document.getElementById('gcrm');if(gc)gc.addEventListener('click',function(){bk('inapp_chrome')});
  var cb=document.getElementById('iabcp');if(cb)cb.addEventListener('click',function(){bk('inapp_copy');var done=function(){cb.innerHTML=T('已複製，貼到 Chrome 打開','Copied. Paste it into Chrome')};if(navigator.clipboard)navigator.clipboard.writeText(clean).then(done,function(){prompt('',clean)});else prompt('',clean)});
  return}
 card(head+'<div id="gbtn" class="gbtn"></div><p id="gerr" class="gerr" role="alert" hidden></p>'+T('只用來確認身分與記錄預約。','Used only to confirm your identity and record your booking.','p','class="gn"')+guestLink());
 bindGuest();loadGis()}
function onCred(resp){
 if(!resp||!resp.credential)return;var e=document.getElementById('gerr');if(e)e.hidden=true;
 fetch(WK+'/auth/google',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({credential:resp.credential})})
 .then(function(r){return r.json().then(function(j){return {st:r.status,j:j}},function(){return {st:r.status,j:null}})})
 .then(function(x){
  if(x.st===403)return blocked();
  if(x.st===503)return showLogin();
  if(x.j&&x.j.ok&&x.j.s){ls(KS,x.j.s);enter(x.j)}else gerr('登入沒有成功，請再試一次。','Sign-in did not work. Please try again.')})
 .catch(function(){gerr('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.')})}
function enter(j){
 user=j.user||{};gate.innerHTML='';
 var h='';if(user.picture&&/^https:\/\//.test(user.picture))h+='<img class="av" alt="" referrerpolicy="no-referrer" src="'+esc(user.picture)+'">';
 acct.innerHTML=h+'<span class="em"></span><button type="button" id="out" class="lo" data-zh="登出" data-en="Sign out">'+(o.lang()==='en'?'Sign out':'登出')+'</button>';
 acct.querySelector('.em').textContent=user.email||'';acct.hidden=false;
 document.getElementById('out').addEventListener('click',function(){
  ls(KS,null);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()});
 var el=document.getElementById('sealed');
 if(!j.code||!el||!window.crypto||!crypto.subtle)return gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.');
 var b=Uint8Array.from(atob(el.textContent.trim()),function(c){return c.charCodeAt(0)});
 crypto.subtle.importKey('raw',new TextEncoder().encode(j.code),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
 .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))})
 .then(function(x){o.start(JSON.parse(new TextDecoder().decode(x)),{user:user,rec:j.rec||null,known:j.known||null})},function(){gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.')})}
function boot(){
 var s=ls(KS);if(!s)return showLogin();
 fetch(WK+'/me',{headers:{'X-Session':s}}).then(function(r){
  if(r.status===401){ls(KS,null);return showLogin()}
  if(r.status===403)return blocked();
  return r.json().then(function(j){if(j&&j.ok)enter(j);else showLogin()})})
 .catch(function(){card(T('一春成員專區','EvoScale Members','h2')+T('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.','p'))})}
return {boot:boot,sess:function(){return ls(KS)},user:function(){return user},relang:renderBtn,
 expired:function(){ls(KS,null);location.reload()},blocked:blocked}
};
</script>
<script>
(function(){
var WK='https://evoscale-forms.comicbnb.workers.dev';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var box=document.getElementById('body');
function lang(){return ls('dr_lang')||'zh'}
var q=new URLSearchParams(location.search).get('lang'),L=(q==='en'||q==='zh')?q:lang();
function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});
 document.querySelectorAll('[data-phzh]').forEach(function(e){e.placeholder=e.getAttribute(l==='en'?'data-phen':'data-phzh')});
 document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
var onLang=null,A=ESA({guest:true,lang:function(){return L},apply:function(){apply(L)},start:start,clear:function(){box.innerHTML=''}});
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);A.relang();if(onLang)onLang()});
A.boot();

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(zh,en,tag,attr){tag=tag||'span';return '<'+tag+(attr?' '+attr:'')+' data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+esc(L==='en'?en:zh)+'</'+tag+'>'}
var MODE={'現場':['現場','On site'],'線上':['線上','Online'],'不克參加':['不克參加',"Can't make it"]};
var LUN={'葷食':['葷食','regular lunch'],'素食':['素食','vegetarian lunch'],'不用':['不用便當','no lunch']};

function start(d,auth){
 box.innerHTML=d.html;
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate());
 var R=d.rounds.filter(function(r){return r.date>=today});
 document.querySelectorAll('.rd,.day,.mt[data-date],.pan[data-date]').forEach(function(e){if(e.getAttribute('data-date')<today){if(e.hasAttribute('data-eval')){[].forEach.call(e.querySelectorAll('.bk,.mine,.calb,.wait'),function(x){x.remove()})}else e.remove()}});
 [].forEach.call(document.querySelectorAll('[data-evalfrom]'),function(a){a.hidden=a.getAttribute('data-evalfrom')>today});
 var f=document.getElementById('f'),err=document.getElementById('err'),done=document.getElementById('done'),go=document.getElementById('go');
 var rec=auth.rec,email=(auth.user&&auth.user.email)||'';
 document.getElementById('roacct').innerHTML=T('預約帳號：'+email,'Booking account: '+email);

 var tabs=[].slice.call(document.querySelectorAll('.mt'));
 function show(id){tabs.forEach(function(t){t.setAttribute('aria-selected',t.getAttribute('data-tab')===id?'true':'false')});
  [].forEach.call(document.querySelectorAll('.pan'),function(p){p.hidden=p.getAttribute('data-pan')!==id})}
 tabs.forEach(function(t){t.addEventListener('click',function(){show(t.getAttribute('data-tab'))})});
 if(tabs.length){var sid=R.length?R[0].id:tabs[tabs.length-1].getAttribute('data-tab');show(sid);
  var tb=document.querySelector('.tabs'),sel=tb.querySelector('[data-tab="'+sid+'"]');
  var scr=function(){tb.scrollLeft=Math.max(0,sel.offsetLeft-12)};scr();requestAnimationFrame(scr);window.addEventListener('load',scr)}
 else document.getElementById('months').innerHTML='<h2>'+T('每月場次','Monthly sessions')+'</h2>'+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');

 function sync(){[].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');fs.querySelector('.lunch').hidden=!(m&&m.value==='現場')});
  [].forEach.call(f.querySelectorAll('.rtb'),function(b){var t=f.querySelector('input[name="t_'+b.getAttribute('data-rt')+'"]:checked');b.setAttribute('aria-pressed',t&&t.value==='參加'?'true':'false')})}
 f.addEventListener('change',function(){sync();done.hidden=true});
 f.addEventListener('click',function(e){var b=e.target.closest('.rtb');if(!b)return;var id=b.getAttribute('data-rt'),on=b.getAttribute('aria-pressed')!=='true',x=f.querySelector('input[name="t_'+id+'"][value="'+(on?'參加':'不參加')+'"]');if(x)x.checked=true;sync();done.hidden=true});

 function modeTxt(x){var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch],rt=x.rt==='參加';return [m[0]+(lu?'，'+lu[0]:'')+(rt?'，Roundtable':''),m[1]+(lu?', '+lu[1]:'')+(rt?', roundtable':'')]}
 function mineText(r){var x=rec&&rec.dr&&rec.dr[r];if(!x)return T('尚未預約','Not booked yet');var m=modeTxt(x);return T('已預約：'+m[0],'Booked: '+m[1])}
 function days(r){var p=r.date.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]);return Math.round((dt-t0)/864e5)}
 function booked(id){var y=rec&&rec.dr&&rec.dr[id];return !!(y&&y.mode!=='不克參加')}
 function paint(){
  [].forEach.call(document.querySelectorAll('[data-mine]'),function(p){p.innerHTML=mineText(p.getAttribute('data-mine'))});
  [].forEach.call(document.querySelectorAll('[data-pvbtn]'),function(b){b.hidden=false});
  var nx=document.getElementById('next');
  if(!R.length){nx.innerHTML=T('下一場','Next session','p','class="k"')+T('新的場次確定後更新在這裡。','New dates will be posted here.','p');apply(L);return}
  var r=R[0],x=rec&&rec.dr&&rec.dr[r.id],dd=days(r);
  var rows='';
  if(rec){R.forEach(function(z){var y=rec.dr&&rec.dr[z.id];if(y){var m=modeTxt(y);rows+='<li>'+T(z.zh,z.en)+T(m[0],m[1])+'</li>'}});
   Object.keys(d.ms).forEach(function(k){if((rec.ms||[]).indexOf(k)>=0&&d.ms[k].date>=today)rows+='<li>'+T('週一旁聽 '+d.ms[k].zh,'Monday sit-in '+d.ms[k].en)+'<span></span></li>'})}
  nx.innerHTML=T('下一場','Next session','p','class="k"')+'<div class="nxh">'+T(r.zh,r.en,'h2')+(r.time_zh?T(r.time_zh,r.time_en,'span','class="nxt"'):'')+'</div>'
   +T('', '', 'p', 'class="cd"')
   +T(r.note_zh,r.note_en,'p','class="nn"')
   +'<div class="st"><span class="pill '+(x?(x.mode==='不克參加'?'off':'on'):'')+'">'+mineText(r.id)+'</span></div>'
   +(rows?'<ul class="ml">'+rows+'</ul>':'')
   +'<div class="gos"><button type="button" class="btn sm" data-goto="'+r.id+'">'+(x?T('更改預約','Change my booking'):T('預約這一場','Book this one'))+'</button>'+(r.ready?'<button type="button" class="btn sm g" data-pv-open="'+r.id+'">'+T('會前資料','Before the session')+'</button>':'<button type="button" class="btn sm g dis" disabled aria-disabled="true">'+T('會前資料','Before the session')+T('近期公布','Soon','i','class="soon"')+'</button>')+'</div>'
   +(r.calh||'')
   +(d.last?'<a class="rc" href="'+esc(d.last.u)+'">'+T(d.last.zh,d.last.en)+'</a>':'');
  [].forEach.call(document.querySelectorAll('.pan[data-pan="'+r.id+'"] .calx'),function(e){e.hidden=true});
  var c=nx.querySelector('.cd');c.setAttribute('data-zh',dd<=0?'今天':'還有 '+dd+' 天');c.setAttribute('data-en',dd<=0?'Today':dd+(dd===1?' day to go':' days to go'));c.textContent=c.getAttribute('data-'+L);
  go.innerHTML=rec?T('更新預約','Update booking'):T('送出預約','Book');
  apply(L)}
 onLang=function(){if(!done.hidden&&lastDone)showDone(lastDone.old,lastDone.items)};
 var pvLast=null;
 function pvOpen(id){var rr=d.rounds.filter(function(z){return z.id===id})[0];if(rr){location.href='/members/'+rr.pg+'/';return}var p=document.querySelector('.pv[data-pv="'+id+'"]');if(!p)return;pvLast=document.activeElement;p.hidden=false;document.body.classList.add('pvon');var x=p.querySelector('.pvx');if(x)x.focus({preventScroll:true})}
 function pvClose(){[].forEach.call(document.querySelectorAll('.pv'),function(p){p.hidden=true});document.body.classList.remove('pvon');if(pvLast&&pvLast.focus)pvLast.focus({preventScroll:true})}
 document.addEventListener('keydown',function(ev){if(ev.key==='Escape')pvClose()});
 document.addEventListener('click',function(ev){
  var po=ev.target.closest('[data-pv-open]');if(po){pvOpen(po.getAttribute('data-pv-open'));return}
  var pc=ev.target.closest('[data-pv-close]');if(pc||ev.target.classList.contains('pv')){pvClose();if(!(pc&&pc.hasAttribute('data-goto')))return}
  var g=ev.target.closest('[data-goto]');if(g){var fs=f.querySelector('.rd[data-r="'+g.getAttribute('data-goto')+'"]');(fs||f).scrollIntoView({behavior:'smooth',block:'start'});var i=fs&&fs.querySelector('input');if(i)setTimeout(function(){i.focus({preventScroll:true})},400)}});

 function fill(r){
  if(r.name)f.elements.name.value=r.name;f.elements.company_title.value=r.company_title||'';f.elements.note.value=r.note||'';
  Object.keys(r.dr||{}).forEach(function(k){var a=f.querySelector('input[name="m_'+k+'"][value="'+r.dr[k].mode+'"]');if(a)a.checked=true;var l=f.querySelector('input[name="l_'+k+'"][value="'+r.dr[k].lunch+'"]');if(l)l.checked=true;var t=r.dr[k].rt&&f.querySelector('input[name="t_'+k+'"][value="'+r.dr[k].rt+'"]');if(t)t.checked=true});
  sync()}
 var kn=auth.known||{};f.elements.name.value=kn.name||(auth.user&&auth.user.name)||'';f.elements.company_title.value=kn.company_title||'';   // 11/02 Vincent：已知身分先幫他填好
 if(rec)fill(rec);

 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=null;
 function showDone(old,items){
  lastDone={old:old,items:items};
  document.getElementById('donet').innerHTML=old?T('預約已更新','Booking updated'):T('預約已送出','Booking received');
  document.getElementById('donel').innerHTML=items.map(function(i){return '<li>'+T(i[0],i[1])+'</li>'}).join('');
  var nb=R.filter(function(z){return booked(z.id)&&z.ready});
  document.getElementById('donep').innerHTML=nb.map(function(z){return '<button type="button" class="btn sm o" data-pv-open="'+z.id+'">'+T('會前資料 '+z.zh.replace(/（.*/,''),'Before the session · '+z.en)+'</button>'}).join('');
  var was=done.hidden;done.hidden=false;
  if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}
  done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function mail(a,sum){return; /* 11/03：改由後端 /rsvp2 寄完整名單給 Vincent 與 Boice */
  var note={name:a.name,email:email,company_title:a.company_title,deal_room:sum.join('\n'),note:a.note,lang:L};
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','LP 預約（新增或更新） '+a.name);fd.append('_template','table');fd.append('_captcha','false');Object.keys(note).forEach(function(k){fd.append(k,note[k])});
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  if(f.elements._honey.value)return;
  var dr={},sum=[],items=[],old=rec;
  [].forEach.call(f.querySelectorAll('.rd'),function(fs){var r=fs.getAttribute('data-r'),m=f.querySelector('input[name="m_'+r+'"]:checked');if(!m)return;
   var l=f.querySelector('input[name="l_'+r+'"]:checked'),lu=m.value==='現場'&&l?l.value:'',t=f.querySelector('input[name="t_'+r+'"]:checked'),rt=m.value==='現場'&&t?t.value:'';dr[r]={mode:m.value,lunch:lu,rt:rt};
   var rr=d.rounds.filter(function(z){return z.id===r})[0],tx=modeTxt(dr[r]);sum.push(rr.zh+'：'+m.value+(lu?'，'+lu:'')+(rt?'，會後圓桌'+rt:''));items.push([rr.zh+'　'+tx[0],rr.en+'  '+tx[1]])});
  if(old&&old.dr)Object.keys(old.dr).forEach(function(k){if(!dr[k]&&!f.querySelector('.rd[data-r="'+k+'"]'))dr[k]=old.dr[k]});
  var a={name:f.elements.name.value.trim(),company_title:f.elements.company_title.value.trim(),dr:dr,note:f.elements.note.value.trim().slice(0,300),lang:L};
  if(!a.name)return fail('還需要你的姓名。','We still need your name.');
  if(!a.company_title)return fail('還需要你的公司與職稱。','We still need your company and title.');
  if(!Object.keys(dr).length&&!old)return fail('還沒選場次。','No session selected yet.');
  go.disabled=true;
  fetch(WK+'/rsvp2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(a)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}
   if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   rec=j.rec||{company_title:a.company_title,dr:dr,note:a.note};paint();
   showDone(typeof j.created==='boolean'?!j.created:!!old,items);mail(a,sum)});
 });
}
