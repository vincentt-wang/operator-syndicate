function blocked(){ls(KS,null);acct.hidden=true;o.clear();card(T('一春成員專區','EvoScale Members','h2')+T('這個帳號目前無法進入成員專區，有問題請來信 vincent@evoscalecapital.com','This account cannot enter the members area right now. For questions, email vincent@evoscalecapital.com','p'))}
function renderBtn(){var b=document.getElementById('gbtn');if(!b||!window.google||!google.accounts)return;b.innerHTML='';google.accounts.id.renderButton(b,{theme:'outline',size:'large',shape:'pill',text:'signin_with',width:280,locale:o.lang()==='en'?'en':'zh-TW'})}
function initGis(){
 if(!gisOn){gisOn=true;google.accounts.id.initialize({client_id:CID,callback:onCred,auto_select:true,ux_mode:'popup'})}
 renderBtn();try{google.accounts.id.prompt()}catch(e){}}
function loadGis(){
 if(window.google&&google.accounts&&google.accounts.id)return initGis();
 var s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=function(){if(window.google&&google.accounts)initGis()};
 s.onerror=function(){gerr('Google 登入暫時載入不了。','Google sign-in could not load.')};document.head.appendChild(s)}
function showLogin(){
 var head=T('一春成員專區','EvoScale Members','h2')+T('用 Google 帳號登入後，就能看每月場次與預約','Sign in with Google to see the monthly sessions and book a seat','p');
 if(!CID){card(head+T('登入功能設定中，稍後開放','Sign-in is being set up and will open soon','p','class="gn"'));return}
 card(head+'<div id="gbtn" class="gbtn"></div><p id="gerr" class="gerr" role="alert" hidden></p>'+T('只用來確認身分與記錄預約。','Used only to confirm your identity and record your booking.','p','class="gn"'));
 loadGis()}
function onCred(resp){
 if(!resp||!resp.credential)return;var e=document.getElementById('gerr');if(e)e.hidden=true;
 fetch(WK+'/auth/google',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({credential:resp.credential})})
 .then(function(r){return r.json().then(function(j){return {st:r.status,j:j}},function(){return {st:r.status,j:null}})})
 .then(function(x){
  if(x.st===403)return blocked();
  if(x.st===503)return showLogin();
  if(x.j&&x.j.ok&&x.j.s){ls(KS,x.j.s);enter(x.j)}else gerr('登入沒有成功，請再試一次。','Sign-in did not work. Please try again.')})
 .catch(function(){gerr('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.')})}
function enter(j){
 user=j.user||{};gate.innerHTML='';
 var h='';if(user.picture&&/^https:\/\//.test(user.picture))h+='<img class="av" alt="" referrerpolicy="no-referrer" src="'+esc(user.picture)+'">';
 acct.innerHTML=h+'<span class="em"></span><button type="button" id="out" class="lo" data-zh="登出" data-en="Sign out">'+(o.lang()==='en'?'Sign out':'登出')+'</button>';
 acct.querySelector('.em').textContent=user.email||'';acct.hidden=false;
 document.getElementById('out').addEventListener('click',function(){
  ls(KS,null);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()});
 var el=document.getElementById('sealed');
 if(!j.code||!el||!window.crypto||!crypto.subtle)return gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.');
 var b=Uint8Array.from(atob(el.textContent.trim()),function(c){return c.charCodeAt(0)});
 crypto.subtle.importKey('raw',new TextEncoder().encode(j.code),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
 .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))})
 .then(function(x){o.start(JSON.parse(new TextDecoder().decode(x)),{user:user,rec:j.rec||null,known:j.known||null})},function(){gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.')})}
function boot(){
 var s=ls(KS);if(!s)return showLogin();
 fetch(WK+'/me',{headers:{'X-Session':s}}).then(function(r){
  if(r.status===401){ls(KS,null);return showLogin()}
  if(r.status===403)return blocked();
  return r.json().then(function(j){if(j&&j.ok)enter(j);else showLogin()})})
 .catch(function(){card(T('一春成員專區','EvoScale Members','h2')+T('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.','p'))})}
return {boot:boot,sess:function(){return ls(KS)},user:function(){return user},relang:renderBtn,
 expired:function(){ls(KS,null);location.reload()},blocked:blocked}
};
</script>
<script>
(function(){
var WK='https://evoscale-forms.comicbnb.workers.dev';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var box=document.getElementById('body');
var q=new URLSearchParams(location.search).get('lang'),L=(q==='en'||q==='zh')?q:(ls('dr_lang')||'zh');
function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
var onLang=null,A=ESA({lang:function(){return L},apply:function(){apply(L)},start:start,clear:function(){box.innerHTML=''}});
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);A.relang();if(onLang)onLang()});
A.boot();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(zh,en){return '<span data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+esc(L==='en'?en:zh)+'</span>'}
function start(d,auth){
 box.innerHTML=d.html;apply(L);
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
 if(!d.has||d.date>today)return;
 var f=document.getElementById('ef'),wait=document.getElementById('evw'),err=document.getElementById('eerr'),go=document.getElementById('ego'),done=document.getElementById('edone');
 wait.hidden=true;f.hidden=false;
 var cards=[].slice.call(f.querySelectorAll('.ec')),saved=false;
 function val(q){
  var f_=q.getAttribute('data-f');
  if(f_==='help')return [].map.call(q.querySelectorAll('.pl[aria-pressed="true"]'),function(b){return b.getAttribute('data-v')});
  if(f_==='insight')return q.querySelector('textarea').value.trim();
  var b=q.querySelector('[aria-pressed="true"]');return b?b.getAttribute('data-v'):''}
 function teamVal(c){var o={};[].forEach.call(c.querySelectorAll('.q'),function(q){o[q.getAttribute('data-f')]=val(q)});return o}
 function filled(v){return !!(v.pmf||v.scale||v.overall||(v.help&&v.help.length)||v.insight)}
 function mark(){cards.forEach(function(c){c.querySelector('.fl').hidden=!filled(teamVal(c))})}
 f.addEventListener('click',function(ev){
  var b=ev.target.closest('.sb,.ob,.pl');if(!b)return;ev.preventDefault();
  var on=b.getAttribute('aria-pressed')==='true';
  if(b.classList.contains('pl')){b.setAttribute('aria-pressed',on?'false':'true')}
  else{[].forEach.call(b.parentNode.querySelectorAll('[aria-pressed]'),function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed',on?'false':'true')}
  mark();done.hidden=true});
 f.addEventListener('input',function(){mark();done.hidden=true});
 function set(rec){
  if(!rec)return;saved=true;
  cards.forEach(function(c){var v=(rec.teams||{})[c.getAttribute('data-k')];if(!v)return;
   [].forEach.call(c.querySelectorAll('.q'),function(q){var k=q.getAttribute('data-f'),x=v[k];
    if(k==='insight'){q.querySelector('textarea').value=x||''}
    else if(k==='help'){[].forEach.call(q.querySelectorAll('.pl'),function(b){b.setAttribute('aria-pressed',(x||[]).indexOf(b.getAttribute('data-v'))>=0?'true':'false')})}
    else{[].forEach.call(q.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',x&&b.getAttribute('data-v')===String(x)?'true':'false')})}})});
  document.getElementById('enote').value=rec.note||'';mark();go.innerHTML=T('更新評估表','Update evaluation')}
 fetch(WK+'/eval2?s='+encodeURIComponent(d.id),{headers:{'X-Session':A.sess()||''}}).then(function(r){
  if(r.status===401){A.expired();return null}if(r.status===403){A.blocked();return null}
  return r.json().then(function(j){return j&&j.ok?j.rec:null},function(){return null})}).then(set,function(){});
 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=false;
 function showDone(upd){lastDone=upd;document.getElementById('edt').innerHTML=upd?T('評估表已更新','Evaluation updated'):T('評估表已送出','Evaluation received');
  document.getElementById('edp').innerHTML=T('謝謝你的看法。評估表以最後一次送出的為準。','Thank you for your read. The latest version you submit is the one we keep.');
  var was=done.hidden;done.hidden=false;if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 onLang=function(){if(!done.hidden)showDone(lastDone)};
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function txt(teams,note){
  var out=[];d.teams.forEach(function(t){var v=teams[t.key]||{};
   out.push('【'+t.zh+'】\nPMF：'+(v.pmf||'-')+'\nScale：'+(v.scale||'-')+'\n整體評價：'+(v.overall||'-')+'\n能幫上什麼：'+((v.help||[]).join('、')||'-')+'\n關鍵洞察：'+(v.insight||'-'))});
  out.push('【整場意見】\n'+(note||'-'));return out.join('\n\n')}
 function mail(name,email,teams,note){
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','會後評估表 '+d.date+' '+name);fd.append('_template','table');fd.append('_captcha','false');
   fd.append('name',name);fd.append('email',email);fd.append('session',d.date);fd.append('evaluation',txt(teams,note));fd.append('lang',L);
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  var teams={};cards.forEach(function(c){teams[c.getAttribute('data-k')]=teamVal(c)});
  var note=document.getElementById('enote').value.trim().slice(0,500),body={s:d.id,teams:teams,note:note,lang:L};
  go.disabled=true;
  fetch(WK+'/eval2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(body)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   var u=A.user()||{};showDone(typeof j.created==='boolean'?!j.created:saved);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
   mail(u.name||u.email||'',u.email||'',teams,note)})});
}
})();
</script>
</body></html>
