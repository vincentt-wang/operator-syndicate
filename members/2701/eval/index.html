 function val(q){
  var f_=q.getAttribute('data-f');
  if(f_==='help')return [].map.call(q.querySelectorAll('.pl[aria-pressed="true"]'),function(b){return b.getAttribute('data-v')});
  if(f_==='insight')return q.querySelector('textarea').value.trim();
  var b=q.querySelector('[aria-pressed="true"]');return b?b.getAttribute('data-v'):''}
 function teamVal(c){var o={};[].forEach.call(c.querySelectorAll('.q'),function(q){o[q.getAttribute('data-f')]=val(q)});return o}
 function filled(v){return !!(v.pmf||v.scale||v.overall||(v.help&&v.help.length)||v.insight)}
 function mark(){cards.forEach(function(c){c.querySelector('.fl').hidden=!filled(teamVal(c))})}
 f.addEventListener('click',function(ev){
  var b=ev.target.closest('.sb,.ob,.pl');if(!b)return;ev.preventDefault();
  var on=b.getAttribute('aria-pressed')==='true';
  if(b.classList.contains('pl')){b.setAttribute('aria-pressed',on?'false':'true')}
  else{[].forEach.call(b.parentNode.querySelectorAll('[aria-pressed]'),function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed',on?'false':'true')}
  mark();done.hidden=true});
 f.addEventListener('input',function(){mark();done.hidden=true});
 function set(rec){
  if(!rec)return;saved=true;
  cards.forEach(function(c){var v=(rec.teams||{})[c.getAttribute('data-k')];if(!v)return;
   [].forEach.call(c.querySelectorAll('.q'),function(q){var k=q.getAttribute('data-f'),x=v[k];
    if(k==='insight'){q.querySelector('textarea').value=x||''}
    else if(k==='help'){[].forEach.call(q.querySelectorAll('.pl'),function(b){b.setAttribute('aria-pressed',(x||[]).indexOf(b.getAttribute('data-v'))>=0?'true':'false')})}
    else{[].forEach.call(q.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',x&&b.getAttribute('data-v')===String(x)?'true':'false')})}})});
  document.getElementById('enote').value=rec.note||'';mark();go.innerHTML=T('更新評估表','Update evaluation')}
 fetch(WK+'/eval2?s='+encodeURIComponent(d.id),{headers:{'X-Session':A.sess()||''}}).then(function(r){
  if(r.status===401){A.expired();return null}if(r.status===403){A.blocked();return null}
  return r.json().then(function(j){return j&&j.ok?j.rec:null},function(){return null})}).then(set,function(){});
 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=false;
 function showDone(upd){lastDone=upd;document.getElementById('edt').innerHTML=upd?T('評估表已更新','Evaluation updated'):T('評估表已送出','Evaluation received');
  document.getElementById('edp').innerHTML=T('謝謝你的看法。評估表以最後一次送出的為準。','Thank you for your read. The latest version you submit is the one we keep.');
  var was=done.hidden;done.hidden=false;if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 onLang=function(){if(!done.hidden)showDone(lastDone)};
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function txt(teams,note){
  var out=[];d.teams.forEach(function(t){var v=teams[t.key]||{};
   out.push('【'+t.zh+'】\nPMF：'+(v.pmf||'-')+'\nScale：'+(v.scale||'-')+'\n整體評價：'+(v.overall||'-')+'\n能幫上什麼：'+((v.help||[]).join('、')||'-')+'\n關鍵洞察：'+(v.insight||'-'))});
  out.push('【整場意見】\n'+(note||'-'));return out.join('\n\n')}
 function mail(name,email,teams,note){
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','會後評估表 '+d.date+' '+name);fd.append('_template','table');fd.append('_captcha','false');
   fd.append('name',name);fd.append('email',email);fd.append('session',d.date);fd.append('evaluation',txt(teams,note));fd.append('lang',L);
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  var teams={};cards.forEach(function(c){teams[c.getAttribute('data-k')]=teamVal(c)});
  var note=document.getElementById('enote').value.trim().slice(0,500),body={s:d.id,teams:teams,note:note,lang:L};
  go.disabled=true;
  fetch(WK+'/eval2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(body)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   var u=A.user()||{};showDone(typeof j.created==='boolean'?!j.created:saved);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
   mail(u.name||u.email||'',u.email||'',teams,note)})});
}
})();
</script>
</body></html>
