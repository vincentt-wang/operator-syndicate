 card(T(sv?'你的預約':'Deal Room 預約',sv?'Your booking':'Deal Room booking','h2')+(lead||T('填完送出就預約好了，這支手機會記得，之後再打開這頁就能改。','Submit and you are booked. This phone remembers it, so you can change it here later.','p'))+GUEST+(foot||''));
 var f=document.getElementById('gform'),er=document.getElementById('gferr');bk(INAPP?'inapp_form':'guest_form');
 var fill=function(r){if(!r)return;f.elements.name.value=r.name||'';f.elements.ct.value=r.company_title||'';f.elements.email.value=r.email||'';f.elements.email.readOnly=true;
  Object.keys(r.dr||{}).forEach(function(id){var d=r.dr[id],m=f.querySelector('input[name="gm_'+id+'"][value="'+d.mode+'"]');if(m){m.checked=true;var fs=m.closest('fieldset');fs.querySelector('.lunch').hidden=d.mode!=='現場';var l=d.lunch&&f.querySelector('input[name="gl_'+id+'"][value="'+d.lunch+'"]');if(l)l.checked=true}});
  var sb=f.querySelector('button[type=submit]');sb.innerHTML=T('更新預約','Update booking')};
 if(sv&&sv.e&&sv.t)fetch(WK+'/rsvp?e='+encodeURIComponent(sv.e)+'&t='+encodeURIComponent(sv.t)).then(function(r){return r.json()}).then(function(j){if(j&&j.rec)fill(j.rec)}).catch(function(){});
 f.addEventListener('change',function(e){var fs=e.target.closest('fieldset[data-g]');if(!fs||e.target.name.indexOf('gm_')!==0)return;fs.querySelector('.lunch').hidden=e.target.value!=='現場'});
 f.addEventListener('submit',function(e){e.preventDefault();er.hidden=true;
  var v=function(n){var x=f.elements[n];return x?String(x.value||'').trim():''},dr={},n=0;
  f.querySelectorAll('fieldset[data-g]').forEach(function(fs){var id=fs.getAttribute('data-g'),m=f.querySelector('input[name="gm_'+id+'"]:checked');if(!m)return;var l=f.querySelector('input[name="gl_'+id+'"]:checked');dr[id]={mode:m.value,lunch:m.value==='現場'&&l?l.value:''};n++});
  var bad=function(zh,en){er.innerHTML=T(zh,en);er.hidden=false};
  if(!v('name'))return bad('請填姓名。','Please enter your name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email')))return bad('Email 格式看起來不對。','That email does not look right.');
  if(!n)return bad('至少選一場要現場、線上或不克參加。','Choose at least one session.');
  var b=f.querySelector('button[type=submit]');b.disabled=true;
  fetch(WK+'/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:v('name'),email:v('email'),company_title:v('ct'),dr:dr,ms:[],note:INAPP?'LINE 內填表':'不登入預約',lang:o.lang(),_honey:v('_honey'),t:(sv&&sv.e===v('email').toLowerCase()?sv.t:undefined)})})
  .then(function(r){return r.json().then(function(j){return [r.status,j]})}).then(function(x){
   if(x[1]&&x[1].ok){if(x[1].t)ls(GK,JSON.stringify({e:v('email').toLowerCase(),t:x[1].t}));bk('guest_ok');var li=[];f.querySelectorAll('fieldset[data-g]').forEach(function(fs){var d=dr[fs.getAttribute('data-g')];if(d)li.push('<li>'+fs.querySelector('legend').innerHTML+' · '+esc(d.mode)+(d.lunch?' · '+esc(d.lunch):'')+'</li>')});
    card(T('預約好了','You are booked','h2')+'<ul class="gl" style="text-align:left;margin:12px auto 0;max-width:320px">'+li.join('')+'</ul>'+T('要改預約，用這支手機再打開這一頁就能改。','To change it, open this page again on this phone.','p','class="gn"'));return}
   b.disabled=false;if(x[0]===409){bk('guest_409');return bad('這個 Email 已經有預約了。要改請用當初預約的那支手機再打開這頁，或在群組說一聲。','This email already has a booking. Open this page on the phone you booked with, or tell us in the group.')}bk('guest_fail');
   bad('送出沒有成功，請稍後再試。','Submission failed. Please try again.')})
  .catch(function(){b.disabled=false;bad('連線有問題，請稍後再試。','Connection problem. Please try again.')})})}
function showLogin(){
 var head=T('一春成員專區','EvoScale Members','h2')+T('用 Google 帳號登入後，就能看每月場次與預約','Sign in with Google to see the monthly sessions and book a seat','p');
 if(!CID){card(head+T('登入功能設定中，稍後開放','Sign-in is being set up and will open soon','p','class="gn"'));return}
 if(INAPP){var ext=location.pathname+'?openExternalBrowser=1',clean=location.origin+location.pathname;bk('inapp_view');
  /* 11/05 Vincent：Google 登入放上面，註明複製網址用 Google Chrome 打開；不登入的表單放下面 */
  var crm=AND?'intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end':'googlechromes://'+location.host+location.pathname;
  var gtop='<div class="gtop">'+T('用 Google 登入','Sign in with Google','h3')
   +T('LINE 裡不能用 Google 登入。請複製網址，用 Google Chrome 打開，登入後就能預約與看每月場次。','Google sign-in does not work inside LINE. Copy the link and open it in Google Chrome to sign in, book and see the monthly sessions.','p','class="gn"')
   +'<div class="gact"><button type="button" class="btn" id="iabcp">'+T('複製網址','Copy link')+'</button><a class="btn o" href="'+crm+'" id="gcrm">'+T('用 Chrome 打開','Open in Chrome')+'</a></div>'
   +'<p class="gn gurl">'+esc(clean)+'</p></div>'
   +T('或不登入，直接在這裡填表預約','Or book here without signing in','p','class="gor"');
  if(o.guest){guest(gtop)}
  else{card(T('一春成員專區','EvoScale Members','h2')+T('這一頁要用 Google 登入。App 內建的瀏覽器不支援 Google 登入，請改用瀏覽器開啟。','This page needs Google sign-in, which in-app browsers do not support. Please open it in your browser.','p')
   +(ISLINE?'<a class="btn" href="'+ext+'" id="gext2">'+T('用瀏覽器開啟','Open in browser')+'</a>':'<button type="button" class="btn" id="iabcp">'+T('複製連結','Copy link')+'</button>'))}
  var ge=document.getElementById('gext');if(ge)ge.addEventListener('click',function(e){bk('inapp_google');if(!ISLINE){e.preventDefault();var done=function(){ge.innerHTML=T('已複製，貼到 Safari 或 Chrome 開啟','Copied. Paste it into Safari or Chrome')};if(navigator.clipboard)navigator.clipboard.writeText(clean).then(done,function(){prompt('',clean)});else prompt('',clean)}});
  var gc=document.getElementById('gcrm');if(gc)gc.addEventListener('click',function(){bk('inapp_chrome')});
  var cb=document.getElementById('iabcp');if(cb)cb.addEventListener('click',function(){bk('inapp_copy');var done=function(){cb.innerHTML=T('已複製，貼到 Chrome 打開','Copied. Paste it into Chrome')};if(navigator.clipboard)navigator.clipboard.writeText(clean).then(done,function(){prompt('',clean)});else prompt('',clean)});
  return}
 card(head+'<div id="gbtn" class="gbtn"></div><p id="gerr" class="gerr" role="alert" hidden></p>'+T('只用來確認身分與記錄預約。','Used only to confirm your identity and record your booking.','p','class="gn"')+guestLink());
 bindGuest();loadGis()}
function onCred(resp){
 if(!resp||!resp.credential)return;var e=document.getElementById('gerr');if(e)e.hidden=true;
 fetch(WK+'/auth/google',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({credential:resp.credential})})
 .then(function(r){return r.json().then(function(j){return {st:r.status,j:j}},function(){return {st:r.status,j:null}})})
 .then(function(x){
  if(x.st===403)return blocked();
  if(x.st===503)return showLogin();
  if(x.j&&x.j.ok&&x.j.s){ls(KS,x.j.s);enter(x.j)}else gerr('登入沒有成功，請再試一次。','Sign-in did not work. Please try again.')})
 .catch(function(){gerr('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.')})}
function enter(j){
 user=j.user||{};gate.innerHTML='';
 var h='';if(user.picture&&/^https:\/\//.test(user.picture))h+='<img class="av" alt="" referrerpolicy="no-referrer" src="'+esc(user.picture)+'">';
 acct.innerHTML=h+'<span class="em"></span><button type="button" id="out" class="lo" data-zh="登出" data-en="Sign out">'+(o.lang()==='en'?'Sign out':'登出')+'</button>';
 acct.querySelector('.em').textContent=user.email||'';acct.hidden=false;
 document.getElementById('out').addEventListener('click',function(){
  ls(KS,null);try{google.accounts.id.disableAutoSelect()}catch(e){}location.reload()});
 var el=document.getElementById('sealed');
 if(!j.code||!el||!window.crypto||!crypto.subtle)return gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.');
 var b=Uint8Array.from(atob(el.textContent.trim()),function(c){return c.charCodeAt(0)});
 crypto.subtle.importKey('raw',new TextEncoder().encode(j.code),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
 .then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))})
 .then(function(x){o.start(JSON.parse(new TextDecoder().decode(x)),{user:user,rec:j.rec||null,known:j.known||null})},function(){gerr('內容暫時打不開，請稍後再試。','The content could not be opened. Please try again shortly.')})}
function boot(){
 var s=ls(KS);if(!s)return showLogin();
 fetch(WK+'/me',{headers:{'X-Session':s}}).then(function(r){
  if(r.status===401){ls(KS,null);return showLogin()}
  if(r.status===403)return blocked();
  return r.json().then(function(j){if(j&&j.ok)enter(j);else showLogin()})})
 .catch(function(){card(T('一春成員專區','EvoScale Members','h2')+T('連線暫時有問題，請稍後再試。','Connection problem. Please try again shortly.','p'))})}
return {boot:boot,sess:function(){return ls(KS)},user:function(){return user},relang:renderBtn,
 expired:function(){ls(KS,null);location.reload()},blocked:blocked}
};
</script>
<script>
(function(){
var RID=document.body.getAttribute('data-r');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var box=document.getElementById('body');
var q=new URLSearchParams(location.search).get('lang'),L=(q==='en'||q==='zh')?q:(ls('dr_lang')||'zh');
function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
var rec=null,MODE={'現場':['現場','On site'],'線上':['線上','Online'],'不克參加':['不克參加',"Can't make it"]},LUN={'葷食':['葷食','regular lunch'],'素食':['素食','vegetarian lunch'],'不用':['不用便當','no lunch']};
function mine(){var p=document.getElementById('pmine');if(!p)return;var x=rec&&rec.dr&&rec.dr[RID];
 if(!x){p.textContent=L==='en'?'Not booked yet':'尚未預約';return}var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch];
 p.textContent=L==='en'?('Booked: '+m[1]+(lu?', '+lu[1]:'')):('已預約：'+m[0]+(lu?'，'+lu[0]:''))}
var A=ESA({lang:function(){return L},apply:function(){apply(L)},start:start,clear:function(){box.innerHTML=''}});
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);A.relang();mine()});
A.boot();
function start(d,auth){
 box.innerHTML=d.html;apply(L);rec=auth.rec;mine();
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
 [].forEach.call(document.querySelectorAll('[data-evalfrom]'),function(a){a.hidden=a.getAttribute('data-evalfrom')>today});
}
})();
</script>
