<script>
(function(){
var WK='https://evoscale-forms.comicbnb.workers.dev',KC='es_lp_code',KM='es_lp_me',RID=document.body.getAttribute('data-r');
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
var hash=location.hash.replace(/^#/,''),code=hash||ls(KC)||'',el=document.getElementById('sealed'),box=document.getElementById('body');
var q=new URLSearchParams(location.search).get('lang'),L=(q==='en'||q==='zh')?q:(ls('dr_lang')||'zh');
function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);mine()});
window.addEventListener('hashchange',function(){location.reload()});
if(!code||!el||!window.crypto||!crypto.subtle)return;
var b=Uint8Array.from(atob(el.textContent.trim()),function(c){return c.charCodeAt(0)});
crypto.subtle.importKey('raw',new TextEncoder().encode(code),'PBKDF2',false,['deriveKey']).then(function(k){return crypto.subtle.deriveKey({name:'PBKDF2',salt:b.slice(0,16),iterations:200000,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])})
.then(function(k){return crypto.subtle.decrypt({name:'AES-GCM',iv:b.slice(16,28)},k,b.slice(28))}).then(function(x){ls(KC,code);start(JSON.parse(new TextDecoder().decode(x)))})
.catch(function(){if(!hash)ls(KC,null)});
var rec=null,MODE={'現場':['現場','On site'],'線上':['線上','Online'],'不克參加':['不克參加',"Can't make it"]},LUN={'葷食':['葷食','regular lunch'],'素食':['素食','vegetarian lunch'],'不用':['不用便當','no lunch']};
function mine(){var p=document.getElementById('pmine');if(!p)return;var x=rec&&rec.dr&&rec.dr[RID];
 if(!x){p.textContent=L==='en'?'Not booked yet':'尚未預約';return}var m=MODE[x.mode]||[x.mode,x.mode],lu=x.lunch&&LUN[x.lunch];
 p.textContent=L==='en'?('Booked: '+m[1]+(lu?', '+lu[1]:'')):('已預約：'+m[0]+(lu?'，'+lu[0]:''))}
function start(d){
 box.innerHTML=d.html;apply(L);
 [].forEach.call(document.querySelectorAll('a[href^="/members/"]'),function(a){if(a.getAttribute('href').indexOf('#')<0&&!a.hasAttribute('download'))a.setAttribute('href',a.getAttribute('href')+'#'+code)});
 mine();
 var me=null;try{me=JSON.parse(ls(KM)||'null')}catch(e){}
 if(me&&me.email&&me.t)fetch(WK+'/rsvp?e='+encodeURIComponent(me.email)+'&t='+encodeURIComponent(me.t)).then(function(r){return r.json()}).then(function(j){if(j&&j.rec){rec=j.rec;mine()}}).catch(function(){});
}
})();
