function apply(l){document.documentElement.lang=l==='en'?'en':'zh-Hant';document.querySelectorAll('[data-zh]').forEach(function(e){e.textContent=e.getAttribute('data-'+l)});document.getElementById('lang').textContent=l==='en'?'中文':'English';ls('dr_lang',l)}
apply(L);
var onLang=null,A=ESA({lang:function(){return L},apply:function(){apply(L)},start:start,clear:function(){box.innerHTML=''},
 guestTxt:['不用 Google 登入，直接填評估表','Fill it in without signing in'],
 guestFn:function(inapp){start(JSON.parse(document.getElementById('evd').textContent),null,inapp)}});
document.getElementById('lang').addEventListener('click',function(){L=L==='en'?'zh':'en';apply(L);A.relang();if(onLang)onLang()});
A.boot();
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function T(zh,en,tag,attr){tag=tag||'span';return '<'+tag+(attr?' '+attr:'')+' data-zh="'+esc(zh)+'" data-en="'+esc(en)+'">'+esc(L==='en'?en:zh)+'</'+tag+'>'}
function start(d,auth,inapp){
 box.innerHTML=d.html;apply(L);var G=!auth;   /* 11/10：G=不登入填寫，姓名與 Email 自己填，送到 /eval */
 var n=new Date(),today=n.getFullYear()+'-'+('0'+(n.getMonth()+1)).slice(-2)+'-'+('0'+n.getDate()).slice(-2);
 var PV=/[?&]direct=1/.test(location.search)&&d.has&&d.date>today;   /* 11/16 Vincent：後台要能先看到題目；?direct=1 且還沒到當天＝預覽，不能送出 */
 if(!d.has||(d.date>today&&!PV))return;
 var f=document.getElementById('ef'),wait=document.getElementById('evw'),err=document.getElementById('eerr'),go=document.getElementById('ego'),done=document.getElementById('edone');
 wait.hidden=true;f.hidden=false;
 if(PV){var pb=document.createElement('p');pb.className='ein';pb.style.cssText='background:#FFF3E6;border:1px solid #FFB27A;color:#7A2E0A;border-radius:12px;padding:10px 14px;font-weight:700';pb.textContent=L==='en'?'Preview: the form opens on the day of the session.':'預覽：這份評估表在活動當天開放填寫，現在只能看題目。';f.insertBefore(pb,f.firstChild);[].forEach.call(f.querySelectorAll('button[type=submit],#ego'),function(x){x.disabled=true;x.style.opacity='.5'});f.addEventListener('submit',function(e){e.preventDefault();e.stopImmediatePropagation()},true)}
 var DK='es_eval_d_'+d.id;   /* 11/16：草稿存在這支手機，下次打開帶回；不登入的人不顯示歷史 */
 if(!G){var me=(A.user()||{}).email||'';if(me){var ei=document.createElement('p');ei.className='eid';ei.innerHTML=T('送出帳號：'+me,'Sending as '+me);f.insertBefore(ei,f.firstChild)}}
 var GK2='es_eval_g',gs=(function(){try{return JSON.parse(localStorage.getItem(GK2)||'{}')}catch(e){return {}}})();
 if(G){var gid=document.createElement('section');gid.className='card gid';
  gid.innerHTML=(inapp?T('LINE 裡不能用 Google 登入，直接在這裡填就好。','Google sign-in does not work inside LINE, so just fill it in here.','p','class="qd"'):'')
   +'<div class="fd"><label>'+T('姓名','Name')+'<input id="gname" autocomplete="name"></label></div>'
   +'<div class="fd"><label>'+T('公司與職稱','Company and title')+'<input id="gct" autocomplete="organization-title"></label></div>'
   +'<div class="fd"><label>Email<input id="gemail" type="email" autocomplete="email"></label></div>'
   +'<input id="ghoney" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">';
  f.insertBefore(gid,f.firstChild);document.getElementById('gname').value=gs.name||'';document.getElementById('gct').value=gs.ct||'';document.getElementById('gemail').value=gs.email||''}
 var cards=[].slice.call(f.querySelectorAll('.ec')),saved=false;
 function val(q){
  var f_=q.getAttribute('data-f');
  if(f_==='help')return [].map.call(q.querySelectorAll('.pl[aria-pressed="true"]'),function(b){return b.getAttribute('data-v')});
  if(f_==='insight')return q.querySelector('textarea').value.trim();
  var b=q.querySelector('[aria-pressed="true"]');return b?b.getAttribute('data-v'):''}
 function teamVal(c){var o={};[].forEach.call(c.querySelectorAll('.q'),function(q){o[q.getAttribute('data-f')]=val(q)});return o}
 function filled(v){return !!(v.pmf||v.scale||v.overall||(v.help&&v.help.length)||v.insight)}
 function mark(){cards.forEach(function(c){c.querySelector('.fl').hidden=!filled(teamVal(c))})}
 f.addEventListener('click',function(ev){
  var b=ev.target.closest('.sb,.ob,.pl');if(!b)return;ev.preventDefault();
  var on=b.getAttribute('aria-pressed')==='true';
  if(b.classList.contains('pl')){b.setAttribute('aria-pressed',on?'false':'true')}
  else{[].forEach.call(b.parentNode.querySelectorAll('[aria-pressed]'),function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed',on?'false':'true')}
  mark();draft();done.hidden=true});
 f.addEventListener('input',function(){mark();draft();done.hidden=true});
 function collect(){var teams={};cards.forEach(function(c){teams[c.getAttribute('data-k')]=teamVal(c)});return {teams:teams,note:document.getElementById('enote').value.trim().slice(0,500),talk:talkVal()}}
 function draft(){ls(DK,JSON.stringify(collect()))}
 function set(rec,isDraft){
  if(!rec)return;if(!isDraft)saved=true;
  cards.forEach(function(c){var v=(rec.teams||{})[c.getAttribute('data-k')];if(!v)return;
   [].forEach.call(c.querySelectorAll('.q'),function(q){var k=q.getAttribute('data-f'),x=v[k];
    if(k==='insight'){q.querySelector('textarea').value=x||''}
    else if(k==='help'){[].forEach.call(q.querySelectorAll('.pl'),function(b){b.setAttribute('aria-pressed',(x||[]).indexOf(b.getAttribute('data-v'))>=0?'true':'false')})}
    else{[].forEach.call(q.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',x&&b.getAttribute('data-v')===String(x)?'true':'false')})}})});
  document.getElementById('enote').value=rec.note||'';var et=document.getElementById('etalk');if(et)et.value=rec.talk||'';mark();if(saved)go.innerHTML=T('更新評估表','Update evaluation')}
 function fromDraft(){var x=null;try{x=JSON.parse(ls(DK)||'null')}catch(e){}if(!x)return;if(G&&(gs.t||{})[d.id])saved=true;set(x,true)}
 function when(iso){var t=new Date(iso);if(isNaN(t))return '';return (t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)}
 function nextBtn(){var x=d.next;if(!x)return '';return '<a class="btn sm" href="/members/?book='+encodeURIComponent(x.id)+'">'+T('預約下一場 '+x.zh,'Book the next one · '+x.en)+'</a>'}
 function sc(x){return x?[x,x==='不評'?'Skip':x]:['-','-']}
 function sumHtml(v){var lab=d.lab||{help:{},ov:{}},h='<dl>';
  d.teams.forEach(function(t){var x=(v.teams||{})[t.key]||{},ov=lab.ov[x.overall],p=sc(x.pmf),q=sc(x.scale),hp=x.help||[];
   h+='<dt>'+T(t.zh,t.en)+'</dt><dd>'+T('PMF '+p[0]+'　Scale '+q[0]+'　'+(ov?ov[0]:'整體評價未選'),'PMF '+p[1]+' · Scale '+q[1]+' · '+(ov?ov[1]:'No overall view'))+'</dd>'
    +(hp.length?'<dd>'+T('能幫：'+hp.join('、'),'Help: '+hp.map(function(z){return lab.help[z]||z}).join(', '))+'</dd>':'')
    +(x.insight?'<dd>'+T('關鍵洞察：','Key insight: ')+esc(x.insight)+'</dd>':'')});
  if(d.talk&&v.talk)h+='<dt>'+T(d.talk.zh,d.talk.en)+'</dt><dd>'+esc(v.talk)+'</dd>';
  if(v.note)h+='<dt>'+T('這一場整體','The whole session')+'</dt><dd>'+esc(v.note)+'</dd>';
  return h+'</dl>'}
 function mine(v){return '<details class="emi"><summary>'+T('看我填過的','See what I sent')+'</summary>'+sumHtml(v)+'</details>'}
 function prev(rec){var c=document.createElement('section');c.className='card eh';
  c.innerHTML=T('你已經填過這一場','You already sent this one','h2')+T('上次送出 '+when(rec.updated)+'。下面帶入的是你上次填的內容，改了再送一次，以最後一次為準。','Last sent '+when(rec.updated)+'. Your answers are filled in below. Change anything and send again; we keep the latest.','p')
   +(d.next?'<div class="gos">'+nextBtn()+'</div>':'')+mine(rec);
  f.insertBefore(c,f.firstChild)}
 if(!G)fetch(WK+'/eval2?s='+encodeURIComponent(d.id),{headers:{'X-Session':A.sess()||''}}).then(function(r){
  if(r.status===401){A.expired();return null}if(r.status===403){A.blocked();return null}
  return r.json().then(function(j){return j&&j.ok?j.rec:null},function(){return null})}).then(function(rec){if(rec){set(rec);prev(rec)}else fromDraft()},fromDraft);
 else fromDraft();
 function talkVal(){var et=document.getElementById('etalk');return et?et.value.trim().slice(0,500):''}
 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=null;
 function showDone(upd,v){lastDone=[upd,v];document.getElementById('edt').innerHTML=upd?T('評估表已更新，謝謝','Evaluation updated. Thank you'):T('收到了，謝謝','Got it. Thank you');
  document.getElementById('edp').innerHTML=T('回覆只進一春內部，不會轉發給團隊。之後再改，以最後一次送出的為準。','Your answers stay inside EvoScale and are never passed to the teams. If you change them later, we keep the latest.');
  document.getElementById('eda').innerHTML=nextBtn();document.getElementById('edm').innerHTML=G?'':mine(v);   /* 不登入的人不顯示歷史 */
  var was=done.hidden;done.hidden=false;if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 onLang=function(){if(!done.hidden&&lastDone)showDone(lastDone[0],lastDone[1])};
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function txt(teams,note){
  var out=[];d.teams.forEach(function(t){var v=teams[t.key]||{};
   out.push('【'+t.zh+'】\nPMF：'+(v.pmf||'-')+'\nScale：'+(v.scale||'-')+'\n整體評價：'+(v.overall||'-')+'\n能幫上什麼：'+((v.help||[]).join('、')||'-')+'\n關鍵洞察：'+(v.insight||'-'))});
  var tv=talkVal();if(document.getElementById('etalk'))out.push('【分享回饋】\n'+(tv||'-'));
  out.push('【整場意見】\n'+(note||'-'));return out.join('\n\n')}
 function mail(name,email,teams,note,ct){
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','會後評估表 '+d.date+' '+name);fd.append('_template','table');fd.append('_captcha','false');
   fd.append('name',name);if(ct)fd.append('company_title',ct);fd.append('email',email);fd.append('session',d.date);fd.append('evaluation',txt(teams,note));fd.append('lang',L);
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  var cv=collect(),teams=cv.teams,note=cv.note,body={s:d.id,teams:teams,note:note,talk:cv.talk,lang:L};
  if(G){
   var gn=document.getElementById('gname').value.trim(),ge=document.getElementById('gemail').value.trim().toLowerCase();
   var gc=document.getElementById('gct').value.trim();
   if(!gn)return fail('請填姓名。','Please enter your name.');
   if(!gc)return fail('請填公司與職稱。','Please enter your company and title.');
   if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(ge))return fail('Email 格式看起來不對。','That email does not look right.');
   body.name=gn;body.ct=gc.slice(0,120);body.email=ge;body._honey=document.getElementById('ghoney').value;var tk=(gs.t||{})[d.id];if(tk&&gs.email===ge)body.t=tk;
   go.disabled=true;
   fetch(WK+'/eval',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
   .then(function(j){go.disabled=false;
    if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
    gs.name=gn;gs.ct=gc;gs.email=ge;gs.t=gs.t||{};gs.t[d.id]=j.t;try{localStorage.setItem(GK2,JSON.stringify(gs))}catch(e){}
    draft();showDone(!j.created,cv);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
    if(!/@qa\.invalid$/.test(ge))mail(gn,ge,teams,note,gc)});
   return}
  go.disabled=true;
  fetch(WK+'/eval2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(body)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   var u=A.user()||{};ls(DK,null);showDone(typeof j.created==='boolean'?!j.created:saved,cv);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
   mail(u.name||u.email||'',u.email||'',teams,note)})});
}
})();
