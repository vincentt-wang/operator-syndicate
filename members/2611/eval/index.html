  if(b.classList.contains('pl')&&!b.classList.contains('fm')){b.setAttribute('aria-pressed',on?'false':'true')}
  else{[].forEach.call(b.parentNode.querySelectorAll('[aria-pressed]'),function(x){x.setAttribute('aria-pressed','false')});b.setAttribute('aria-pressed',on?'false':'true')}
  mark();draft();done.hidden=true});
 f.addEventListener('input',function(){mark();draft();done.hidden=true});
 function collect(){var teams={};cards.forEach(function(c){teams[c.getAttribute('data-k')]=teamVal(c)});return {teams:teams,note:document.getElementById('enote').value.trim().slice(0,500),talk:talkVal(),fmt:fmtVal()}}
 function draft(){ls(DK,JSON.stringify(collect()))}
 function set(rec,isDraft){
  if(!rec)return;if(!isDraft)saved=true;
  cards.forEach(function(c){var v=(rec.teams||{})[c.getAttribute('data-k')];if(!v)return;
   [].forEach.call(c.querySelectorAll('.q'),function(q){var k=q.getAttribute('data-f'),x=v[k];
    if(k==='insight'){q.querySelector('textarea').value=x||''}
    else if(k==='help'){[].forEach.call(q.querySelectorAll('.pl'),function(b){b.setAttribute('aria-pressed',(x||[]).indexOf(b.getAttribute('data-v'))>=0?'true':'false')})}
    else{[].forEach.call(q.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',x&&b.getAttribute('data-v')===String(x)?'true':'false')})}})});
  document.getElementById('enote').value=rec.note||'';var et=document.getElementById('etalk');if(et)et.value=rec.talk||'';
  var fq=f.querySelector('.q[data-f="fmt"]'),fv=rec.fmt||{};if(fq){[].forEach.call(fq.querySelectorAll('[data-v]'),function(b){b.setAttribute('aria-pressed',fv.v&&b.getAttribute('data-v')===fv.v?'true':'false')});fq.querySelector('textarea').value=fv.o||''}
  mark();if(saved)go.innerHTML=T('更新評估表','Update evaluation')}
 function fromDraft(){var x=null;try{x=JSON.parse(ls(DK)||'null')}catch(e){}if(!x)return;if(G&&IDK&&gs.k===IDK&&(gs.t||{})[d.id])saved=true;set(x,true)}
 function when(iso){var t=new Date(iso);if(isNaN(t))return '';return (t.getMonth()+1)+'/'+t.getDate()+' '+('0'+t.getHours()).slice(-2)+':'+('0'+t.getMinutes()).slice(-2)}
 function nextBtn(){var x=d.next;if(!x)return '';return '<a class="btn sm" href="/members/?book='+encodeURIComponent(x.id)+'">'+T('預約下一場 '+x.zh,'Book the next one · '+x.en)+'</a>'}
 function sc(x){return x?[x,x==='不評'?'Skip':x]:['-','-']}
 function sumHtml(v){var lab=d.lab||{help:{},ov:{}},h='<dl>';
  d.teams.forEach(function(t){var x=(v.teams||{})[t.key]||{},ov=lab.ov[x.overall],p=sc(x.pmf),q=sc(x.scale),hp=x.help||[];
   h+='<dt>'+T(t.zh,t.en)+'</dt><dd>'+T('PMF '+p[0]+'　Scale '+q[0]+'　'+(ov?ov[0]:'整體評價未選'),'PMF '+p[1]+' · Scale '+q[1]+' · '+(ov?ov[1]:'No overall view'))+'</dd>'
    +(hp.length?'<dd>'+T('能幫：'+hp.join('、'),'Help: '+hp.map(function(z){return lab.help[z]||z}).join(', '))+'</dd>':'')
    +(x.insight?'<dd>'+T('關鍵洞察：','Key insight: ')+esc(x.insight)+'</dd>':'')});
  if(d.talk&&v.talk)h+='<dt>'+T(d.talk.zh,d.talk.en)+'</dt><dd>'+esc(v.talk)+'</dd>';
  var fl=d.fmt&&v.fmt&&v.fmt.v?(d.fmt.opts[v.fmt.v]||[v.fmt.v,v.fmt.v]):null;if(fl)h+='<dt>'+T(d.fmt.zh,d.fmt.en)+'</dt><dd>'+T(fl[0],fl[1])+(v.fmt.o?'：'+esc(v.fmt.o):'')+'</dd>';
  if(v.note)h+='<dt>'+T('這一場整體','The whole session')+'</dt><dd>'+esc(v.note)+'</dd>';
  return h+'</dl>'}
 function mine(v){return '<details class="emi"><summary>'+T('看我填過的','See what I sent')+'</summary>'+sumHtml(v)+'</details>'}
 function prev(rec){var c=document.createElement('section');c.className='card eh';
  c.innerHTML=T('你已經填過這一場','You already sent this one','h2')+T('上次送出 '+when(rec.updated)+'。下面帶入的是你上次填的內容，改了再送一次，以最後一次為準。','Last sent '+when(rec.updated)+'. Your answers are filled in below. Change anything and send again; we keep the latest.','p')
   +(d.next?'<div class="gos">'+nextBtn()+'</div>':'')+mine(rec);
  f.insertBefore(c,f.firstChild)}
 if(!G)fetch(WK+'/eval2?s='+encodeURIComponent(d.id),{headers:{'X-Session':A.sess()||''}}).then(function(r){
  if(r.status===401){A.expired();return null}if(r.status===403){A.blocked();return null}
  return r.json().then(function(j){return j&&j.ok?j.rec:null},function(){return null})}).then(function(rec){if(rec){set(rec);prev(rec)}else fromDraft()},fromDraft);
 else fromDraft();
 function talkVal(){var et=document.getElementById('etalk');return et?et.value.trim().slice(0,500):''}
 function fail(zh,en){err.innerHTML=T(zh,en);err.hidden=false}
 var lastDone=null;
 function showDone(upd,v){lastDone=[upd,v];document.getElementById('edt').innerHTML=upd?T('評估表已更新，謝謝','Evaluation updated. Thank you'):T('收到了，謝謝','Got it. Thank you');
  document.getElementById('edp').innerHTML=T('回覆只進一春內部，不會轉發給團隊。之後再改，以最後一次送出的為準。','Your answers stay inside EvoScale and are never passed to the teams. If you change them later, we keep the latest.');
  document.getElementById('eda').innerHTML=nextBtn();document.getElementById('edm').innerHTML=G?'':mine(v);   /* 不登入的人不顯示歷史 */
  var was=done.hidden;done.hidden=false;if(was){var c=done.cloneNode(true);done.parentNode.replaceChild(c,done);done=c}done.focus({preventScroll:true});done.scrollIntoView({behavior:'smooth',block:'nearest'})}
 onLang=function(){if(!done.hidden&&lastDone)showDone(lastDone[0],lastDone[1])};
 var RECIP=['boice@evoscalecapital.com','vincent@evoscalecapital.com'];
 function txt(teams,note,fm){
  var out=[];d.teams.forEach(function(t){var v=teams[t.key]||{};
   out.push('【'+t.zh+'】\nPMF：'+(v.pmf||'-')+'\nScale：'+(v.scale||'-')+'\n整體評價：'+(v.overall||'-')+'\n能幫上什麼：'+((v.help||[]).join('、')||'-')+'\n關鍵洞察：'+(v.insight||'-'))});
  var tv=talkVal();if(document.getElementById('etalk'))out.push('【分享回饋】\n'+(tv||'-'));
  if(fm)out.push('【場次形式】\n'+(fm.v||'-')+(fm.o?'：'+fm.o:''));
  out.push('【整場意見】\n'+(note||'-'));return out.join('\n\n')}
 function mail(name,email,teams,note,ct,fm){
  RECIP.forEach(function(to){var fd=new FormData();fd.append('_subject','會後評估表 '+d.date+' '+name);fd.append('_template','table');fd.append('_captcha','false');
   fd.append('name',name);if(ct)fd.append('company_title',ct);fd.append('email',email);fd.append('session',d.date);fd.append('evaluation',txt(teams,note,fm));fd.append('lang',L);
   fetch('https://formsubmit.co/ajax/'+encodeURIComponent(to),{method:'POST',keepalive:true,headers:{Accept:'application/json'},body:fd}).catch(function(){})})}
 f.addEventListener('submit',function(ev){
  ev.preventDefault();err.hidden=true;done.hidden=true;
  var cv=collect(),teams=cv.teams,note=cv.note,body={s:d.id,teams:teams,note:note,talk:cv.talk,fmt:cv.fmt?cv.fmt.v:'',fmt_o:cv.fmt?cv.fmt.o:'',lang:L};
  if(G){
   if(!id){var gt=document.getElementById('gate');if(gt)gt.scrollIntoView({behavior:'smooth',block:'start'});return fail('送出前，請先在最上面選 Google 登入，或填姓名、公司、職稱。','Before sending, sign in with Google at the top or enter your name, company and title.')}
   var gn=id.name,ge=id.email,gc=id.co+' '+id.ti;
   body.name=gn;body.company=id.co;body.title=id.ti;body.ct=gc.slice(0,120);body.email=ge;var tk=(gs.t||{})[d.id];if(tk&&gs.k===IDK)body.t=tk;
   go.disabled=true;
   fetch(WK+'/eval',{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)})
   .then(function(r){return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
   .then(function(j){go.disabled=false;
    if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
    gs=gsGet();if(gs.k!==IDK)gs.t={};gs.k=IDK;gs.t=gs.t||{};gs.t[d.id]=j.t;gsPut(gs);
    draft();showDone(!j.created,cv);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
    if(!/@qa\.invalid$/.test(ge))mail(gn,ge,teams,note,gc,cv.fmt)});
   return}
  go.disabled=true;
  fetch(WK+'/eval2',{method:'POST',headers:{'Content-Type':'text/plain','X-Session':A.sess()||''},body:JSON.stringify(body)})
  .then(function(r){
   if(r.status===401){A.expired();return {stop:1}}if(r.status===403){A.blocked();return {stop:1}}
   return r.json().then(function(j){return j&&j.ok?j:null},function(){return null})},function(){return null})
  .then(function(j){
   go.disabled=false;if(j&&j.stop)return;
   if(!j)return fail('沒有送出成功，稍後再試，或來信 vincent@evoscalecapital.com。','That did not go through. Try again shortly, or email vincent@evoscalecapital.com.');
   var u=A.user()||{};ls(DK,null);showDone(typeof j.created==='boolean'?!j.created:saved,cv);saved=true;go.innerHTML=T('更新評估表','Update evaluation');
   mail(u.name||u.email||'',u.email||'',teams,note,((auth&&auth.known)||{}).company_title||'',cv.fmt)})});   /* 11/18 登入填的通知信也帶公司職稱 */
}
})();
</script>
