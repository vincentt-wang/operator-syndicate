<style>
:root{
  --orange:#FF6600;--orange-2:#E55A00;--orange-3:#FF8C42;
  --navy:#0A1628;--navy-2:#0F1E35;--navy-3:#15294a;
  --w-1:#fff;--w-2:rgba(255,255,255,.66);--w-3:rgba(255,255,255,.44);

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{font-family:var(--fb);font-size:18px;line-height:1.6;color:var(--w-1);

  min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,textarea{font-family:inherit}
::selection{background:rgba(255,102,0,.3)}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--orange),var(--orange-3));z-index:99;transition:width .35s var(--ease)}

.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:18px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:800;font-family:var(--fd)}
.langbtn{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--orange-3);border:1px solid rgba(255,140,66,.42);border-radius:20px;padding:7px 16px;transition:all .2s;min-height:38px}
.langbtn:hover{background:rgba(255,140,66,.12)}
.wrap{max-width:680px;margin:0 auto;padding:40px 22px 90px}
.eyebrow{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--orange-3);margin-bottom:16px}
.eyebrow::before{content:'';width:26px;height:2px;background:var(--orange-3);border-radius:2px}
h1{font-family:var(--fd);font-weight:800;font-size:clamp(2rem,6vw,2.9rem);line-height:1.12;letter-spacing:-.02em;margin-bottom:16px}
.lead{font-size:18px;color:var(--w-2);line-height:1.72;margin-bottom:22px}
.lead b{color:var(--w-1)}
.why{display:grid;gap:12px;margin-bottom:20px}
.why div{background:rgba(255,255,255,.045);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:14px;padding:14px 17px;font-size:16.5px;line-height:1.62;color:var(--w-2)}
.why b{color:var(--orange-3)}
.priv{font-size:16px;color:var(--w-2);line-height:1.65;background:rgba(124,217,146,.08);border:1px solid rgba(124,217,146,.28);border-radius:13px;padding:14px 17px}
.priv b{color:#7CD992}
.prog{display:flex;gap:8px;margin:30px 0 22px}
.prog i{flex:1;height:7px;border-radius:99px;background:rgba(255,255,255,.1);transition:.3s}
.prog i.on{background:linear-gradient(90deg,var(--orange),var(--orange-3))}
.steplab{font-family:var(--fd);font-size:22px;font-weight:800;letter-spacing:-.01em;margin-bottom:20px;color:#fff}
.q{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
.q.err{border-color:#FF7A7A;box-shadow:0 0 0 1px rgba(255,122,122,.4)}
.qt{font-size:18.5px;font-weight:700;margin-bottom:4px;line-height:1.4;color:#fff}
.qt .req{font-size:13px;font-weight:700;color:var(--orange-3);margin-left:6px}
.qt .opt{font-size:13px;font-weight:600;color:var(--w-3);margin-left:6px}
.qd{font-size:15.5px;color:var(--w-3);margin-bottom:14px;line-height:1.58}
.qd b{color:var(--w-2)}
.qd .sens{color:var(--orange-3);font-weight:700}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opts button{font-size:16px;font-weight:600;color:var(--w-2);background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:99px;padding:11px 18px;transition:all .16s;min-height:46px}
.opts button.on{color:#fff;background:rgba(255,102,0,.2);border-color:var(--orange)}
.opts button:hover{background:rgba(255,255,255,.09)}
.opts.stack{flex-direction:column;align-items:stretch}
.opts.stack button{text-align:left;border-radius:13px}
.opts button small{display:block;font-size:14px;font-weight:500;opacity:.72;line-height:1.4;margin-top:3px}
.fillpills{margin-top:11px;display:flex;flex-wrap:wrap;gap:8px}
.fillpills .lb{font-size:14.5px;color:var(--w-3);font-weight:600;align-self:center;margin-right:2px}
.fillpills button{font-size:14.5px;font-weight:600;color:var(--w-3);background:none;border:1px dashed var(--line-2);border-radius:99px;padding:8px 14px;min-height:42px}
.fillpills button:hover{border-color:var(--orange);color:var(--orange-3)}
.ctrl{width:100%;font-size:17px;color:#fff;background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:11px;padding:13px 15px;transition:border-color .2s,background .2s}
.ctrl::placeholder{color:rgba(255,255,255,.3)}
.ctrl:focus{outline:none;border-color:var(--orange);background:rgba(255,255,255,.07)}
textarea.ctrl{min-height:88px;resize:vertical;line-height:1.6}
.note-in{margin-top:11px}

.doorrow .mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.doorrow .mini.first{border-top:none;padding-top:0;margin-top:12px}
.doorrow .ml{font-size:14.5px;font-weight:700;color:var(--w-2);width:100%;margin-bottom:2px}
.doorrow .mini button{font-size:15.5px;font-weight:600;color:var(--w-2);background:rgba(255,255,255,.05);border:1px solid var(--line-2);border-radius:99px;padding:9px 15px;min-height:44px;transition:all .16s}
.doorrow .mini button.on{color:#fff;background:rgba(255,102,0,.2);border-color:var(--orange)}
.doorrow .rm{color:var(--w-3);font-size:14.5px;font-weight:600;margin-top:10px}
.doorrow .rm:hover{color:#FF7A7A}
.addrow{width:100%;font-size:16px;font-weight:600;color:var(--w-3);background:none;border:1.5px dashed var(--line-2);border-radius:13px;padding:14px;min-height:48px}
.addrow:hover{color:var(--orange-3);border-color:var(--orange)}
.navrow{display:flex;gap:12px;margin-top:32px}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:17px;font-weight:700;background:var(--orange);color:#fff;border-radius:var(--r-btn);padding:15px 26px;transition:transform .15s,box-shadow .2s,background .2s;box-shadow:0 8px 24px rgba(255,102,0,.28)}
.btn:hover{transform:translateY(-2px);background:var(--orange-2)}
.btn:disabled{opacity:.55;transform:none;box-shadow:none}
.btn.ghost{flex:0 0 30%;background:none;color:var(--w-2);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.06);color:#fff;transform:none}
.errmsg{display:none;color:#FF7A7A;font-weight:600;font-size:16px;margin-top:14px}
.errmsg.show{display:block}
#done{display:none}
.done-badge{display:inline-flex;align-items:center;gap:9px;font-size:15px;font-weight:700;color:#7CD992;background:rgba(124,217,146,.12);border:1px solid rgba(124,217,146,.4);border-radius:99px;padding:8px 16px;margin-bottom:16px}
#done h2{font-family:var(--fd);font-weight:800;font-size:26px;letter-spacing:-.01em;margin-bottom:8px}
#done .dsub{font-size:16px;color:var(--w-3);margin-bottom:20px;line-height:1.6}
.cardwrap{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:18px}
#card{display:block;width:100%;height:auto;border-radius:10px}
.submitbtn{width:100%;font-size:17.5px;font-weight:700;background:var(--orange);color:#fff;border-radius:var(--r-btn);padding:16px;min-height:56px;box-shadow:0 8px 24px rgba(255,102,0,.28);transition:.2s}
.submitbtn:hover{background:var(--orange-2)}
.submitbtn:disabled{opacity:.6}
.submitbtn.ok{background:#1E8E4A;box-shadow:none}
.startb{margin-top:24px}
.suberr{display:none;color:#FF7A7A;font-weight:600;font-size:15px;text-align:center;margin:6px 0}
.suberr.show{display:block}
.selfrow{display:flex;gap:10px;margin:16px 0 8px}
.selfrow button{flex:1;font-size:15.5px;font-weight:700;border:1px solid var(--line-2);border-radius:12px;padding:13px;min-height:50px;color:var(--w-2);background:rgba(255,255,255,.03)}
.selfrow button:hover{border-color:var(--orange);color:#fff}
.selfrow button.ok{border-color:#7CD992;color:#7CD992}
.editln{background:none;color:var(--w-3);font-size:15.5px;font-weight:600;text-decoration:underline;padding:8px 0;margin-top:6px}
.foot{font-size:15px;color:var(--w-3);line-height:1.65;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
@media(max-width:520px){
  .wrap{padding:28px 18px 80px}
  h1{font-size:2rem}.lead{font-size:16.5px}.why div,.priv{font-size:15.5px}
  .steplab{font-size:20px}.qt{font-size:17.5px}
  .opts button,.doorrow .mini button{font-size:15.5px}
  .btn{font-size:16px;padding:14px 18px}.navrow{gap:10px}
}
@media print{header.top,.prog,.steplab,.navrow,.submitbtn,.suberr,.selfrow,.editln,.foot,.done-badge,#done .dsub{display:none!important}body{background:#fff}.cardwrap{border:none;padding:0}}

form.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='addDoor'){S.doors.push({co:'',conf:'',recent:'',rel:'',win:''});$('doorWrap').innerHTML=doorRows();return;}
  if(b.dataset.rm!=null){S.doors.splice(+b.dataset.rm,1);$('doorWrap').innerHTML=doorRows();return;}
  if(b.dataset.dp){var d=S.doors[+b.dataset.i];d[b.dataset.dp]=(d[b.dataset.dp]===b.dataset.v?'':b.dataset.v);$('doorWrap').innerHTML=doorRows();return;}
  if(b.dataset.costat!=null){S.co=b.dataset.costat;var inp=form.querySelector('input[data-f="co"]');if(inp)inp.value=S.co;return;}
  if(!b.dataset.k)return;
  var k=b.dataset.k,v=b.dataset.v,max=+b.dataset.max;
  if(Array.isArray(S[k])){var ix=S[k].indexOf(v);if(ix>=0)S[k].splice(ix,1);else{if(max&&S[k].length>=max)return;S[k].push(v);}}
  else{S[k]=(S[k]===v?'':v);}
  if(k==='depth'||k==='role'){render();return;}
  b.classList.toggle('on');
});
form.addEventListener('input',function(e){var t=e.target;if(t.dataset.f)S[t.dataset.f]=t.value;if(t.dataset.door)S.doors[+t.dataset.i][t.dataset.door]=t.value;});
function valid(){var ok=true;
  document.querySelectorAll('.q.err').forEach(function(q){q.classList.remove('err');});
  document.querySelectorAll('.q[data-req]').forEach(function(q){var k=q.dataset.req,good=true;
    if(k==='name')good=!!S.name.trim();
    else if(k==='doors')good=S.doors.some(function(d){return d.co.trim();});
    else if(Array.isArray(S[k]))good=S[k].length>0;
    else good=!!S[k];
    if(!good){q.classList.add('err');ok=false;}});
  return ok;
}
function lbl(v){return TR(v);}
function output(){var u=U(),L=[];
  L.push(u.oTitle);
  L.push(u.oName+S.name.trim()+(S.co.trim()?'（'+S.co.trim()+'）':''));
  L.push(u.oDom+(S.domains.map(lbl).join('、')||u.oBlank)+(S.domainNote.trim()?'｜'+S.domainNote.trim():''));
  if(S.reach)L.push(u.oReach+lbl(S.reach));
  L.push('');L.push(u.oDoors);
  S.doors.filter(function(d){return d.co.trim();}).forEach(function(d,i){
    var p=[d.co.trim()];if(d.conf)p.push(lbl(d.conf));if(d.recent)p.push(lbl(d.recent));if(d.rel)p.push(lbl(d.rel));if(d.win)p.push(lbl(d.win));
    L.push(' '+(i+1)+'. '+p.join('｜'));});
  L.push('');L.push(u.oHelp);
  if(S.depth)L.push(u.oDepth+lbl(S.depth));
  if(S.freq)L.push(u.oFreq+lbl(S.freq));
  if(S.helpa.length)L.push(u.oHelpa+S.helpa.map(lbl).join('、'));
  if(S.helpb.length)L.push(u.oHelpb+S.helpb.map(lbl).join('、'));
  L.push(u.oRole+(S.role?lbl(S.role):u.oBlank));
  if(S.role==='也想參與投資'&&S.ticket)L.push(u.oTicket+lbl(S.ticket));
  L.push('');L.push(u.oInterest);
  if(S.topics.length)L.push(u.oTopics+S.topics.map(lbl).join('、'));
  if(S.conflict)L.push(u.oConflict+lbl(S.conflict));
  if(S.avoid.trim())L.push(u.oAvoid+S.avoid.trim());
  if(S.ao)L.push(u.oAO+lbl(S.ao));
  if(S.channel.length)L.push(u.oChannel+S.channel.map(lbl).join('、'));
  if(S.note.trim())L.push(u.oNote+S.note.trim());
  return L.join('\n');
}

function drawCard(){var u=U();
  var cv=$('card'),ctx=cv.getContext('2d'),W=1080,PAD=76,cw=W-PAD*2;
  var FB='"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif';
  function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
  function chipLayout(items,fontPx){ctx.font='600 '+fontPx+'px '+FB;var gap=14,padx=26,ch=fontPx+26,rows=[[]],x=0;
    items.forEach(function(it){var w=ctx.measureText(it).width+padx*2;if(x+w>cw&&rows[rows.length-1].length){rows.push([]);x=0;}rows[rows.length-1].push({t:it,w:w});x+=w+gap;});
    return {rows:rows,ch:ch,gap:gap,h:rows.length*(ch+12)-12};}
  var doors=S.doors.filter(function(d){return d.co.trim();}).map(function(d){return d.co.trim()+(d.conf?'  ·  '+lbl(d.conf):'')+(d.rel?'  ·  '+lbl(d.rel):'');});
  var domItems=S.domains.map(lbl).concat(S.domainNote.trim()?[S.domainNote.trim()]:[]);
  var stats=[];
  if(S.depth)stats.push([u.cDepth,lbl(S.depth)]);
  stats.push([u.cRole,(S.role==='也想參與投資')?u.cInvest:u.cIntro]);
  if(S.role==='也想參與投資'&&S.ticket)stats.push([u.cTicket,lbl(S.ticket)]);
  if(S.reach)stats.push([u.cReach,lbl(S.reach)]);
  var topItems=S.topics.map(lbl);
  var y=76+66+56;y+=76;if(S.co.trim())y+=50;y+=34;
  var domL=chipLayout(domItems,30);y+=48+domL.h+30;
  if(doors.length)y+=48+doors.length*54+30;
  y+=48+Math.ceil(stats.length/2)*92+18;
  var topL=null;if(topItems.length){topL=chipLayout(topItems,28);y+=48+topL.h+30;}
  y+=96;var H=Math.max(y,760);cv.width=W;cv.height=H;
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#12264a');g.addColorStop(.5,'#0F1E35');g.addColorStop(1,'#0A1628');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  var rg=ctx.createRadialGradient(W*.85,-60,40,W*.85,-60,700);rg.addColorStop(0,'rgba(255,102,0,.18)');rg.addColorStop(1,'rgba(255,102,0,0)');ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(255,102,0,.5)';ctx.lineWidth=3;rr(14,14,W-28,H-28,26);ctx.stroke();
  y=76;ctx.fillStyle='#FF6600';rr(PAD,y,66,66,16);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='800 34px Georgia,serif';ctx.textAlign='center';ctx.fillText('ES',PAD+33,y+45);ctx.textAlign='left';
  ctx.fillStyle='#FF8C42';ctx.font='800 26px '+FB;ctx.fillText(u.cTag,PAD+86,y+28);
  ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 20px '+FB;ctx.fillText(u.cSub,PAD+86,y+56);
  y+=66+56;ctx.fillStyle='#fff';ctx.font='800 60px '+FB;ctx.fillText(S.name.trim()||'—',PAD,y+8);y+=66;
  if(S.co.trim()){ctx.fillStyle='rgba(255,255,255,.64)';ctx.font='500 30px '+FB;ctx.fillText(S.co.trim(),PAD,y+22);y+=50;}
  y+=20;ctx.strokeStyle='rgba(255,255,255,.14)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();y+=44;
  function label(t){ctx.fillStyle='#FF8C42';ctx.font='800 24px '+FB;ctx.fillText(t,PAD,y);y+=42;}
  function chips(L){L.rows.forEach(function(row){var x=PAD;row.forEach(function(it){ctx.fillStyle='rgba(255,102,0,.16)';rr(x,y,it.w,L.ch,L.ch/2);ctx.fill();ctx.strokeStyle='rgba(255,140,66,.5)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#fff';ctx.font='600 30px '+FB;ctx.textAlign='center';ctx.fillText(it.t,x+it.w/2,y+L.ch/2+10);ctx.textAlign='left';x+=it.w+L.gap;});y+=L.ch+12;});y+=18;}
  label(u.cDom);chips(domL);
  if(doors.length){label(u.cDoors+'（'+doors.length+'）');doors.forEach(function(d){ctx.fillStyle='#FF6600';ctx.beginPath();ctx.arc(PAD+7,y+14,7,0,7);ctx.fill();ctx.fillStyle='#EAF0F6';ctx.font='600 30px '+FB;ctx.fillText(d,PAD+28,y+24);y+=54;});y+=30;}
  label(u.cHelp);var colW=(cw-24)/2;
  stats.forEach(function(st,i){var col=i%2,x=PAD+col*(colW+24),yy=y+Math.floor(i/2)*92;ctx.fillStyle='rgba(255,255,255,.05)';rr(x,yy,colW,76,14);ctx.fill();ctx.strokeStyle='rgba(255,255,255,.1)';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='rgba(255,255,255,.5)';ctx.font='600 22px '+FB;ctx.fillText(st[0],x+22,yy+30);ctx.fillStyle='#fff';ctx.font='700 30px '+FB;ctx.fillText(st[1],x+22,yy+62);});
  y+=Math.ceil(stats.length/2)*92+18;
  if(topL){label(u.cTopics);chips(topL);}
  var d=new Date(),ds=d.getFullYear()+'.'+('0'+(d.getMonth()+1)).slice(-2)+'.'+('0'+d.getDate()).slice(-2);
  ctx.fillStyle='rgba(255,255,255,.4)';ctx.font='500 22px '+FB;ctx.fillText(u.cFoot+ds,PAD,H-46);
}

function showDone(){$('quiz').style.display='none';$('intro').style.display='none';$('done').style.display='block';$('bar').style.width='100%';}
$('startBtn').addEventListener('click',function(){$('intro').style.display='none';$('quiz').style.display='block';render();window.scrollTo({top:0,behavior:'smooth'});});
$('nextBtn').addEventListener('click',function(){
  if(!valid()){$('errmsg').classList.add('show');var er=document.querySelector('.q.err');if(er)window.scrollTo({top:er.offsetTop-70,behavior:'smooth'});return;}
  if(step<STEPS.length-1){step++;render();window.scrollTo({top:0,behavior:'smooth'});return;}
  try{drawCard();}catch(e){}showDone();window.scrollTo({top:0,behavior:'smooth'});
});
$('backBtn').addEventListener('click',function(){if(step>0){step--;render();window.scrollTo({top:0,behavior:'smooth'});}});
$('editBtn').addEventListener('click',function(){$('done').style.display='none';$('quiz').style.display='block';step=STEPS.length-1;render();window.scrollTo({top:0,behavior:'smooth'});});
$('langBtn').addEventListener('click',function(){
  LANG=LANG==='zh'?'en':'zh';renderChrome();
  if($('quiz').style.display==='block')render();
  if($('done').style.display==='block'){try{drawCard();}catch(e){}}
});

var FS_TO='vincent@evoscalecapital.com',FS_CC='boice@evoscalecapital.com';
$('submitBtn').addEventListener('click',function(){var u=U(),b=this,se=$('suberr');se.classList.remove('show');
  if(!S.name.trim()){se.textContent=u.needName;se.classList.add('show');return;}
  b.disabled=true;b.textContent=u.submitting;
  var fd=new FormData();
  fd.append('_subject',u.subj+S.name.trim());fd.append('_cc',FS_CC);fd.append('_captcha','false');fd.append('_template','box');
  fd.append('name',S.name.trim());fd.append('inventory',output());fd.append('_json',JSON.stringify(S));
  fetch('https://formsubmit.co/ajax/'+encodeURIComponent(FS_TO),{method:'POST',headers:{Accept:'application/json'},body:fd})
    .then(function(r){return r.json();})
    .then(function(){b.classList.add('ok');b.textContent=u.submitOk;})
    .catch(function(){b.disabled=false;b.textContent=u.submit;se.textContent=u.submitErr;se.classList.add('show');});
});
$('imgBtn').addEventListener('click',function(){var u=U(),b=this,cv=$('card');
  try{cv.toBlob(function(blob){if(!blob){b.textContent=u.longPress;return;}
    var url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='EvoScale_ResourceMap_'+(S.name.trim()||'card')+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url);},1000);
    b.classList.add('ok');b.textContent=u.savedImg;setTimeout(function(){b.classList.remove('ok');b.textContent=u.saveImg;},1800);
  },'image/png');}catch(e){b.textContent=u.longPress;}
});

renderChrome();
