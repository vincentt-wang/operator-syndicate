<!DOCTYPE html>
<!-- 機構配置切換器 · 用 ← → 鍵或上方分頁切換不同機構的配置頁 · 內部 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Aztron · 機構配置切換器</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700;900&family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1622;--bar:#16202e;--ink:#e8eef4;--ink-2:#9fb0c0;--line:#2a3848;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans','Noto Sans TC',sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--bar);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0}
.title{font-weight:900;font-size:15px;white-space:nowrap}
.title small{font-weight:500;color:var(--ink-2);margin-left:8px;font-size:12px}
.tabs{display:flex;gap:8px;margin-left:6px;flex-wrap:wrap}
.tab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#1c2735;color:var(--ink-2);border-radius:8px;padding:6px 13px;font-size:13px;font-weight:700;cursor:pointer;transition:.15s;white-space:nowrap}
.tab .dot{width:9px;height:9px;border-radius:50%}
.tab.active{color:#fff;border-color:transparent}
.tab.pend{opacity:.5;cursor:default}
.spacer{flex:1}
.arrows{display:flex;gap:6px}
.arrow{width:34px;height:34px;border:1px solid var(--line);background:#1c2735;color:var(--ink);border-radius:8px;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s}
.arrow:hover{background:#243246;border-color:#3a4c60}
.hint{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.nlink{font-size:12px;color:#5fb8d4;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:6px 11px;white-space:nowrap}
.nlink:hover{border-color:#5fb8d4}
.stage{flex:1;overflow:auto;display:flex;justify-content:center;padding:18px;background:#0a121c}
iframe{width:210mm;min-height:297mm;border:none;background:#fff;box-shadow:0 8px 40px rgba(0,0,0,.5);flex-shrink:0}
@media(max-width:900px){iframe{width:100%;min-height:140vw}.title small{display:none}}
</style>
</head>
<body>
<header>
  <div class="title">Aztron · 機構配置切換器<small>同一中立報告 → 不同機構配置</small></div>
  <div class="tabs" id="tabs"></div>
  <div class="spacer"></div>
  <a class="nlink" href="01_中立報告/阿基里斯_A4.html" target="_blank">中立報告 ↗</a>
  <span class="hint">← → 切換</span>
  <div class="arrows"><button class="arrow" onclick="step(-1)">‹</button><button class="arrow" onclick="step(1)">›</button></div>
</header>
<div class="stage"><iframe id="frame" title="機構配置頁"></iframe></div>
<script>
// 要新增機構（如 GVA），在這個陣列加一筆即可：{name, color, file, pending?}
const FUNDS = [
  {name:'EvoScale', color:'#a06a2c', file:'02_機構配置/阿基里斯_EvoScale配置.html'},
  {name:'炙星投創 StarWorks', color:'#6b54b0', file:'02_機構配置/阿基里斯_炙星配置.html'},
  {name:'GVA（待產出）', color:'#3a4c60', pending:true},
  {name:'Bonhope（Pending）', color:'#3a4c60', pending:true},
];
let i = 0;
const tabsEl = document.getElementById('tabs');
const frame = document.getElementById('frame');
FUNDS.forEach((f, idx) => {
  const t = document.createElement('button');
  t.className = 'tab' + (f.pending ? ' pend' : '');
  t.innerHTML = '<span class="dot" style="background:'+f.color+'"></span>' + f.name;
  if(!f.pending) t.onclick = () => show(idx);
  f.el = t; tabsEl.appendChild(t);
});
function show(idx){
  if(FUNDS[idx].pending) return;
  i = idx;
  frame.src = FUNDS[idx].file;
  FUNDS.forEach((f,k) => {
    f.el.classList.toggle('active', k===idx);
    f.el.style.background = (k===idx && !f.pending) ? f.color : '';
  });
}
function step(d){
  let n = i;
  for(let c=0;c<FUNDS.length;c++){ n = (n + d + FUNDS.length) % FUNDS.length; if(!FUNDS[n].pending) break; }
  show(n);
}
document.addEventListener('keydown', e => {
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});
show(0);
</script>
</body>
</html>
